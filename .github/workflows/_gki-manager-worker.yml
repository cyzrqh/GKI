        set -euo pipefail
        case "$KSU_VARIANT" in
          SukiSU) script=tools/build_sukisu_manager.sh ;;
          BakaSU) script=tools/build_bakasu_manager.sh ;;
          *) echo 'Unknown manager variant' >&2; exit 1 ;;
        esac
        bash -n "$script"
        bash "$script" --source "$GITHUB_WORKSPACE/manager-source" --output "$RUNNER_TEMP/manager-build"
      if: (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
    - name: 实际验证八种 KMI 的镜像修补与恢复
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        python3 tools/verify_manager_boot_patch.py --source "$GITHUB_WORKSPACE/manager-source" \
          --module-report "$RUNNER_TEMP/manager-lkm-stage.json" --expected-ref "$KSU_REF" \
          --output "$RUNNER_TEMP/manager-boot-patch-check"
      if: (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
    - name: 签名并校验可安装 APK
      id: sign
      env:
        SUKISU_APK_KEYSTORE: ${{ secrets.SUKISU_APK_KEYSTORE }}
        SUKISU_APK_PASSWORD: ${{ secrets.SUKISU_APK_PASSWORD }}
        KSU_SHORT: ${{ needs.prepare-matrix.outputs.ksu_short }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
      run: |
        python3 tools/sign_sukisu_manager.py --unsigned "$RUNNER_TEMP/manager-build/manager-unsigned.apk" \
          --output-dir "$GITHUB_WORKSPACE/manager-artifact" \
          --build-metadata "$RUNNER_TEMP/manager-build/manager-build-metadata.json"
      if: (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
    - name: 记录管理器真实版本
      env:
        META_FILE: ${{ steps.sign.outputs.apk_filename }}
        META_PACKAGE: ${{ steps.sign.outputs.manager_package }}
        META_KSU_VERSION_CODE: ${{ steps.sign.outputs.manager_version_code }}
        META_KSU_VERSION_NAME: ${{ steps.sign.outputs.manager_version_name }}
        META_KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        META_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        META_MANAGER_CERT_SIZE: ${{ steps.sign.outputs.manager_cert_size }}
        META_MANAGER_CERT_SHA256: ${{ steps.sign.outputs.manager_cert_sha256 }}
        META_APK_SHA256: ${{ steps.sign.outputs.apk_sha256 }}
        META_ENABLE_SUSFS: ${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}
      run: python3 tools/capture_manager_metadata.py --output manager-artifact/manager.json
      if: (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
    - name: 获取并验证官方同版本管理器 APK
      id: official-apk
      if: (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant == 'KernelSU' || inputs.kernelsu_variant
        == 'KowSU' || inputs.kernelsu_variant == 'FinaSU')
      timeout-minutes: 15
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        KSU_SOURCE_BRANCH: ${{ needs.prepare-matrix.outputs.ksu_source_branch }}
      run: |
        python3 tools/official_manager_apk.py --source manager-source --output manager-artifact \
          --variant "$KSU_VARIANT" --expected-ref "$KSU_REF" --tier "$KSU_TIER" \
          --source-branch "$KSU_SOURCE_BRANCH"
    - name: 上传管理器安装包
      uses: actions/upload-artifact@v7
      with:
        path: manager-artifact/${{ steps.sign.outputs.apk_filename || steps.official-apk.outputs.apk_filename }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 保存管理器 Gradle 编译缓存
      uses: actions/cache/save@v5
      if: (always() && !cancelled() && steps.manager-build.outcome == 'success' && steps.manager-gradle-build-cache.outputs.cache-primary-key
        != '' && steps.manager-gradle-build-cache.outputs.cache-hit != 'true') && (inputs.kernelsu_variant == 'SukiSU' ||
        inputs.kernelsu_variant == 'BakaSU')
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: ~/.gradle/caches/build-cache-1
        key: ${{ steps.manager-gradle-build-cache.outputs.cache-primary-key }}
    - name: 保存管理器 Gradle 依赖
      uses: actions/cache/save@v5
      if: (always() && !cancelled() && steps.manager-build.outcome != 'skipped' && steps.manager-gradle-cache.outputs.cache-primary-key
        != '' && steps.manager-gradle-cache.outputs.cache-hit != 'true') && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant
        == 'BakaSU')
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: ${{ steps.manager-gradle-cache.outputs.cache-primary-key }}
    - name: 保存管理器 Cargo 依赖
      uses: actions/cache/save@v5
      if: (always() && !cancelled() && steps.manager-build.outcome != 'skipped' && steps.manager-cargo-cache.outputs.cache-primary-key
        != '' && steps.manager-cargo-cache.outputs.cache-hit != 'true') && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant
        == 'BakaSU')
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          manager-source/target/*/release/deps
          manager-source/target/*/release/build
          manager-source/target/*/release/.fingerprint
          manager-source/target/release/deps
          manager-source/target/release/build
          manager-source/target/release/.fingerprint
          !manager-source/target/**/release/deps/ksud-*
          !manager-source/target/**/release/deps/ksuinit-*
        key: ${{ steps.manager-cargo-cache.outputs.cache-primary-key }}
  build-kernel:
    name: ${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}-${{
      inputs.kernelsu_variant }}
    runs-on: ${{ vars.KERNEL_SELF_HOSTED == 'false' && 'ubuntu-24.04' || (startsWith(vars.KERNEL_RUNNER, '[') && fromJSON(vars.KERNEL_RUNNER)
      || vars.KERNEL_RUNNER || 'ubuntu-24.04') }}
    timeout-minutes: 120
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_NOHARDLINK: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1536M
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
      GKI_MANAGER_METADATA: ${{ needs.build-sukisu-manager.outputs.manager_metadata }}
    steps:
    - name: 设置组合构建文件名
      if: env.GKI_COMBINED_WORKER == 'true'
      run: echo "GKI_MANAGER_SUFFIX=-${KSU_VARIANT}" >> "$GITHUB_ENV"
    - name: 构建信息摘要
      shell: bash
      run: |
        set -euo pipefail

        effective_use_zram="${{ inputs.use_zram }}"
        effective_zram_full_algo="${{ inputs.zram_full_algo }}"
        effective_zram_extra_algos="${{ inputs.zram_extra_algos || '' }}"
        effective_zram_legacy_lz4k="true"
        effective_zram_use_optional_algo="false"

        if [ "${{ matrix.kernel_version }}" = "6.12" ]; then
          effective_zram_legacy_lz4k="false"
          if [ "$effective_zram_full_algo" = "true" ]; then
            echo "::warning::Android16/6.12 会跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS 补丁栈，仅保留内核原生支持的 ZRAM 算法。"
          fi
          if [ -n "$effective_zram_extra_algos" ]; then
            filtered_algos="$(python3 -c 'import sys; blocked={\"lz4k\",\"lz4kd\",\"lz4k_oplus\"}; print(\",\".join(item.strip() for item in sys.argv[1].split(\",\") if item.strip() and item.strip().lower() not in blocked))' "$effective_zram_extra_algos")"
            if [ "$filtered_algos" != "$effective_zram_extra_algos" ]; then
              echo "::warning::Android16/6.12 不支持 legacy LZ4K/LZ4KD/LZ4K_OPLUS，已自动从自定义算法列表移除。"
            fi
            effective_zram_extra_algos="$filtered_algos"
          fi
        fi

        if [ "$effective_use_zram" = "true" ] && [ "$effective_zram_full_algo" != "true" ] && [ -n "$effective_zram_extra_algos" ]; then
          if python3 -c 'import sys; algos=[item.strip().lower() for item in sys.argv[1].split(",") if item.strip()]; raise SystemExit(0 if "zstdp" in algos else 1)' "$effective_zram_extra_algos"; then
            effective_zram_use_optional_algo="true"
          fi
        fi

        {
          echo "EFFECTIVE_USE_ZRAM=$effective_use_zram"
          echo "EFFECTIVE_ZRAM_FULL_ALGO=$effective_zram_full_algo"
          echo "EFFECTIVE_ZRAM_EXTRA_ALGOS=$effective_zram_extra_algos"
          echo "EFFECTIVE_ZRAM_LEGACY_LZ4K=$effective_zram_legacy_lz4k"
          echo "EFFECTIVE_ZRAM_USE_OPTIONAL_ALGO=$effective_zram_use_optional_algo"
        } >> "$GITHUB_ENV"

        effective_ksu_branch="${{ needs.prepare-matrix.outputs.effective_ksu_branch }}"
        if [ "$effective_ksu_branch" = "SUSFS(自动)" ]; then
          effective_ksu_branch="Stable(标准)"
        fi
        echo "EFFECTIVE_KSU_BRANCH=$effective_ksu_branch" >> "$GITHUB_ENV"

        zram_extra_label="${effective_zram_extra_algos:-无}"

        echo "========================================"
        echo "       内核构建配置摘要"
        echo "========================================"
        echo "Android 版本  : ${{ matrix.android_version }}"
        echo "内核版本      : ${{ matrix.kernel_version }}"
        echo "子版本号      : ${{ matrix.sub_level }}"
        echo "补丁级别      : ${{ matrix.os_patch_level }}"
        echo "KSU 变体      : ${{ inputs.kernelsu_variant }}"
        echo "KSU 分支      : $effective_ksu_branch"
        echo "管理器包名    : ${GKI_MANAGER_PACKAGE:-由所选 KernelSU 决定}"
        echo "构建时间      : ${{ inputs.build_time }}"
        echo "SUSFS 状态    : ${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}"
        echo "ZRAM 增强     : $effective_use_zram"
        echo "ZRAM 完整算法 : $effective_zram_full_algo"
        echo "ZRAM 额外算法 : $zram_extra_label"
        echo "BBG 补丁      : ${{ inputs.use_bbg }}"
        echo "DDK LSM       : ${{ inputs.use_ddk }}"
        echo "NTsync 补丁   : ${{ inputs.use_ntsync }}"
        echo "Networing 增强: ${{ inputs.use_networking }}"
        echo "KPM 功能      : ${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')) }}"
        echo "KPM 密码      : ${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') && inputs.kpm_password || '') && '已自定义' || '默认' }}"
        echo "Re-Kernel     : ${{ inputs.use_rekernel }}"
        echo "虚拟化支持   : ${{ (inputs.virtualization_support == 'off' && 'off' || (matrix.kernel_version == '6.12' && 'on' || (inputs.virtualization_support == 'on' && '678' || inputs.virtualization_support))) }}"
        echo "自定义注入    : ${{ inputs.custom_external_modules != '' }}"
        echo "内核选项覆盖  : ${{ inputs.custom_kernel_options != '' }}"
        echo "Stock Config  : 自动检测 config/stock_defconfig"
        echo "========================================"
    - name: 检出代码仓库
      uses: actions/checkout@v6
    - name: 校验自定义内核版本组合
      shell: bash
      run: |
        set -euo pipefail

        android_version="${{ matrix.android_version }}"
        kernel_version="${{ matrix.kernel_version }}"
        sub_level="${{ matrix.sub_level }}"
        os_patch_level="${{ matrix.os_patch_level }}"
        combo="${android_version}-${kernel_version}"

        case "$combo" in
          android12-5.10|android13-5.15|android14-6.1|android15-6.6|android16-6.12) ;;
          *)
            echo "::error::不支持的 Android/内核组合: ${android_version}/${kernel_version}"
            echo "::error::当前工作流支持: android12/5.10, android13/5.15, android14/6.1, android15/6.6, android16/6.12"
            exit 1
            ;;
        esac

        if [ "${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')) }}" = "true" ] \
          && [ "${{ inputs.kernelsu_variant }}" = "Official" ]; then
          echo "::error::Official / KernelSU 变体不支持 KPM，请关闭 KPM 后重试。"
          exit 1
        fi

        if [ "$sub_level" = "X" ] || [ "$os_patch_level" = "lts" ]; then
          if [ "$sub_level" = "X" ] && [ "$os_patch_level" = "lts" ]; then
            echo "LTS 构建组合校验通过: ${combo}.${sub_level}-${os_patch_level}"
            exit 0
          fi
          echo "::error::LTS 构建必须同时使用 sub_level=X 和 os_patch_level=lts"
          exit 1
        fi

        KNOWN_KERNEL_PAIRS=$(python3 - <<'PY'
        import os,sys
        from pathlib import Path
        root = Path(os.environ['GITHUB_WORKSPACE'])
        sys.path.insert(0, str(root / 'tools'))
        from matrix import load_catalog
        for entry in load_catalog(root)['entries']:
            if entry['date'] != 'lts':
                print(entry['android_version'], entry['kernel_version'], entry['kernel'].rsplit('.', 1)[1], entry['date'])
        PY
        )

        if awk -v a="$android_version" -v k="$kernel_version" -v s="$sub_level" -v p="$os_patch_level" \
          '$1 == a && $2 == k && $3 == s && $4 == p { found = 1 } END { exit found ? 0 : 1 }' <<< "$KNOWN_KERNEL_PAIRS"; then
          echo "内核版本组合校验通过: ${kernel_version}.${sub_level}-${android_version}-${os_patch_level}"
          exit 0
        fi

        patches_for_sub=$(awk -v a="$android_version" -v k="$kernel_version" -v s="$sub_level" \
          '$1 == a && $2 == k && $3 == s { print $4 }' <<< "$KNOWN_KERNEL_PAIRS" | sort -u | tr '\n' ' ')
        sublevels_for_patch=$(awk -v a="$android_version" -v k="$kernel_version" -v p="$os_patch_level" \
          '$1 == a && $2 == k && $4 == p { print $3 }' <<< "$KNOWN_KERNEL_PAIRS" | sort -n -u | tr '\n' ' ')

        echo "::error::内核版本和安全补丁级别不匹配: ${kernel_version}.${sub_level}-${android_version}-${os_patch_level}"
        if [ -n "$patches_for_sub" ]; then
          echo "::error::${android_version}/${kernel_version}.${sub_level} 可用补丁级别: ${patches_for_sub}"
        fi
        if [ -n "$sublevels_for_patch" ]; then
          echo "::error::${android_version}/${kernel_version}/${os_patch_level} 可用子版本号: ${sublevels_for_patch}"
        fi
        exit 1
    - name: 清理磁盘空间
      if: runner.environment == 'github-hosted'
      timeout-minutes: 8
      env:
        GKI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: python3 "$GITHUB_WORKSPACE/tools/free_build_space.py"
    - name: 确定 KernelSU 分支
      if: inputs.kernelsu_variant != 'None'
      id: ksu-branch
      env:
        BRANCH: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        RESOLVED_KSU_REPO: ${{ needs.prepare-matrix.outputs.ksu_repo }}
        RESOLVED_KSU_SOURCE_BRANCH: ${{ needs.prepare-matrix.outputs.ksu_source_branch }}
        EFFECTIVE_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        keys = ('BRANCH', 'RESOLVED_KSU_REPO', 'RESOLVED_KSU_SOURCE_BRANCH', 'EFFECTIVE_KSU_BRANCH')
        with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
            for key in keys:
                value = os.environ[key]
                if '\n' in value or '\r' in value:
                    raise SystemExit('Invalid shared KernelSU source metadata')
                output.write(f'{key}={value}\n')
        PY
    - name: 初始化构建环境
      run: |
        CONFIG="${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
        KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
        mkdir -p "$KERNEL_ROOT"

        cat >> $GITHUB_ENV << EOF
        CONFIG=$CONFIG
        KERNEL_ROOT=$KERNEL_ROOT
        DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
        SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
        KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
        SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
        ZZH_PATCHES=$GITHUB_WORKSPACE
        CUSTOM_EXTERNAL_MODULES_MANIFEST=$GITHUB_WORKSPACE/custom_external_modules.tsv
        ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
        ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
        AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
        MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
        UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
        BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
        EOF

        mkdir -p "$GITHUB_WORKSPACE/git-repo"
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
        chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
        echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV
    - name: 显示配置信息
      run: |
        CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
        if [ -f "$CONFIG_FILE" ]; then
          echo "加载配置文件: $CONFIG_FILE"
          cat "$CONFIG_FILE"
        fi
    - name: 安装编译依赖
      timeout-minutes: 15
      run: |
        disable_broken_chrome_source() {
          if [ "${{ runner.environment }}" != "github-hosted" ]; then
            echo "保留自托管 Runner 的 Chrome APT 源"
            return 0
          fi
          local source
          while IFS= read -r source; do
            echo "::warning::禁用与构建无关的 Chrome APT 源: $source"
            sudo rm -f "$source"
          done < <(sudo grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
        }

        apt_update_retry() {
          local attempt
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update; then
              return 0
            fi
            echo "::warning::apt-get update 第 ${attempt} 次失败，清理索引后重试。"
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep "$attempt"
          done
          echo "::error::apt-get update 连续失败。"
          return 1
        }

        disable_broken_chrome_source
        apt_update_retry
        sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 -o DPkg::Lock::Timeout=60 install -y ccache python3 python3-cryptography git curl build-essential libssl-dev bison flex libelf-dev dwarves lz4
    - name: 配置自托管下载缓存
      env:
        ABK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        KERNEL_LOCAL_CACHE: ${{ vars.KERNEL_LOCAL_CACHE || 'auto' }}
        KERNEL_LOCAL_CACHE_DIR: ${{ vars.KERNEL_LOCAL_CACHE_DIR }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" configure
    - name: 配置 ccache
      run: |
        set -euo pipefail
        export CCACHE_DIR="$HOME/.ccache"
        mkdir -p "$CCACHE_DIR"
        mkdir -p ~/.cache/bazel
        ccache --version
        ccache --max-size=2G
        ccache --set-config=compression=true
        ccache --set-config=hard_link=false
        echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
    - name: 缓存工具链
      if: inputs.artifact_mode != '仅 AK3' && (env.ABK_LOCAL_CACHE_ENABLED != 'true')
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: |
          kernel-build-tools
          mkbootimg
        key: toolchain-${{ runner.os }}-${{ inputs.artifact_mode == '仅 AK3' && 'ak3' || 'boot' }}-v2
    - name: 下载工具链
      if: inputs.artifact_mode != '仅 AK3' && (steps.cache-toolchain.outputs.cache-hit != 'true')
      run: |
        AOSP_MIRROR=https://android.googlesource.com
        BRANCH=main-kernel-build-2024

        retry_toolchain_clone() {
          local repo_url="$1"
          local target_dir="$2"
          local attempt
          for attempt in 1 2 3; do
            rm -rf "$target_dir"
            if python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" clone \
              "$repo_url" "$target_dir" --ref "$BRANCH" --depth 1; then
              return 0
            fi
            echo "::warning::工具链克隆失败: $repo_url (attempt ${attempt}/3)"
            sleep "$((attempt * 5))"
          done
          echo "::error::工具链克隆连续失败: $repo_url"
          return 1
        }

        retry_toolchain_clone "$AOSP_MIRROR/kernel/prebuilts/build-tools" kernel-build-tools
        retry_toolchain_clone "$AOSP_MIRROR/platform/system/tools/mkbootimg" mkbootimg
    - name: 生成签名密钥
      run: |
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH
      if: inputs.artifact_mode != '仅 AK3'
    - name: 配置 Git
      run: |
        git config --global user.name "BuildBot"
        git config --global user.email "BuildGkiKernel@gmail.com"
    - name: 还原本次固定源码缓存
      id: source-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
        fail-on-cache-miss: false
      if: ((inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next'
        || inputs.kernelsu_variant == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
    - name: 从官方固定提交恢复并核实源码
      id: source-backup
      if: (((inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next'
        || inputs.kernelsu_variant == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU')))
        && steps.source-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
        KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ inputs.operation == '编译内核' && (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') || false
          }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER"
    - name: 重新缓存本次已验证的固定源码
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: steps.source-cache.outputs.cache-hit != 'true' && steps.source-backup.outcome == 'success'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
    - name: 核对固定源码与准备任务的完整身份
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
      run: |
        python3 tools/transfer_ksu_snapshot.py verify-cache \
          --source "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY"
      if: ((inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next'
        || inputs.kernelsu_variant == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
    - name: 克隆依赖仓库
      run: |
        ANYKERNEL_BRANCH="gki-2.0"
        SUSFS_BRANCH="gki-${{ matrix.android_version }}-${{ matrix.kernel_version }}"

        echo "克隆 AnyKernel3..."
        python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" clone \
          https://github.com/WildKernels/AnyKernel3.git AnyKernel3 --ref "$ANYKERNEL_BRANCH" --depth 1
        rm -rf AnyKernel3/.git

        if [ "${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}" == "true" ]; then
          echo "离线还原本次固定的 SUSFS (分支: $SUSFS_BRANCH)..."
          python3 "$GITHUB_WORKSPACE/tools/shared_susfs_source.py" restore \
            --input "$GITHUB_WORKSPACE/ksu-source-bundle" --output "$SUSFS4KSU" \
            --target "${{ matrix.android_version }}-${{ matrix.kernel_version }}" \
            --expected-ref "$BRANCH" --expected-sources "$SUSFS_SOURCES" \
            --variant "$KSU_VARIANT"

          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "SUSFS 仓库最新提交日期: $SUSFS_LATEST_COMMIT_DATE"
        else
          echo "SUSFS 已禁用，跳过 SUSFS 仓库克隆。"
          echo "SUSFS_LATEST_COMMIT_DATE=禁用" >> $GITHUB_ENV
        fi

        echo "准备补丁资源..."
        python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" clone \
          https://github.com/WildKernels/kernel_patches.git kernel_patches
        python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" clone \
          https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch
        echo "使用当前仓库补丁目录: $ZZH_PATCHES"
        python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" clone \
          https://github.com/Numbersf/Action-Build.git Action-Build --depth 1
      env:
        SUSFS_SOURCES: ${{ needs.prepare-matrix.outputs.susfs_sources }}
    - name: 选择配套的 SUSFS 源码版本
      if: (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') && inputs.kernelsu_variant == 'SukiSU'
      env:
        PIN_KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        PIN_KSU_REF: ${{ env.BRANCH }}
        PIN_KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        PIN_TARGET: ${{ matrix.android_version }}-${{ matrix.kernel_version }}
      run: |
        python3 "$GITHUB_WORKSPACE/tools/pin_build_dependencies.py" \
          --root "$GITHUB_WORKSPACE" --susfs-dir "$SUSFS4KSU" \
          --ksu-variant "$PIN_KSU_VARIANT" --ksu-ref "$PIN_KSU_REF" \
          --ksu-tier "$PIN_KSU_TIER" --target "$PIN_TARGET"
    - name: 克隆自定义外部模块
      if: inputs.custom_external_modules != ''
      env:
        CUSTOM_EXTERNAL_MODULES: ${{ inputs.custom_external_modules }}
      run: |
        set -euo pipefail

        trim() {
          sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
        }

        normalize_stage() {
          local raw="$1"
          local stage
          stage=$(printf '%s' "$raw" | tr '[:upper:] -' '[:lower:]__')
          case "$stage" in
            after_patch)
              printf '%s\n' "after_patch"
              ;;
            before_build|befor_build)
              printf '%s\n' "before_build"
              ;;
            *)
              return 1
              ;;
          esac
        }

        modules_input="$(printf '%s' "$CUSTOM_EXTERNAL_MODULES" | tr -d '\r')"
        manifest="$CUSTOM_EXTERNAL_MODULES_MANIFEST"
        : > "$manifest"

        if [ -z "$(printf '%s' "$modules_input" | trim)" ]; then
          echo "已启用自定义外部模块，但未配置模块字符串，跳过克隆。"
          exit 0
        fi

        IFS='|' read -r -a module_blocks <<< "$modules_input"
        index=0
        for block in "${module_blocks[@]}"; do
          block="$(printf '%s' "$block" | trim)"
          [ -n "$block" ] || continue

          if [[ "$block" != *";"* ]]; then
            echo "::error::自定义外部模块格式错误，缺少分号: $block"
            exit 1
          fi

          lhs="$(printf '%s' "${block%%;*}" | trim)"
          stage_raw="$(printf '%s' "${block#*;}" | trim)"
          entry_kind="module"
          group_repo_url=""
          child_id=""

          case "$lhs" in
            module:*)
              repo_url="$(printf '%s' "${lhs#module:}" | trim)"
              ;;
            set:*)
              descriptor="$(printf '%s' "${lhs#set:}" | trim)"
              if [[ "$descriptor" != *"#"* ]]; then
                echo "::error::模块集格式错误，缺少子模块 id: $block"
                exit 1
              fi
              group_repo_url="$(printf '%s' "${descriptor%%#*}" | trim)"
              child_id="$(printf '%s' "${descriptor#*#}" | trim)"
              repo_url="$group_repo_url"
              entry_kind="module_set_child"
              ;;
            *)
              repo_url="$lhs"
              ;;
          esac

          if [ -z "$repo_url" ] || [ -z "$stage_raw" ]; then
            echo "::error::自定义外部模块格式错误，链接或阶段为空: $block"
            exit 1
          fi

          if [ "$entry_kind" = "module_set_child" ] && [ -z "$child_id" ]; then
            echo "::error::模块集子模块 id 不能为空: $block"
            exit 1
          fi

          case "$repo_url" in
            http://*|https://*|git://*|ssh://*|git@*) ;;
            *)
              echo "::error::自定义外部模块链接不支持: $repo_url"
              exit 1
              ;;
          esac

          if ! stage="$(normalize_stage "$stage_raw")"; then
            echo "::error::自定义外部模块阶段不支持: $stage_raw（仅支持 after_patch / before_build）"
            exit 1
          fi

          index=$((index + 1))
          repo_name="${repo_url##*/}"
          repo_name="${repo_name%.git}"
          repo_name="$(printf '%s' "$repo_name" | sed 's/[^A-Za-z0-9._-]/_/g')"
          [ -n "$repo_name" ] || repo_name="module"
          module_dir="$GITHUB_WORKSPACE/custom_external_module_$(printf '%02d' "$index")-$repo_name"

          echo "克隆自定义外部模块 #$index ($stage/$entry_kind): $repo_url"
          git clone --depth 1 "$repo_url" "$module_dir"
          echo "external module checkout #$index:"
          echo "  repo_url: $repo_url"
          echo "  module_dir: $module_dir"
          echo "  head_sha: $(git -C "$module_dir" rev-parse HEAD)"
          echo "  branch: $(git -C "$module_dir" branch --show-current || true)"
          echo "  origin: $(git -C "$module_dir" remote get-url origin)"
          echo "  head_log: $(git -C "$module_dir" log -1 --oneline)"
          printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$stage" \
            "$module_dir" \
            "$repo_url" \
            "$entry_kind" \
            "$group_repo_url" \
            "$child_id" >> "$manifest"
        done

        if [ ! -s "$manifest" ]; then
          echo "未解析到有效自定义外部模块。"
        else
          echo "自定义外部模块清单:"
          cut -f1,3 "$manifest"
        fi
    - name: 检出内核配套的管理器快照
      if: ((inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next'
        || inputs.kernelsu_variant == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        python3 tools/checkout_ksu_snapshot.py --input "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --output "$KERNEL_ROOT/KernelSU" --expected-ref "$KSU_REF"
    - name: 初始化并同步内核源码
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        GKI_ANDROID: ${{ matrix.android_version }}
        GKI_KERNEL: ${{ matrix.kernel_version }}
        GKI_SUBLEVEL: ${{ matrix.sub_level }}
        GKI_PATCH: ${{ matrix.os_patch_level }}
        GKI_KERNEL_REF: ${{ matrix.kernel_ref }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/cached-downloads.py" clone \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc --depth 1
        formatted_branch="${GKI_ANDROID}-${GKI_KERNEL}-${GKI_PATCH}"
        "$REPO" init --depth=1 -u https://android.googlesource.com/kernel/manifest \
          -b "common-${formatted_branch}" --repo-rev=v2.16
        python3 "$GITHUB_WORKSPACE/tools/set_kernel_ref.py" \
          --manifest-root "$KERNEL_ROOT/.repo/manifests" \
          --kernel-ref "$GKI_KERNEL_REF" --branch "$formatted_branch"
        python3 "$GITHUB_WORKSPACE/tools/optimize_manifest_fetch.py" \
          --manifest-root "$KERNEL_ROOT/.repo/manifests"
        for attempt in 1 2 3; do
          if "$REPO" --trace sync -c -j"$(nproc --all)" --no-tags --fail-fast; then
            python3 "$GITHUB_WORKSPACE/tools/validate_kernel_source.py" \
              --kernel-root "$KERNEL_ROOT" --family "$GKI_KERNEL" --sublevel "$GKI_SUBLEVEL"
            exit 0
          fi
          echo "::warning::源码同步失败（${attempt}/3）"
          sleep "$((attempt * 5))"
        done
        exit 1
    - name: 应用 Stock Config 伪装
      run: |
        STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
        STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

        if [ ! -f "$STOCK_SRC" ]; then
          echo "未检测到 $STOCK_SRC，跳过 Stock Config 伪装。"
          exit 0
        fi

        mkdir -p "$(dirname "$STOCK_DST")"
        if ! cp "$STOCK_SRC" "$STOCK_DST"; then
          echo "::error::复制 stock_defconfig 失败: $STOCK_SRC -> $STOCK_DST"
          exit 1
        fi
        echo "已复制 stock_defconfig -> $STOCK_DST"

        NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
        OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
        TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

        if [ ! -f "$TARGET_MAKEFILE" ]; then
          echo "::error::未找到 $TARGET_MAKEFILE"
          exit 1
        fi

        if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
          echo "config_data 规则已是 stock_defconfig，跳过。"
        elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
          sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
          echo "已替换 config_data 规则: $TARGET_MAKEFILE"
        else
          echo "::error::未在 $TARGET_MAKEFILE 找到规则: $OLD_RULE"
          exit 1
        fi
    - name: 提取实际子版本号
      run: |
        ACTUAL_SUBLEVEL="${{ matrix.sub_level }}"
        if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
          EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
          [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
        fi
        echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
        echo "实际子版本号: $ACTUAL_SUBLEVEL"
    - name: 修复 glibc 2.38 兼容性
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        RAW_SUB="${{ matrix.sub_level }}"
        [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

        NEEDS_FIX=false
        if [[ "${{ matrix.android_version }}" == "android13" && "${{ matrix.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
           [[ "${{ matrix.android_version }}" == "android13" && "${{ matrix.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
           [[ "${{ matrix.android_version }}" == "android14" && "${{ matrix.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
          NEEDS_FIX=true
        fi

        if [ "$NEEDS_FIX" = true ]; then
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            echo "应用 glibc 2.38 兼容性修复..."
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

            if [[ "${{ matrix.kernel_version }}" == "5.10" || "${{ matrix.kernel_version }}" == "5.15" ]]; then
              sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
            fi
          fi
        fi
    - name: 添加一加 8E 处理器支持
      if: inputs.supp_op
      working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
      run: |
        echo "下载一加 8E 支持补丁..."
        cp "$GITHUB_WORKSPACE/hmbird_patch.c" ./hmbird_patch.c
        echo "obj-y += hmbird_patch.o" >> Makefile
    - name: 添加 KernelSU
      if: inputs.kernelsu_variant != 'None'
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: kernelsu
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: KernelSU integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        case "$KSU_VARIANT" in
          "SukiSU")
            python3 "$GITHUB_WORKSPACE/tools/integrate_sukisu.py" --kernel-root "$KERNEL_ROOT" --expected-ref "$BRANCH"
            ;;
          "BakaSU")
            python3 "$GITHUB_WORKSPACE/tools/integrate_sukisu.py" --kernel-root "$KERNEL_ROOT" --expected-ref "$BRANCH"
            ;;
          "KernelSU-Next"|"KernelSU"|"KowSU"|"FinaSU")
            python3 "$GITHUB_WORKSPACE/tools/integrate_sukisu.py" --kernel-root "$KERNEL_ROOT" --expected-ref "$BRANCH"
            ;;
          *) echo "Unsupported paired manager" >&2; exit 1 ;;
        esac
    - name: 应用完整 SukiSU SUSFS 2.3 适配
      if: env.SUSFS_COMPAT_VERSION == 'v2.3.0'
      run: |
        python3 "$GITHUB_WORKSPACE/tools/apply_susfs23.py" \
          --kernel-root "$KERNEL_ROOT" --susfs-dir "$SUSFS4KSU"
    - name: 确保 KernelSU SUSFS ABI 兼容
      if: env.SUSFS_COMPAT_VERSION != 'v2.3.0' && ((inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
        && (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU'))
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: kernelsu
        ABK_FEATURE_FAILURE_MESSAGE: KernelSU SUSFS ABI compatibility integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ensure-ksu-compat.py" "$KERNEL_ROOT"
    - name: 配置 SukiSU 管理器信息
      if: inputs.kernelsu_variant == 'SukiSU'
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: kernelsu
        ABK_FEATURE_FAILURE_MESSAGE: SukiSU manager version integration failed
      working-directory: ${{ env.KERNEL_ROOT }}/KernelSU
      run: |
        KBUILD_FILE="./kernel/Kbuild"
        CUSTOM_TAG="${{ vars.MANAGER_STR }}"

        if [ ! -f "$KBUILD_FILE" ]; then
          echo "未找到 $KBUILD_FILE，跳过 SukiSU 版本标识定制"
          exit 0
        fi

        GIT_HASH=$(git rev-parse --short=8 HEAD)
        BRANCH_NAME="${BRANCH#-s }"
        if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "$BRANCH" ]; then
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
        fi

        if [ -n "$CUSTOM_TAG" ]; then
          VERSION_TEMPLATE="v\$1-$CUSTOM_TAG@$BRANCH_NAME[$GIT_HASH]"
        else
          VERSION_TEMPLATE="v\$1-$GIT_HASH@$BRANCH_NAME"
        fi

        awk -v body="$VERSION_TEMPLATE" '
          BEGIN {
            in_block = 0
            replaced = 0
          }
          /^[[:space:]]*define get_ksu_version_full$/ {
            print
            print body
            in_block = 1
            replaced = 1
            next
          }
          in_block && /^[[:space:]]*endef$/ {
            print
            in_block = 0
            next
          }
          !in_block {
            print
          }
          END {
            if (!replaced) {
              exit 1
            }
          }
        ' "$KBUILD_FILE" > "${KBUILD_FILE}.tmp" && mv "${KBUILD_FILE}.tmp" "$KBUILD_FILE"

        echo "已更新 get_ksu_version_full 模板: $VERSION_TEMPLATE"
    - name: 接入新增管理器的原生 SUSFS 接口
      if: (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') && (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU')
      run: python3 tools/additional_manager_integration.py --kernel-root "$KERNEL_ROOT" --susfs-dir "$SUSFS4KSU"
    - name: 应用 SUSFS 补丁
      if: (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') && inputs.kernelsu_variant != 'None'
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: susfs
        ABK_FEATURE_END: 'false'
        ABK_FEATURE_FAILURE_MESSAGE: SUSFS patch failed
        ABK_ANDROID_VERSION: ${{ matrix.android_version }}
        ABK_KERNEL_VERSION: ${{ matrix.kernel_version }}
        ABK_KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        ABK_SUB_LEVEL: ${{ matrix.sub_level }}
        ABK_OS_PATCH_LEVEL: ${{ matrix.os_patch_level }}
        ABK_USE_BBG: ${{ inputs.use_bbg }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        echo "应用 SUSFS 补丁..."
        # 读取 SUSFS 上游版本（例如 v2.1.0），用于匹配修复补丁目录
        SUSFS_VERSION=$(grep -E '^#define[[:space:]]+SUSFS_VERSION' "$SUSFS4KSU/kernel_patches/include/linux/susfs.h" | awk '{print $3}' | tr -d '"' | sed 's/^v//')
        if [ -z "$SUSFS_VERSION" ]; then
          SUSFS_VERSION="2.0.0"
        fi

        resolve_susfs_fix_root() {
          local version="$1"
          local candidate
          for candidate in \
            "$KERNEL_PATCHES/wild/susfs_fix_patches/v${version}" \
            "$KERNEL_PATCHES/wild/archived/susfs_fix_patches/v${version}" \
            "$KERNEL_PATCHES/ksu/susfs_fix_patches/v${version}"; do
            if [ -d "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          done
          return 1
        }

        SUSFS_FIX_VERSION="$SUSFS_VERSION"
        SUSFS_FIX_ROOT="$(resolve_susfs_fix_root "$SUSFS_FIX_VERSION" || true)"
        if [ -z "$SUSFS_FIX_ROOT" ] && [ "$SUSFS_FIX_VERSION" != "2.0.0" ]; then
          echo "未找到 v${SUSFS_FIX_VERSION} 的 SUSFS 修复补丁，回退 v2.0.0"
          SUSFS_FIX_VERSION="2.0.0"
          SUSFS_FIX_ROOT="$(resolve_susfs_fix_root "$SUSFS_FIX_VERSION" || true)"
        fi

        SUSFS_KSU_FIX_ROOT=""
        if [ -d "$KERNEL_PATCHES/ksu/susfs_fix_patches/v${SUSFS_FIX_VERSION}" ]; then
          SUSFS_KSU_FIX_ROOT="$KERNEL_PATCHES/ksu/susfs_fix_patches/v${SUSFS_FIX_VERSION}"
        fi

        if [ -n "$SUSFS_FIX_ROOT" ]; then
          echo "SUSFS 修复补丁版本: v${SUSFS_FIX_VERSION}"
          echo "SUSFS 修复补丁目录: ${SUSFS_FIX_ROOT#$KERNEL_PATCHES/}"
        else
          echo "::warning::未找到可用的 SUSFS 修复补丁目录，将仅依赖源码兜底修复"
        fi

        apply_susfs_patch_file() {
          local rel_path="$1"
          local patch_source=""

          # The 2.0 fdinfo fix lacks the 2.3 SUS_KSTAT branch. Prepare the old
          # native context for the complete 2.3 patch and verify it afterwards.
          if [ "$SUSFS_VERSION" = "2.3.0" ] && [[ "$rel_path" == */fdinfo.c.patch ]]; then
            return 0
          fi

          if [ -n "$SUSFS_FIX_ROOT" ] && [ -f "$SUSFS_FIX_ROOT/$rel_path" ]; then
            patch_source="$SUSFS_FIX_ROOT/$rel_path"
          elif [ -n "$SUSFS_KSU_FIX_ROOT" ] && [ -f "$SUSFS_KSU_FIX_ROOT/$rel_path" ]; then
            patch_source="$SUSFS_KSU_FIX_ROOT/$rel_path"
          elif [ -n "$SUSFS_KSU_FIX_ROOT" ]; then
            case "$rel_path" in
              */fdinfo.c.patch)
                [ -f "$SUSFS_KSU_FIX_ROOT/fix_fdinfo.c.patch" ] && patch_source="$SUSFS_KSU_FIX_ROOT/fix_fdinfo.c.patch"
                ;;
              */namespace.c.patch)
                [ -f "$SUSFS_KSU_FIX_ROOT/fix_namespace.c.patch" ] && patch_source="$SUSFS_KSU_FIX_ROOT/fix_namespace.c.patch"
                ;;
              */open.c.patch)
                [ -f "$SUSFS_KSU_FIX_ROOT/fix_open.c.patch" ] && patch_source="$SUSFS_KSU_FIX_ROOT/fix_open.c.patch"
                ;;
              */task_mmu.c.patch)
                [ -f "$SUSFS_KSU_FIX_ROOT/fix_task_mmu.c.patch" ] && patch_source="$SUSFS_KSU_FIX_ROOT/fix_task_mmu.c.patch"
                ;;
            esac
          fi

          if [ -z "$patch_source" ]; then
            return 1
          fi

          patch -p1 < "$patch_source" || true
          return 0
        }

        apply_susfs_optional_patch() {
          local description="$1"
          local rel_path="$2"

          if ! apply_susfs_patch_file "$rel_path"; then
            echo "::warning::$description 对应的 SUSFS 修复补丁不存在，已跳过"
          fi
          return 0
        }

        apply_susfs_base_patch() {
          local description="$1"
          local rel_path="$2"

          if apply_susfs_patch_file "$rel_path"; then
            return 0
          fi

          local applied=0 fallback_patch
          if [ -n "$SUSFS_KSU_FIX_ROOT" ]; then
            for fallback_patch in 1_fix_base.c.patch 2_fix_base.c.patch; do
              if [ -f "$SUSFS_KSU_FIX_ROOT/$fallback_patch" ]; then
                patch -p1 < "$SUSFS_KSU_FIX_ROOT/$fallback_patch" || true
                applied=1
              fi
            done
          fi

          if [ "$applied" -eq 0 ]; then
            echo "::warning::$description 对应的 SUSFS base 修复补丁不存在，已跳过"
          fi
          return 0
        }

        cp "$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${ABK_ANDROID_VERSION}-${ABK_KERNEL_VERSION}.patch" ./common/
        cp $SUSFS4KSU/kernel_patches/fs/* ./common/fs/
        cp $SUSFS4KSU/kernel_patches/include/linux/* ./common/include/linux/

        case "$ABK_KSU_VARIANT" in
          "Official")
            cd ./KernelSU
            cp $SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
            # 兼容旧版补丁：仅当补丁仍只修改 kernel/Makefile 时，才替换为 kernel/Kbuild
            if grep -q '^diff --git a/kernel/Makefile b/kernel/Makefile' ./10_enable_susfs_for_ksu.patch \
              && ! grep -q '^diff --git a/kernel/Kbuild b/kernel/Kbuild' ./10_enable_susfs_for_ksu.patch; then
              sed -i 's|kernel/Makefile|kernel/Kbuild|g' ./10_enable_susfs_for_ksu.patch
            fi
            patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true

            cd ..
            ;;
          "BakaSU")
            echo "BakaSU 使用内置 SUSFS 支持"
            ;;
          "SukiSU")
            echo "SukiSU 使用单独步骤注入 SUSFS Kconfig 符号"
            ;;
        esac

        cd $KERNEL_ROOT/common
        python3 "$GITHUB_WORKSPACE/tools/historical_susfs23.py" --kernel-root "$KERNEL_ROOT" \
          --version "$SUSFS_VERSION" --kernel "$ABK_KERNEL_VERSION" --sublevel "$ABK_SUB_LEVEL" --phase prepare
        patch -p1 < "50_add_susfs_in_gki-${ABK_ANDROID_VERSION}-${ABK_KERNEL_VERSION}.patch" || true

        if [ "$ABK_KSU_VARIANT" == "SukiSU" ] || [ "$ABK_KSU_VARIANT" == "BakaSU" ]; then
          SUSFS_C="./fs/susfs.c"
          if [ -f "$SUSFS_C" ] && grep -q '^static void susfs_run_sus_path_loop(' "$SUSFS_C"; then
            sed -i 's/^static void susfs_run_sus_path_loop(/void susfs_run_sus_path_loop(/' "$SUSFS_C"
            echo "已导出 susfs_run_sus_path_loop 供 SukiSU/BakaSU LSM hook 调用"
          fi
        fi

        if [ "$ABK_KSU_VARIANT" == "Official" ] || [ "$ABK_KSU_VARIANT" == "SukiSU" ] || [ "$ABK_KSU_VARIANT" == "BakaSU" ]; then
          CURRENT_SUB="$ABK_SUB_LEVEL"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi

          sub_in_range() {
            local value="$1"
            local min="$2"
            local max="$3"
            [[ "$value" =~ ^[0-9]+$ ]] || return 1
            (( value >= min && value <= max ))
          }

