    - name: 编译内核
      id: compile-kernel
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: timeout
        command: |
          echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
          echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE}"
          set -ex
          cd "$KERNEL_ROOT"

          CURRENT_SUB="${{ matrix.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi

          if [[ "${{ matrix.android_version }}" == "android13" \
            && "${{ matrix.kernel_version }}" == "5.15" \
            && "$CURRENT_SUB" -ge 41 && "$CURRENT_SUB" -le 137 ]]; then
            case "${{ inputs.kernelsu_variant }}" in
              "Official")
                echo "编译前兜底修复 ${{ inputs.kernelsu_variant }} 5.15 kallsyms symbol_resolver"
                python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          VARIANT = "${{ inputs.kernelsu_variant }}"
          SUBLEVEL = "${{ matrix.sub_level }}"
          TARGETED_BAKASU_SUBLEVELS = {"41", "74", "78", "94", "104", "119", "123", "137"}
          TARGETED_BAKASU = VARIANT == "BakaSU" and SUBLEVEL in TARGETED_BAKASU_SUBLEVELS
          if TARGETED_BAKASU:
              MARKER = "ABK: Android 13 5.15.{41,74,78,94,104,119,123,137} BakaSU kallsyms lookup rewrite"
              LEGACY_MARKER = "ABK: Android 13 5.15.{41,74,78,94,104,119,123,137} BakaSU kallsyms weak reference"
          else:
              MARKER = "ABK: Android 13 5.15.41-5.15.137 Official/BakaSU kallsyms lookup rewrite"
              LEGACY_MARKER = "ABK: Android 13 5.15.41-5.15.137 Official/BakaSU kallsyms weak reference"

          BASE_TARGET_SOURCE = dedent(f"""\
          // SPDX-License-Identifier: GPL-2.0-only
          /*
           * {MARKER}.
           *
           * The affected GKI 5.15 builds can fail while linking .tmp_vmlinux.btf
           * when KernelSU keeps a static kallsyms_on_each_symbol callback path
           * under clang ThinLTO. Rewrite symbol resolution to the simpler
           * kallsyms_lookup_name path used by modern KernelSU/BakaSU trees so
           * the built-in code no longer emits forbidden PLT/GOT entries.
           */
          #include <linux/kernel.h>
          #include <linux/string.h>
          #include <linux/kallsyms.h>

          #include "infra/symbol_resolver.h"

          static const char cfi_suffix[] = ".cfi_jt";

          void *ksu_lookup_symbol(const char *symbol_name)
          {{
          #ifdef CONFIG_KALLSYMS
              unsigned long addr;
              char cfi_name[KSYM_NAME_LEN];

              if (!symbol_name || !symbol_name[0])
                  return NULL;

              addr = kallsyms_lookup_name(symbol_name);
              if (addr)
                  return (void *)addr;

              if (scnprintf(cfi_name, sizeof(cfi_name), "%s%s", symbol_name, cfi_suffix) >= sizeof(cfi_name))
                  return NULL;

              addr = kallsyms_lookup_name(cfi_name);
              return addr ? (void *)addr : NULL;
          #else
              return NULL;
          #endif
          }}
          """)

          TARGETED_BAKASU_SOURCE = dedent(f"""\
          // SPDX-License-Identifier: GPL-2.0-only
          /*
           * {MARKER}.
           *
           * The affected BakaSU GKI 5.15 builds reference newer symbol
           * resolver entry points from LSM hook code. Keep the existing direct
           * kallsyms_lookup_name path and provide the missing entry points only
           * for the known failing Android 13 / 5.15 sublevels.
           */
          #include <linux/kernel.h>
          #include <linux/string.h>
          #include <linux/kallsyms.h>

          #include "infra/symbol_resolver.h"

          static const char cfi_suffix[] = ".cfi_jt";

          static void *ksu_lookup_symbol_impl(const char *symbol_name)
          {{
          #ifdef CONFIG_KALLSYMS
              unsigned long addr;
              char cfi_name[KSYM_NAME_LEN];

              if (!symbol_name || !symbol_name[0])
                  return NULL;

              addr = kallsyms_lookup_name(symbol_name);
              if (addr)
                  return (void *)addr;

              if (scnprintf(cfi_name, sizeof(cfi_name), "%s%s", symbol_name, cfi_suffix) >= sizeof(cfi_name))
                  return NULL;

              addr = kallsyms_lookup_name(cfi_name);
              return addr ? (void *)addr : NULL;
          #else
              return NULL;
          #endif
          }}

          void *ksu_resolve_symbol_for_functable_hook(const char *symbol_name)
          {{
              return ksu_lookup_symbol_impl(symbol_name);
          }}

          unsigned long find_kernel_symbol_exact(const char *symbol_name)
          {{
              return (unsigned long)ksu_lookup_symbol_impl(symbol_name);
          }}

          void ksu_init_symbol_resolver(void)
          {{
          }}

          void *ksu_lookup_symbol(const char *symbol_name)
          {{
              return ksu_lookup_symbol_impl(symbol_name);
          }}
          """)

          TARGET_SOURCE = TARGETED_BAKASU_SOURCE if TARGETED_BAKASU else BASE_TARGET_SOURCE

          candidates = []
          seen = set()
          for root in (Path("common/drivers/kernelsu"), Path("drivers/kernelsu")):
              path = root / "infra" / "symbol_resolver.c"
              if path.exists():
                  resolved = path.resolve()
                  if resolved not in seen:
                      candidates.append(path)
                      seen.add(resolved)

          if not candidates:
              raise SystemExit(f"{VARIANT} 未找到最终编译目录 infra/symbol_resolver.c，无法应用 5.15 kallsyms 兼容补丁")

          changed = False
          matched = False
          for path in candidates:
              print(f"检查 5.15 kallsyms 编译目录: {path}")
              text = path.read_text()
              if not any(token in text for token in (
                  "ksu_lookup_symbol(",
                  "kallsyms_on_each_symbol(",
                  "kallsyms_lookup_name(",
                  MARKER,
                  LEGACY_MARKER,
              )):
                  print(f"{path} 看起来不是预期的 KernelSU symbol_resolver，跳过")
                  continue

              matched = True
              needs_rewrite = (
                  MARKER not in text
                  or LEGACY_MARKER in text
                  or "kallsyms_on_each_symbol(" in text
                  or "__attribute__((weak))" in text
                  or "void *ksu_lookup_symbol(const char *symbol_name)" not in text
                  or "kallsyms_lookup_name(symbol_name)" not in text
              )

              if needs_rewrite:
                  path.write_text(TARGET_SOURCE)
                  changed = True
                  print(f"已将 {path} 重写为 {VARIANT} 5.15 kallsyms 直接查表实现")
              else:
                  print(f"{path} 已使用无 PLT/GOT 的 kallsyms_lookup_name 实现")

              final_text = path.read_text()
              if MARKER not in final_text:
                  raise SystemExit(f"{path} 缺少 5.15 kallsyms rewrite marker")
              if "kallsyms_on_each_symbol(" in final_text:
                  raise SystemExit(f"{path} 仍包含 kallsyms_on_each_symbol 直接调用")
              if "__attribute__((weak))" in final_text:
                  raise SystemExit(f"{path} 仍包含 weak kallsyms extern")
              if TARGETED_BAKASU:
                  if "ksu_resolve_symbol_for_functable_hook(" not in final_text:
                      raise SystemExit(f"{path} 缺少 ksu_resolve_symbol_for_functable_hook() 目标实现")
                  if "find_kernel_symbol_exact(" not in final_text:
                      raise SystemExit(f"{path} 缺少 find_kernel_symbol_exact() 目标实现")
                  if "ksu_init_symbol_resolver(" not in final_text:
                      raise SystemExit(f"{path} 缺少 ksu_init_symbol_resolver() 目标实现")
              if "void *ksu_lookup_symbol(const char *symbol_name)" not in final_text:
                  raise SystemExit(f"{path} 缺少 ksu_lookup_symbol() 目标实现")
              if "kallsyms_lookup_name(symbol_name)" not in final_text:
                  raise SystemExit(f"{path} 未切换到 kallsyms_lookup_name 直接查表实现")

              print(f"已验证 {path}: 无 kallsyms_on_each_symbol 直接调用，且无 weak extern")

          if not matched:
              raise SystemExit(f"{VARIANT} 未找到可修补的 KernelSU symbol_resolver 实现")

          if not changed:
              print(f"{VARIANT} 5.15 kallsyms rewrite 已经是目标状态，无需修改。")
          PY
                ;;
            esac
          fi

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

          if [ -f "build/build.sh" ]; then
            echo 'CCACHE_COMPILE_STARTED=true' >> "$GITHUB_ENV"
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="${CCACHE_PROGRAM:-/usr/bin/ccache} clang" || exit 1
            strings "out/${{ matrix.android_version }}-${{ matrix.kernel_version }}/dist/Image" | grep 'Linux version'
          else
            # 提取 gki_defconfig 修改到 fragment，避免 bazel trim 检查失败
            FRAG="common/arch/arm64/configs/ksu.fragment"
            diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
            cp "$DEFCONFIG.orig" "$DEFCONFIG"
            echo "=== KSU Fragment 内容 ==="
            cat "$FRAG"
            echo "========================="
            FRAG_FLAG=""
            if [ -s "$FRAG" ]; then
              FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
            fi
            LTO_FLAG="--lto=thin"
            if [ "${{ matrix.kernel_version }}" = "6.12" ]; then
              LTO_FLAG="--lto=none"
            fi
            : "${BAZEL_DISK_CACHE:?Bazel disk cache must be configured before compiling}"
            mkdir -p "$BAZEL_DISK_CACHE"
            tools/bazel build --disk_cache="$BAZEL_DISK_CACHE" --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
            strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
          fi

          echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
          echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE}"
          echo "如果日期不同或相差过远则补丁失效、编译失败"
    - name: 显示本次 ccache 命中统计
      if: always() && !cancelled() && steps.ccache-measurement.outputs.enabled == 'true'
      continue-on-error: true
      timeout-minutes: 1
      run: |
        set -euo pipefail
        ccache --max-size "$CCACHE_MAXSIZE"
        ccache --cleanup
        report="$RUNNER_TEMP/gki-ccache-statistics.txt"
        ccache --show-stats --verbose | tee "$report"
        {
          echo '### 本次内核编译缓存（ccache）'
          echo ''
          echo '以下命中、未命中及不可缓存数量仅统计本次 build.sh 编译；Bazel 使用单独的磁盘缓存。'
          echo ''
          echo '```text'
          cat "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: 保存独立仓库编译缓存（ccache）
      id: persistent-ccache-save
      if: always() && !cancelled() && steps.ccache-config.outputs.enabled == 'true' && env.ABK_LOCAL_CACHE_ENABLED != 'true'
        && env.CCACHE_COMPILE_STARTED == 'true' && (steps.compile-kernel.outcome == 'success' || steps.compile-kernel.outcome
        == 'failure')
      continue-on-error: true
      timeout-minutes: 8
      env:
        CACHE_REPOSITORY: ${{ github.repository_owner }}/gki-cache
        CACHE_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        OBJECT_CACHE_KEY: gki-ccache-ecs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/kernel-cache-tools.json',
          'tools/kernel_compile_cache.py') }}-${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.sub_level
          }}-${{ matrix.os_patch_level }}-${{ inputs.kernelsu_variant }}
        OBJECT_CACHE_DIRECTORY: ${{ env.CCACHE_DIR }}
      run: python3 "$GITHUB_WORKSPACE/tools/persistent_kernel_cache.py" save --kind ccache --directory "$OBJECT_CACHE_DIRECTORY"
        --key "$OBJECT_CACHE_KEY"
    - name: 保存本次 ccache 编译结果
      if: always() && !cancelled() && steps.ccache-config.outputs.enabled == 'true' && env.ABK_LOCAL_CACHE_ENABLED != 'true'
        && env.CCACHE_COMPILE_STARTED == 'true' && (steps.compile-kernel.outcome == 'success' || steps.compile-kernel.outcome
        == 'failure') && steps.persistent-ccache-save.outputs.saved != 'true'
      uses: actions/cache/save@v5
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: ~/.ccache
        key: gki-ccache-ecs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/kernel-cache-tools.json', 'tools/kernel_compile_cache.py')
          }}-${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.sub_level }}-${{ matrix.os_patch_level
          }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: 限制 Bazel 缓存上传体积
      id: bazel-cache-trim
      if: always() && !cancelled() && steps.bazel-cache-config.outputs.enabled == 'true' && steps.compile-kernel.outcome !=
        'skipped'
      continue-on-error: true
      timeout-minutes: 2
      env:
        BAZEL_CACHE_MAX_BYTES: '1610612736'
      run: |
        set -euo pipefail
        # Stop idle Bazel writes before pruning; never cache its output tree.
        (cd "$KERNEL_ROOT" && timeout 20s tools/bazel shutdown) || true
        python3 - <<'PY'
        import os
        import stat
        from pathlib import Path

        root = Path(os.environ['BAZEL_DISK_CACHE'])
        temporary = Path(os.environ['RUNNER_TEMP']).resolve()
        if root.is_symlink() or root.resolve().parent != temporary or not root.name.startswith('gki-bazel-'):
            raise SystemExit('Refusing to prune a cache outside the dedicated runner temporary directory')
        limit = int(os.environ['BAZEL_CACHE_MAX_BYTES'])
        if limit <= 0:
            raise SystemExit('Bazel cache byte limit must be positive')
        files = []
        for directory, _, names in os.walk(root, followlinks=False):
            for name in names:
                path = Path(directory) / name
                info = path.lstat()
                if stat.S_ISREG(info.st_mode):
                    files.append((max(info.st_atime_ns, info.st_mtime_ns), info.st_size, path))
        total = sum(size for _, size, _ in files)
        original = total
        # Disk cache AC/CAS entries are disposable; absent blobs become action misses.
        # Keep the most recently used entries without relying on newer Bazel GC flags.
        for _, size, path in sorted(files):
            if total <= limit:
                break
            path.unlink()
            total -= size
        with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
            output.write(f'ready={str(total > 0).lower()}\n')
        print(f'Bazel cache upload: {total / 1024**2:.1f} MiB (before trimming: {original / 1024**2:.1f} MiB)')
        PY
    - name: 保存独立仓库编译缓存（bazel）
      id: persistent-bazel-save
      if: always() && !cancelled() && steps.bazel-cache-trim.outputs.ready == 'true' && steps.bazel-cache.outputs.cache-primary-key
        != '' && steps.bazel-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      timeout-minutes: 8
      env:
        CACHE_REPOSITORY: ${{ github.repository_owner }}/gki-cache
        CACHE_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        OBJECT_CACHE_KEY: gki-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.android_version }}-${{ matrix.kernel_version
          }}-${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-${{ inputs.kernelsu_variant }}
        OBJECT_CACHE_DIRECTORY: ${{ env.BAZEL_DISK_CACHE }}
      run: python3 "$GITHUB_WORKSPACE/tools/persistent_kernel_cache.py" save --kind bazel --directory "$OBJECT_CACHE_DIRECTORY"
        --key "$OBJECT_CACHE_KEY"
    - name: 保存 Bazel 磁盘缓存
      if: always() && !cancelled() && steps.bazel-cache-trim.outputs.ready == 'true' && steps.bazel-cache.outputs.cache-primary-key
        != '' && steps.bazel-cache.outputs.cache-hit != 'true' && steps.persistent-bazel-save.outputs.saved != 'true'
      uses: actions/cache/save@v5
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: ${{ env.BAZEL_DISK_CACHE }}
        key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
    - name: 应用 KPM 补丁 (SukiSU/BakaSU)
      if: (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')) && (inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
      env:
        KPM_PASSWORD: ${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
          && inputs.kpm_password || '') }}
        GKI_ANDROID: ${{ matrix.android_version }}
        GKI_KERNEL: ${{ matrix.kernel_version }}
      run: |
        set -euo pipefail
        if [ -f "$KERNEL_ROOT/build/build.sh" ]; then
          target="$KERNEL_ROOT/out/$GKI_ANDROID-$GKI_KERNEL/dist"
        else
          target="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
        fi
        target="$(realpath -e "$target")"
        python3 "$GITHUB_WORKSPACE/tools/apply_kpm_patch.py" patch \
          --image "$target/Image" --cache-dir "$KPM_CACHE_DIR" --report "$target/gki-kpm-patch.json"
    - name: 准备 AK3 内核文件
      run: |
        set -euo pipefail
        if [ -f "$KERNEL_ROOT/build/build.sh" ]; then
          src="$KERNEL_ROOT/out/${GKI_ANDROID}-${GKI_KERNEL}/dist"
        else
          src="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
        fi
        cp "$src/Image" ./Image
        if [ "$ARTIFACT_MODE" != '仅 AK3' ]; then
          mkdir -p bootimgs
          cp "$src/Image" bootimgs/Image
          # KPM patches the final Image after compilation; compress that same image.
          lz4 -l -12 -f ./Image bootimgs/Image.lz4
          lz4 -dc bootimgs/Image.lz4 | cmp - ./Image
        fi
      env:
        GKI_ANDROID: ${{ matrix.android_version }}
        GKI_KERNEL: ${{ matrix.kernel_version }}
        ARTIFACT_MODE: ${{ inputs.artifact_mode }}
    - name: 核对最终 ARM64 启动入口
      run: python3 "$GITHUB_WORKSPACE/tools/validate_arm64_image.py" --image "$GITHUB_WORKSPACE/Image"
    - name: 准备 AnyKernel3 刷机包
      run: |
        set -euo pipefail
        cp ./Image "$ANYKERNEL3/Image"
        zip_name="${GKI_ANDROID}-${GKI_KERNEL}.${GKI_SUBLEVEL}-${GKI_PATCH}${GKI_MANAGER_SUFFIX:-}-AnyKernel3.zip"
        (cd "$ANYKERNEL3" && zip -r "$GITHUB_WORKSPACE/$zip_name" ./*)
      env:
        GKI_ANDROID: ${{ matrix.android_version }}
        GKI_KERNEL: ${{ matrix.kernel_version }}
        ARTIFACT_MODE: ${{ inputs.artifact_mode }}
        GKI_SUBLEVEL: ${{ matrix.sub_level }}
        GKI_PATCH: ${{ matrix.os_patch_level }}
    - name: 构建 Boot 镜像 (Android 12)
      if: inputs.artifact_mode != '仅 AK3' && ('aosp' != 'custom_git' && matrix.android_version == 'android12')
      working-directory: bootimgs
      run: |
        GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${BOOT_OS_PATCH_LEVEL}_${{ matrix.revision }}.zip
        FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

        status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
        if [ "$status" = "200" ]; then
          curl -Lo gki-kernel.zip "$GKI_URL"
        else
          curl -Lo gki-kernel.zip "$FALLBACK_URL"
        fi

        unzip gki-kernel.zip && rm gki-kernel.zip
        $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

        gzip -n -c -9 ./Image > ./Image.gz

        $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "$BOOT_OS_PATCH_LEVEL"
        $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
        cp ./boot.img ../${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-boot.img

        $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "$BOOT_OS_PATCH_LEVEL"
        $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
        cp ./boot-gz.img ../${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-boot-gz.img

        $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "$BOOT_OS_PATCH_LEVEL"
        $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
        cp ./boot-lz4.img ../${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-boot-lz4.img
      env:
        BOOT_OS_PATCH_LEVEL: ${{ matrix.os_patch_level == 'lts' && '2026-10' || matrix.os_patch_level }}
    - name: 构建 Boot 镜像 (Android 13+)
      if: inputs.artifact_mode != '仅 AK3' && ('aosp' != 'custom_git' && (matrix.android_version == 'android13' || matrix.android_version
        == 'android14' || matrix.android_version == 'android15' || matrix.android_version == 'android16'))
      working-directory: bootimgs
      run: |
        gzip -n -c -9 ./Image > ./Image.gz

        $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
        $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
        cp ./boot.img ../${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-boot.img

        $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
        $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
        cp ./boot-gz.img ../${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-boot-gz.img

        $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
        $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
        cp ./boot-lz4.img ../${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-boot-lz4.img
    - name: 收集补丁冲突文件
      if: always()
      run: |
        REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
        mkdir -p "$REJECTS_DIR"

        mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
        REJ_COUNT=${#REJS[@]}
        echo "发现 $REJ_COUNT 个 .rej 文件"
        echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

        if [ "$REJ_COUNT" -gt 0 ]; then
          for REJ in "${REJS[@]}"; do
            REL="${REJ#"$KERNEL_ROOT"/}"
            DEST="$REJECTS_DIR/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$REJ" "$DEST"

            ORIG="${REJ%.rej}"
            if [ -f "$ORIG" ]; then
              cp "$ORIG" "${DEST%.rej}"
            fi
            echo "$REL" >> "$REJECTS_DIR/index.txt"
          done
        fi
    - name: 记录内核实际配置
      id: kernel-assets
      env:
        META_FILE: ${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level
          }}-AnyKernel3.zip
        META_ANDROID_VERSION: ${{ matrix.android_version }}
        META_KERNEL_VERSION: ${{ matrix.kernel_version }}
        META_SUB_LEVEL: ${{ matrix.sub_level }}
        META_OS_PATCH_LEVEL: ${{ matrix.os_patch_level }}
        META_KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        META_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        META_KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        META_KSU_VERSION_CODE: ${{ env.MANAGER_VERSION_CODE }}
        META_KSU_VERSION_NAME: ${{ env.MANAGER_VERSION_NAME }}
        META_ENABLE_SUSFS: ${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}
        META_EXPECTED_SUSFS_VERSION: ${{ env.SUSFS_COMPAT_VERSION }}
        ARTIFACT_MODE: ${{ inputs.artifact_mode }}
      run: |
        if [ "${GKI_COMBINED_WORKER:-false}" = true ]; then
          META_FILE="${META_FILE%-AnyKernel3.zip}-${KSU_VARIANT}-AnyKernel3.zip"
          export META_FILE
          for image in ./*-boot*.img; do
            [ -f "$image" ] || continue
            base="${image%%-boot*}"; rest="${image#"$base"}"
            mv -- "$image" "${base}-${KSU_VARIANT}${rest}"
          done
        fi
        python3 tools/capture_build_metadata.py --kernel-root "$KERNEL_ROOT" \
          --image "$GITHUB_WORKSPACE/Image" --output release-ready/kernel.json
        python3 tools/package_release_kernel.py --metadata release-ready/kernel.json \
          --workspace "$GITHUB_WORKSPACE" --output release-ready --mode "$ARTIFACT_MODE"
    - name: 上传可直接刷入的 AK3 包
      uses: actions/upload-artifact@v7
      with:
        path: release-ready/${{ steps.kernel-assets.outputs.ak3 }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 上传独立 boot 镜像
      if: steps.kernel-assets.outputs.boot != ''
      uses: actions/upload-artifact@v7
      with:
        path: release-ready/${{ steps.kernel-assets.outputs.boot }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 上传独立 gzip boot 镜像
      if: steps.kernel-assets.outputs.boot_gz != ''
      uses: actions/upload-artifact@v7
      with:
        path: release-ready/${{ steps.kernel-assets.outputs.boot_gz }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 上传独立 LZ4 boot 镜像
      if: steps.kernel-assets.outputs.boot_lz4 != ''
      uses: actions/upload-artifact@v7
      with:
        path: release-ready/${{ steps.kernel-assets.outputs.boot_lz4 }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 上传补丁冲突文件
      if: failure() && env.REJ_COUNT > 0
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.kernelsu_variant }}_kernel-${{ env.CONFIG }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9
    if: always() && !cancelled() && needs.prepare-matrix.result == 'success' && (github.event_name == 'workflow_dispatch'
      && inputs.operation == '编译内核') && needs.build-sukisu-manager.result == 'success' && (!(inputs.kernelsu_variant == 'SukiSU'
      || inputs.kernelsu_variant == 'BakaSU') || needs.build-sukisu-lkm.result == 'success')
    needs:
    - prepare-matrix
    - build-sukisu-lkm
    - build-sukisu-manager
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare-matrix.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
env:
  GKI_COMBINED_WORKER: 'true'
