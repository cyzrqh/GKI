  build-sukisu-manager:
    name: 编译配套 ${{ inputs.kernelsu_variant }} 管理器 APK
    if: github.event_name == 'workflow_dispatch'
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
    needs:
    - prepare-matrix
    - build-sukisu-lkm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      manager_job_id: ${{ steps.manager-producer.outputs.manager_job_id }}
      manager_package: ${{ steps.sign.outputs.manager_package }}
      manager_cert_size: ${{ steps.sign.outputs.manager_cert_size }}
      manager_cert_sha256: ${{ steps.sign.outputs.manager_cert_sha256 }}
      apk_sha256: ${{ steps.sign.outputs.apk_sha256 }}
      manager_version_name: ${{ steps.sign.outputs.manager_version_name }}
      manager_version_code: ${{ steps.sign.outputs.manager_version_code }}
      apk_filename: ${{ steps.sign.outputs.apk_filename }}
    steps:
    - name: 检出构建工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 记录本次管理器生产任务
      id: manager-producer
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/wait_manager_identity.py --record-producer-job
    - name: 准备 APK 内容签名验证
      run: python3 -c 'import cryptography' || python3 -m pip install --break-system-packages --disable-pip-version-check
        cryptography
    - name: 检查固定 APK 签名配置
      env:
        SIGNING_CONFIGURED: ${{ secrets.SUKISU_APK_KEYSTORE != '' && secrets.SUKISU_APK_PASSWORD != '' }}
      run: |
        if [ "$SIGNING_CONFIGURED" != true ]; then
          echo '::error::请先按 README 配置 SUKISU_APK_KEYSTORE 和 SUKISU_APK_PASSWORD。签名密钥应长期保持不变。'
          exit 1
        fi
    - name: 还原本次固定源码缓存
      id: source-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
        fail-on-cache-miss: false
    - name: 从官方固定提交恢复并核实源码
      id: source-backup
      if: steps.source-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
        KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ true && inputs.enable_susfs || false }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER"
    - name: 重新缓存本次已验证的固定源码
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: steps.source-cache.outputs.cache-hit != 'true' && steps.source-backup.outcome == 'success'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
    - name: 核对固定源码与准备任务的完整身份
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
      run: |
        python3 tools/transfer_ksu_snapshot.py verify-cache \
          --source "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY"
    - name: 检出同一版本的管理器源码
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        python3 tools/checkout_ksu_snapshot.py --input "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --output "$GITHUB_WORKSPACE/manager-source" --expected-ref "$KSU_REF"
    - name: 准备本次模块与 APK 的公开签名信息
      env:
        MANAGER_PACKAGE: ${{ needs.prepare-matrix.outputs.manager_package }}
        MANAGER_CERT_SIZE: ${{ needs.prepare-matrix.outputs.manager_cert_size }}
        MANAGER_CERT_SHA256: ${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib
        document = {'manager_package':os.environ['MANAGER_PACKAGE'],
                    'manager_cert_size':int(os.environ['MANAGER_CERT_SIZE']),
                    'manager_cert_sha256':os.environ['MANAGER_CERT_SHA256']}
        pathlib.Path(os.environ['RUNNER_TEMP'],'manager-public-certificate.json').write_text(json.dumps(document)+'\n')
        PY
