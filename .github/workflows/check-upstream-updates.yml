name: 验证官方更新检查
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: 仅检查
        required: true
        default: 仅检查并提醒
        type: string
permissions:
  contents: read
jobs:
  verify-read-only:
    if: github.ref == 'refs/heads/verify/sukisu-reminder-43760232052'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 读取所有官方更新候选
        id: official
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_official_updates.py --check-only
      - name: 验证更名后的仓库和本地提醒报告
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_CANDIDATES: ${{ steps.official.outputs.candidates_json }}
        run: |
          set -euo pipefail
          python3 tools/check_official_updates.py --prepare --candidates-json "$OFFICIAL_CANDIDATES" --report-dir "$RUNNER_TEMP"
          python3 tools/official_sync_report.py --root . --base-ref HEAD \
            --report-json "$RUNNER_TEMP/official-sync-report.json" \
            --report-markdown "$RUNNER_TEMP/official-sync-report.md" \
            --observe-manager-versions --manager-cache "$RUNNER_TEMP/manager-history" \
            --observe-source-changes
          python3 - <<'PY'
          import json, os
          record = json.loads(os.environ['OFFICIAL_CANDIDATES'])['sukisu']
          print({key: record[key] for key in ('branch', 'head', 'release', 'development')})
          PY
          cat "$RUNNER_TEMP/official-sync-report.md" >> "$GITHUB_STEP_SUMMARY"
