name: GKI 全属性内核构建矩阵
run-name: 修复 SukiSU 41065 APK 认证（不编译内核）
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  repair-apk:
    name: 修复 APK 签名格式并核对内核认证
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
    - name: 检出已验证的修复工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 准备 Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: 准备签名和验证工具
      run: |
        set -euo pipefail
        python3 -c 'import cryptography' || python3 -m pip install --break-system-packages --disable-pip-version-check cryptography
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        python3 -c "print('y\n' * 100)" | "$sdkmanager" --licenses > /dev/null
        "$sdkmanager" 'build-tools;37.0.0'
    - name: 下载同一源码的原始 APK
      uses: actions/download-artifact@v8
      with:
        artifact-ids: '12547170421'
        repository: cyzrqh/gki
        run-id: '40058729390'
        github-token: ${{ github.token }}
        skip-decompress: true
        merge-multiple: true
        path: original-apk
    - name: 核对原 APK 的实际签名块
      run: |
        python3 - <<'PY'
        import hashlib,pathlib,sys
        sys.path.insert(0,'tools')
        from embedded_build_metadata import _apk_signing_block,read_manager_apk
        path=pathlib.Path('original-apk/SukiSU_manager-ci_41065-release.apk')
        raw=path.read_bytes()
        assert hashlib.sha256(raw).hexdigest()=="d25f82ab3b2474b91fb88f413f718322b9f47a1502a5d558910513baeb08dc71"
        identity=read_manager_apk(raw,filename=path.name,allow_legacy_signing_blocks=True)
        print('Original signing blocks:',','.join(hex(key) for key in _apk_signing_block(raw)[3]))
        print('Original actual source:',identity['ksu_ref'])
        PY
    - name: 保留固定签名并修复 APK 认证格式
      id: repair
      env:
        SUKISU_APK_KEYSTORE: ${{ secrets.SUKISU_APK_KEYSTORE }}
        SUKISU_APK_PASSWORD: ${{ secrets.SUKISU_APK_PASSWORD }}
        KSU_REF: df84920b20a925fd1135530f6e403361ad494d7b
        KSU_BRANCH: Latest(最新)
      run: python3 tools/repair_manager_signature.py --input "original-apk/SukiSU_manager-ci_41065-release.apk" --expected-sha256
        d25f82ab3b2474b91fb88f413f718322b9f47a1502a5d558910513baeb08dc71 --expected-ref df84920b20a925fd1135530f6e403361ad494d7b
        --output-dir manager-artifact
    - name: 核对最终 APK 的 Android 验签及签名块
      run: |
        set -euo pipefail
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "manager-artifact/SukiSU_manager-ci_41065-release.apk"
        python3 - <<'PY'
        import pathlib,sys
        sys.path.insert(0,'tools')
        from embedded_build_metadata import _apk_signing_block,read_manager_apk
        path=pathlib.Path('manager-artifact/SukiSU_manager-ci_41065-release.apk')
        identity=read_manager_apk(path)
        assert identity['ksu_ref']=="df84920b20a925fd1135530f6e403361ad494d7b"
        assert identity['manager_cert_sha256']=='c8e9af2b51e0f76b4e9133726c17a8034a131fec4235f6b779ab8b1e83127c12'
        print('Final signing blocks:',','.join(hex(key) for key in _apk_signing_block(path.read_bytes())[3]))
        print('Final APK passed Android and SukiSU kernel authentication format checks with its original certificate.')
        PY
    - name: 准备直接下载的修复 APK
      run: |
        set -euo pipefail
        python3 tools/prepare_release.py --input manager-artifact --output release-publish --expected-kernel-count 0
        python3 - <<'PY'
        from pathlib import Path
        path=Path('release-publish/release.md')
        notice='SukiSU 41065 APK 认证修复：使用原固定密钥签名，采用内核认证支持的 APK v2 格式。包名、版本号和原 APK 的编译内容保持一致。\n\n覆盖安装此 APK 后重启，让内核重新识别管理器；此次修复不需要重新修补 boot 或重编内核。原内核及其签名信任保持不变。\n\n'
        path.write_text(notice+path.read_text(),encoding='utf-8')
        PY
    - name: 上传原名 APK
      uses: actions/upload-artifact@v7
      with:
        path: release-publish/assets/SukiSU_manager-ci_41065-release.apk
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 上传校验文件
      uses: actions/upload-artifact@v7
      with:
        path: release-publish/assets/SHA256SUMS.txt
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 发布可直接安装的修复 APK
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      run: |
        set -euo pipefail
        tag="gki-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
          --title 'SukiSU 41065 APK 认证修复' --notes-file release-publish/release.md
        gh release upload "$tag" release-publish/assets/* --repo "$GITHUB_REPOSITORY"
        gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        echo "修复 APK：https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
    - name: 核对 Actions 与发行版原文件一致
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/cleanup_build_artifacts.py --run-id "$GITHUB_RUN_ID"
