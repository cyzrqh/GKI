        from pathlib import Path
        import re
        import sys

        path = Path(sys.argv[1])
        github_env = Path(sys.argv[2])
        text = path.read_text()
        pattern = re.compile(r"(?m)^[ \t]*config[ \t]+KPM\b")
        if pattern.search(text):
            with github_env.open("a", encoding="utf-8") as handle:
                handle.write("ABK_KPM_KCONFIG_STATUS=native\n")
                handle.write("ABK_KPM_KCONFIG_READY=true\n")
            print(f"{path} 已包含 KPM Kconfig 符号")
            raise SystemExit(0)

        lines = [
            "",
            'menu "KernelSU - KPM"',
            "config KPM",
            '  bool "KernelPatch Module support"',
            "  depends on KSU",
            "  default y",
            "",
            "endmenu",
        ]
        block = "\n".join(lines)

        marker = "\nendmenu\n"
        if marker in text:
            text = text.rsplit(marker, 1)[0].rstrip() + "\n" + block + marker
        else:
            text = text.rstrip() + "\n" + block + "\n"
        path.write_text(text)

        final_text = path.read_text()
        if not pattern.search(final_text):
            raise SystemExit(f"{path} 注入后仍缺少 config KPM")

        with github_env.open("a", encoding="utf-8") as handle:
            handle.write("ABK_KPM_KCONFIG_STATUS=injected\n")
            handle.write("ABK_KPM_KCONFIG_READY=true\n")
        print(f"已注入 {path} 的 KPM Kconfig 符号")
        PY
    - name: 应用 Kernel 特定补丁
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        # 修复指定 2024-11 分支: mmap.c 调用了 vm_flags_clear()，但同分支 mm.h 未提供 helper
        if [[ "${{ matrix.os_patch_level }}" == "2024-11" ]] \
          && { [[ "${{ matrix.android_version }}" == "android12" && "${{ matrix.kernel_version }}" == "5.10" && "${{ matrix.sub_level }}" == "226" ]] \
            || [[ "${{ matrix.android_version }}" == "android13" && "${{ matrix.kernel_version }}" == "5.15" && "${{ matrix.sub_level }}" == "167" ]] \
            || [[ "${{ matrix.android_version }}" == "android15" && "${{ matrix.kernel_version }}" == "6.6" ]]; } \
          && grep -qF 'vm_flags_clear(new_vma, VM_PAD_MASK);' ./mm/mmap.c \
          && ! grep -qF 'static inline void vm_flags_clear(' ./include/linux/mm.h; then
          python3 - "${{ matrix.kernel_version }}" <<'PY'
        import sys
        from pathlib import Path

        kernel_version = sys.argv[1]
        path = Path("include/linux/mm.h")
        text = path.read_text()
        if kernel_version in {"5.10", "5.15"}:
            helper = """
        static inline void vm_flags_clear(struct vm_area_struct *vma,
                                          vm_flags_t flags)
        {
            vma->vm_flags &= ~flags;
        }
        """
        else:
            helper = """
        static inline void vm_flags_clear(struct vm_area_struct *vma,
                                          vm_flags_t flags)
        {
            vma_start_write(vma);
            ACCESS_PRIVATE(vma, __vm_flags) &= ~flags;
        }
        """

        if "static inline void vm_flags_clear(" not in text:
            marker = "/*\n * Use only if VMA is not part of the VMA tree"
            if marker in text:
                text = text.replace(marker, helper + "\n" + marker, 1)
            else:
                needle = "static inline void vm_flags_set(struct vm_area_struct *vma,"
                start = text.find(needle)
                if start != -1:
                    body_start = text.find("{", start)
                    body_end = text.find("\n}\n", body_start)
                    if body_start == -1 or body_end == -1:
                        raise SystemExit("include/linux/mm.h vm_flags_set() has unexpected format")
                    insert_at = body_end + len("\n}\n")
                elif "#endif /* _LINUX_MM_H */" in text:
                    insert_at = text.rfind("#endif /* _LINUX_MM_H */")
                elif "#endif" in text:
                    insert_at = text.rfind("#endif")
                else:
                    raise SystemExit("include/linux/mm.h missing insertion anchor for vm_flags_clear()")
                text = text[:insert_at] + helper + text[insert_at:]
            path.write_text(text)
        PY
          echo "已为 ${{ matrix.android_version }}-${{ matrix.kernel_version }} 2024-11 补充 vm_flags_clear helper"
        fi
    - name: 备份基准 defconfig
      run: cp "$DEFCONFIG" "$DEFCONFIG.orig"
    - name: 应用 NTsync 补丁
      if: ${{ inputs.use_ntsync }}
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: ntsync
        ABK_ANDROID_VERSION: ${{ matrix.android_version }}
        ABK_KERNEL_VERSION: ${{ matrix.kernel_version }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail

        ensure_defconfig_value() {
          local cfg="$1"
          local value="$2"
          local line="${cfg}=${value}"

          if grep -qxF "$line" "$DEFCONFIG"; then
            return 0
          fi

          if grep -Eq "^${cfg}=|^# ${cfg} is not set$" "$DEFCONFIG"; then
            sed -i -E "s|^${cfg}=.*|${line}|; s|^# ${cfg} is not set$|${line}|" "$DEFCONFIG"
          else
            echo "$line" >> "$DEFCONFIG"
          fi
        }

        echo "启用 NTsync 补丁"
        BASE_PATCH="$KERNEL_PATCHES/common/ntsync/ntsync_base.patch"
        PATCH_FILE="$KERNEL_PATCHES/common/ntsync/ntsync_compat_${ABK_ANDROID_VERSION}-${ABK_KERNEL_VERSION}.patch"
        NTSYNC_SOURCE="drivers/misc/ntsync.c"

        apply_ntsync_patch() {
          local patch_file="$1"
          [ -f "$patch_file" ] || {
            echo "::error::NTsync 补丁不存在: $patch_file"
            exit 1
          }
          echo "检查并应用 NTsync 补丁: $(basename "$patch_file")"
          if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
            patch -p1 --forward < "$patch_file"
          elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
            echo "NTsync 补丁已应用: $(basename "$patch_file")"
          else
            echo "::error::NTsync 补丁既无法应用，也不是已应用状态: $patch_file"
            patch -p1 --forward --dry-run < "$patch_file" || true
            exit 1
          fi
        }

        apply_android12_ntsync_compat() {
          local patch_file="$1"
          local filtered_patch
          filtered_patch="$(mktemp)"
          # Android 12 GKI lacks lockdep_assert_none_held_once(), so the
          # upstream backport hunk never matches. Replace that hunk with the
          # equivalent macros needed by ntsync and apply the remaining patch.
          python3 - "$patch_file" "$filtered_patch" <<'PY'
        from pathlib import Path
        import sys

        source = Path(sys.argv[1]).read_text()
        start = source.find("@@ -305,25 +310,29")
        end = source.find("@@ -394,8 +403,12", start)
        if start < 0 or end < 0:
            raise SystemExit("unexpected android12 NTsync compatibility patch layout")
        source = source[:start] + source[end:]

        lockdep = Path("kernel/locking/lockdep.c").read_text()
        function_pos = lockdep.find("int __lock_is_held")
        function_line = lockdep[:function_pos].count("\n") + 1 if function_pos >= 0 else 99999
        if function_line < 5250:
            lockdep_start = source.find("@@ -5308,13 +5309,13")
            lockdep_end = source.find("@@ -5593,10 +5594,14", lockdep_start)
            if lockdep_start < 0 or lockdep_end < 0:
                raise SystemExit("unexpected android12 NTsync lockdep.c patch layout")
            source = source[:lockdep_start] + source[lockdep_end:]
        Path(sys.argv[2]).write_text(source)
        PY
          apply_ntsync_patch "$filtered_patch"
          rm -f "$filtered_patch"

          python3 - <<'PY'
        from pathlib import Path

        path = Path("include/linux/lockdep.h")
        text = path.read_text()
        if "#define lockdep_assert(cond)" not in text:
            marker = "#define lockdep_depth(tsk)\t(debug_locks ? (tsk)->lockdep_depth : 0)\n"
            if marker not in text:
                raise SystemExit(f"missing lockdep assertion anchor: {path}")
            block = """

        #define lockdep_assert(cond) \
            do { WARN_ON(debug_locks && !(cond)); } while (0)

        #define lockdep_assert_once(cond) \
            do { WARN_ON_ONCE(debug_locks && !(cond)); } while (0)
        """
            path.write_text(text.replace(marker, marker + block, 1))

        lockdep_path = Path("kernel/locking/lockdep.c")
        lockdep = lockdep_path.read_text()
        function_start = lockdep.find("int __lock_is_held(const struct lockdep_map *lock, int read)")
        function_end = lockdep.find("static struct pin_cookie __lock_pin_lock", function_start)
        if function_start >= 0 and function_end >= 0:
            body = lockdep[function_start:function_end]
            if "return LOCK_STATE_HELD;" not in body:
                body = body.replace("return 1;", "return LOCK_STATE_HELD;", 1)
                body = body.replace("return 0;", "return LOCK_STATE_NOT_HELD;")
                lockdep_path.write_text(lockdep[:function_start] + body + lockdep[function_end:])
        PY
          grep -qF '#define lockdep_assert(cond)' include/linux/lockdep.h || {
            echo "::error::Android 12 NTsync lockdep_assert 兼容修复失败"
            exit 1
          }
        }

        # Android 16/6.12 已带原生 ntsync.c 与 UAPI；基础补丁是新增文件式补丁，
        # 对原生源码既不能正向应用，也不能用反向 dry-run 判定为已应用。
        if [[ "$ABK_ANDROID_VERSION" != "android16" || "$ABK_KERNEL_VERSION" != "6.12" ]]; then
          apply_ntsync_patch "$BASE_PATCH"
        elif [ -f "$NTSYNC_SOURCE" ] && [ -f include/uapi/linux/ntsync.h ]; then
          echo "NTsync 基础源码已由 android16-6.12 内核提供"
        else
          echo "::error::android16-6.12 内核缺少原生 NTsync 源码或 UAPI"
          exit 1
        fi
        if [[ "$ABK_ANDROID_VERSION" == "android12" && "$ABK_KERNEL_VERSION" == "5.10" ]]; then
          apply_android12_ntsync_compat "$PATCH_FILE"
        else
          apply_ntsync_patch "$PATCH_FILE"
        fi

        [ -f "$NTSYNC_SOURCE" ] || {
          echo "::error::NTsync 补丁完成后未生成 $NTSYNC_SOURCE"
          exit 1
        }

        # 强制内建可避免 Android 14/6.1 将 ntsync.ko modpost 为独立模块；
        # __vfs_setxattr_noperm 在该内核树中存在但未导出，内建对象可合法引用。
        ensure_defconfig_value CONFIG_NTSYNC y
        echo "应用 NTsync 补丁完成"
    - name: 应用 Networking 增强 (IPSet + BBR)
      if: ${{ inputs.use_networking }}
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: networking
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: Networking enhancement failed
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail

        ensure_defconfig_value() {
          local cfg="$1"
          local value="$2"
          local line="${cfg}=${value}"

          if grep -qxF "$line" "$DEFCONFIG"; then
            return 0
          fi

          if grep -Eq "^${cfg}=|^# ${cfg} is not set$" "$DEFCONFIG"; then
            sed -i -E "s|^${cfg}=.*|${line}|; s|^# ${cfg} is not set$|${line}|" "$DEFCONFIG"
          else
            echo "$line" >> "$DEFCONFIG"
          fi
        }

        echo " 添加IP SET & IPv6_NAT 支持"
        ensure_defconfig_value CONFIG_IP_SET y
        ensure_defconfig_value CONFIG_IP_SET_MAX 65534
        ensure_defconfig_value CONFIG_IP_SET_BITMAP_IP y
        ensure_defconfig_value CONFIG_IP_SET_BITMAP_IPMAC y
        ensure_defconfig_value CONFIG_IP_SET_BITMAP_PORT y
        ensure_defconfig_value CONFIG_IP_SET_HASH_IP y
        ensure_defconfig_value CONFIG_IP_SET_HASH_IPMARK y
        ensure_defconfig_value CONFIG_IP_SET_HASH_IPPORT y
        ensure_defconfig_value CONFIG_IP_SET_HASH_IPPORTIP y
        ensure_defconfig_value CONFIG_IP_SET_HASH_IPPORTNET y
        ensure_defconfig_value CONFIG_IP_SET_HASH_IPMAC y
        ensure_defconfig_value CONFIG_IP_SET_HASH_MAC y
        ensure_defconfig_value CONFIG_IP_SET_HASH_NETPORTNET y
        ensure_defconfig_value CONFIG_IP_SET_HASH_NET y
        ensure_defconfig_value CONFIG_IP_SET_HASH_NETNET y
        ensure_defconfig_value CONFIG_IP_SET_HASH_NETPORT y
        ensure_defconfig_value CONFIG_IP_SET_HASH_NETIFACE y
        ensure_defconfig_value CONFIG_IP_SET_LIST_SET y
        ensure_defconfig_value CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
        ensure_defconfig_value CONFIG_NETFILTER_XT_SET y
        ensure_defconfig_value CONFIG_IP6_NF_NAT y
        ensure_defconfig_value CONFIG_IP6_NF_TARGET_MASQUERADE y
        if [ "${{ matrix.kernel_version }}" = "5.10" ]; then
          echo "应用 5.10 特殊配置 "
          sed -i 's/CONFIG_IP_SET_MAX/65534/g' net/netfilter/ipset/ip_set_core.c
        fi

        echo " 添加 TCP Congestion Control (BBR) 支持"
        # 应用 BBRv3 补丁仅有6.1版本
        if [ "${{ matrix.kernel_version }}" = "6.1" && false ]; then
          echo "应用 BBRv3 补丁"
          PATCH_FILE="$KERNEL_PATCHES/bbr/bbrv3-${{ matrix.android_version }}-${{ matrix.kernel_version }}.patch"
          echo "→ 应用补丁: bbrv3-${{ matrix.android_version }}-${{ matrix.kernel_version }}.patch"
          patch -p1 --forward < "$PATCH_FILE" || true
        fi

        ensure_defconfig_value CONFIG_TCP_CONG_ADVANCED y
        if [ -f net/ipv4/Kconfig ] && grep -q '^config TCP_CONG_BIC$' net/ipv4/Kconfig; then
          ensure_defconfig_value CONFIG_TCP_CONG_BIC y
        fi
        ensure_defconfig_value CONFIG_TCP_CONG_BBR y
        ensure_defconfig_value CONFIG_TCP_CONG_CUBIC y
        ensure_defconfig_value CONFIG_TCP_CONG_WESTWOOD y
        ensure_defconfig_value CONFIG_TCP_CONG_HTCP y
        ensure_defconfig_value CONFIG_DEFAULT_BBR y
        ensure_defconfig_value CONFIG_DEFAULT_TCP_CONG '"bbr"'
        ensure_defconfig_value CONFIG_NET_SCH_FQ y
        ensure_defconfig_value CONFIG_NET_SCH_FQ_CODEL y

        echo "✓ Networking配置完成"
    - name: 克隆虚拟化支持补丁仓库
      if: (inputs.virtualization_support == 'off' && 'off' || (matrix.kernel_version == '6.12' && 'on' || (inputs.virtualization_support
        == 'on' && '678' || inputs.virtualization_support))) != 'off'
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: virtualization
        ABK_FEATURE_END: 'false'
        ABK_FEATURE_FAILURE_MESSAGE: Virtualization patch download failed
      run: |
        patches_dir="$RUNNER_TEMP/virtualization-support-patches"
        rm -rf "$patches_dir"
        git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git "$patches_dir"
        echo "VIRTUALIZATION_SUPPORT_PATCHES=$patches_dir/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV
    - name: 集成虚拟化支持
      if: (inputs.virtualization_support == 'off' && 'off' || (matrix.kernel_version == '6.12' && 'on' || (inputs.virtualization_support
        == 'on' && '678' || inputs.virtualization_support))) != 'off'
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: virtualization
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: Virtualization integration failed
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        KERNEL_VER="${{ matrix.kernel_version }}"
        SLOT="${{ (inputs.virtualization_support == 'off' && 'off' || (matrix.kernel_version == '6.12' && 'on' || (inputs.virtualization_support == 'on' && '678' || inputs.virtualization_support))) }}"

        fail() {
          echo "::error::虚拟化支持: $*"
          exit 1
        }

        try_apply_patch() {
          local patch_file="$1"
          local name
          name="$(basename "$patch_file")"
          if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
            patch -p1 --forward < "$patch_file"
            echo "已应用虚拟化支持 patch: $name"
            return 0
          fi
          if patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
            echo "虚拟化支持 patch 已应用: $name"
            return 0
          fi
          return 1
        }

        apply_sysvipc_below_612_compat() {
          local sched="include/linux/sched.h"
          [ -f "$sched" ] || fail "缺少 $sched"
          if grep -qF 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' "$sched"; then
            echo "SYSVIPC below-6.12 kABI fallback 已应用"
            return 0
          fi
          perl -0pi -e 's/#ifdef CONFIG_SYSVIPC\n\tstruct sysv_sem\s+sysvsem;\n\tstruct sysv_shm\s+sysvshm;\n#endif/#ifdef CONFIG_SYSVIPC\n\t\/\/ struct sysv_sem\t\t\tsysvsem;\n\t\/\/ struct sysv_shm\t\t\tsysvshm;\n#endif/s' "$sched"
          perl -0pi -e 's/\tANDROID_KABI_RESERVE\(6\);\n\tANDROID_KABI_RESERVE\(7\);\n\tANDROID_KABI_RESERVE\(8\);/\n#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif/s' "$sched"
          grep -qF '// struct sysv_sem' "$sched" || fail "SYSVIPC 原字段注释失败"
          grep -qF 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' "$sched" || fail "SYSVIPC kABI fallback 注入失败"
          echo "已应用 SYSVIPC below-6.12 kABI fallback"
        }

        apply_mqueue_510_compat() {
          local user_h="include/linux/sched/user.h"
          [ -f "$user_h" ] || fail "缺少 $user_h"
          if grep -qF 'ANDROID_KABI_USE(1, unsigned long mq_bytes);' "$user_h"; then
            echo "POSIX_MQUEUE kABI fallback 已应用"
            return 0
          fi
          perl -0pi -e 's/#ifdef CONFIG_POSIX_MQUEUE\n\t\/\* protected by mq_lock\t\*\/\n\tunsigned long mq_bytes;\t\/\* How many bytes can be allocated to mqueue\? \*\/\n#endif/#ifdef CONFIG_POSIX_MQUEUE\n\t\/\* protected by mq_lock\t\*\/\n\t\/\/unsigned long mq_bytes;\t\/\* How many bytes can be allocated to mqueue? \*\/\n#endif/s' "$user_h"
          perl -0pi -e 's/\tANDROID_KABI_RESERVE\(1\);\n\tANDROID_KABI_RESERVE\(2\);\n\tANDROID_OEM_DATA_ARRAY\(1, 2\);/\n#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/s' "$user_h"
          grep -qF 'ANDROID_KABI_USE(1, unsigned long mq_bytes);' "$user_h" || fail "POSIX_MQUEUE kABI fallback 注入失败"
          echo "已应用 POSIX_MQUEUE 5.10 kABI fallback"
        }

        apply_sysvipc_612_plus_compat() {
          local sched="include/linux/sched.h"
          [ -f "$sched" ] || fail "缺少 $sched"
          if grep -qF 'char __kabi_ignored_0;' "$sched"; then
            echo "SYSVIPC 6.12+ kABI fallback 已应用"
            return 0
          fi
          perl -0pi -e 's/(\n\tunsigned int\s+rt_priority;\n)/$1\n#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n/s or die "rt_priority anchor not found\n";' "$sched" || fail "SYSVIPC 6.12+ packed 字段注入失败"
          perl -0pi -e 's/#ifdef CONFIG_SYSVIPC\n\tstruct sysv_sem\s+sysvsem;\n\tstruct sysv_shm\s+sysvshm;\n#endif/#ifdef CONFIG_SYSVIPC\n\t\/\/ struct sysv_sem\t\t\tsysvsem;\n\t\/\/ struct sysv_shm\t\t\tsysvshm;\n#endif/s' "$sched"
          grep -qF 'char __kabi_ignored_0;' "$sched" || fail "SYSVIPC 6.12+ ignored 字段注入失败"
          grep -qF '// struct sysv_sem' "$sched" || fail "SYSVIPC 6.12+ 原字段注释失败"
          echo "已应用 SYSVIPC 6.12+ kABI fallback"
        }

        case "$KERNEL_VER" in
          6.12)
            PATCH_FILE="$VIRTUALIZATION_SUPPORT_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
            if ! try_apply_patch "$PATCH_FILE"; then
              apply_sysvipc_612_plus_compat
            fi
            ;;
          5.10|5.15|6.1|6.6)
            case "$SLOT" in
              678|123|345) ;;
              *) fail "$KERNEL_VER 需要选择 678、123 或 345 槽位，当前为 $SLOT" ;;
            esac
            SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
            PATCH_FILE="$VIRTUALIZATION_SUPPORT_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
            if ! try_apply_patch "$PATCH_FILE"; then
              if [ "$SLOT" = "678" ]; then
                apply_sysvipc_below_612_compat
              else
                fail "SYSVIPC kABI patch 应用失败: $(basename "$PATCH_FILE")"
              fi
            fi
            ;;
          *)
            fail "未适配的内核版本 $KERNEL_VER"
            ;;
        esac

        # 5.10 及以下还需要 POSIX_MQUEUE 的 kABI 修复
        if [ "$KERNEL_VER" = "5.10" ]; then
          echo "应用虚拟化支持 POSIX_MQUEUE kABI 修复补丁 (5.10)..."
          POSIX_PATCH="$VIRTUALIZATION_SUPPORT_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          if ! try_apply_patch "$POSIX_PATCH"; then
            apply_mqueue_510_compat
          fi
        fi

        # Android 16 / 6.12 的 rust_binder.ko 在启用 IPC_NS 后会引用
        # init_ipc_ns 与 put_ipc_ns，但当前 AOSP common 分支尚未导出这两个符号。
        # 这里补齐导出，避免 modpost 因 undefined symbol 失败。
        if [ "$KERNEL_VER" = "6.12" ]; then
          if [ -f "ipc/msgutil.c" ] && ! grep -qF 'EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"; then
            sed -i '/^struct msg_msgseg {/i EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"
            echo "已为 init_ipc_ns 补充符号导出"
          fi

          if [ -f "ipc/namespace.c" ] && ! grep -qF 'EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"; then
            sed -i '/^static struct ns_common \*ipcns_get(/i EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"
            echo "已为 put_ipc_ns 补充符号导出"
          fi
        fi

        echo "添加虚拟化支持内核配置..."
        # 按文档规则逐个处理: 已启用则跳过, "# not set" 则替换, 不存在则追加
        enable_config() {
          local cfg="$1"
          if grep -q "^${cfg}=y" "$DEFCONFIG"; then
            echo "  已启用: $cfg"
          elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
            sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
            echo "  已切换: $cfg"
          else
            echo "${cfg}=y" >> "$DEFCONFIG"
            echo "  已添加: $cfg"
          fi
        }

        config_defined() {
          local name="${1#CONFIG_}"
          local file
          while IFS= read -r -d '' file; do
            if grep -Eq "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}([[:space:]]|$)" "$file"; then
              return 0
            fi
          done < <(find . -type f -name 'Kconfig*' -print0)
          return 1
        }

        enable_required_config() {
          local cfg="$1"
          if config_defined "$cfg"; then
            enable_config "$cfg"
          else
            fail "当前内核未定义必要配置: $cfg"
          fi
        }

        enable_config_if_defined() {
          local cfg="$1"
          if config_defined "$cfg"; then
            enable_config "$cfg"
          else
            echo "  当前内核未定义: $cfg，跳过"
          fi
        }

        # 必要配置
        enable_required_config CONFIG_SYSVIPC
        enable_required_config CONFIG_POSIX_MQUEUE
        enable_required_config CONFIG_IPC_NS
        enable_required_config CONFIG_PID_NS
        enable_required_config CONFIG_DEVTMPFS

        # 可选: 网络相关配置 (Docker/NAT 模式)
        enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
        enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
        enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
        enable_config_if_defined CONFIG_IP_SET
        enable_config_if_defined CONFIG_IP_SET_HASH_IP
        enable_config_if_defined CONFIG_IP_SET_HASH_NET
        enable_config_if_defined CONFIG_NETFILTER_XT_SET

        # REJECT 目标在不同内核版本上的符号名可能不同，按实际存在的配置启用
        enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
        enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT

        echo "虚拟化支持集成完成"
    - name: 应用 Unicode 绕过修复
      if: (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU')
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: susfs
        ABK_FEATURE_FAILURE_MESSAGE: SUSFS Unicode compatibility integration failed
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        if [ "${{ matrix.kernel_version }}" = "5.10" ] || [ "${{ matrix.kernel_version }}" = "5.15" ]; then
          patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
        else
          patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
        fi
    - name: 配置 ZRAM 补丁栈
      if: ${{ inputs.use_zram }}
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: zram
        ABK_FEATURE_END: 'false'
        ABK_FEATURE_FAILURE_MESSAGE: ZRAM patch stack failed
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        if [ "${EFFECTIVE_ZRAM_LEGACY_LZ4K:-true}" = "true" ]; then
          echo "升级 LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          for zram_patch_name in lz4kd.patch lz4k_oplus.patch; do
            zram_patch_file="$SUKISU_PATCHES/other/zram/zram_patch/${{ matrix.kernel_version }}/$zram_patch_name"
            if [ ! -f "$zram_patch_file" ]; then
              echo "::warning::$zram_patch_name 不存在，跳过 ${{ matrix.kernel_version }} 的 SukiSU ZRAM 集成补丁"
              continue
            fi

            cp "$zram_patch_file" ./
            if ! patch -p1 -F 3 < "$zram_patch_name"; then
              echo "::warning::$zram_patch_name 应用失败，可能已应用或上下文不匹配"
            fi
          done
        else
          echo "6.12 检测到新式 zram backend，跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS 补丁栈。"
        fi

        if [ "${EFFECTIVE_ZRAM_USE_OPTIONAL_ALGO:-false}" = "true" ]; then
          chmod +x "$ZZH_PATCHES/zram/setup_zstdp.sh"
          ABK_ZSTDP_UPSTREAM_TAG="v6.15" \
            bash "$ZZH_PATCHES/zram/setup_zstdp.sh" integrate "$PWD"
        else
          echo "未请求额外可选 ZRAM 算法，跳过附加算法集成。"
        fi
    - name: 修复 6.6 WiFi/蓝牙兼容性（三星 + 小米）
      if: matrix.kernel_version == '6.6'
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        ensure_line_once() {
          local file="$1"
          local line="$2"
          if [ ! -f "$file" ]; then
            echo "::error::文件不存在: $file"
            exit 1
          fi
          if ! grep -qF "$line" "$file"; then
            echo "$line" >> "$file"
          fi
        }

        GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
        XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
        DRIVERS_MAKEFILE="drivers/Makefile"
        MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
        MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
        MIN_KDP_DST="drivers/min_kdp.c"

        ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
        ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
        ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

        if [ ! -f "$MIN_KDP_PATCH" ]; then
          echo "::error::补丁不存在: $MIN_KDP_PATCH"
          exit 1
        fi
        if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
          patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
        else
          echo "min_kdp symbols patch 已应用或当前上下文不匹配，跳过。"
        fi

        if [ ! -f "$MIN_KDP_SRC" ]; then
          echo "::error::文件不存在: $MIN_KDP_SRC"
          exit 1
        fi
        cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
        ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

        ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"
    - name: 配置 ZRAM 选项
      if: ${{ inputs.use_zram }}
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: zram
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: ZRAM configuration failed
      run: |
        CONFIG_FILE="$DEFCONFIG"

        set_config_value() {
          local symbol="$1"
          local value="$2"
          local clean_symbol tmp

          clean_symbol="${symbol#CONFIG_}"
          tmp="$(mktemp)"
          grep -v -E "^(CONFIG_${clean_symbol}=|# CONFIG_${clean_symbol} is not set$)" "$CONFIG_FILE" > "$tmp" || true
          case "$value" in
            n)
              printf '# CONFIG_%s is not set\n' "$clean_symbol" >> "$tmp"
              ;;
            *)
              printf 'CONFIG_%s=%s\n' "$clean_symbol" "$value" >> "$tmp"
              ;;
          esac
          mv "$tmp" "$CONFIG_FILE"
        }

        disable_config() {
          set_config_value "$1" n
        }

        enable_zstdp_base() {
          set_config_value CONFIG_XXHASH y
          set_config_value CONFIG_CRYPTO_ZSTDP y
        }

        enable_legacy_full_algos() {
          set_config_value CONFIG_CRYPTO_LZO y
          set_config_value CONFIG_CRYPTO_LZ4 y
          set_config_value CONFIG_CRYPTO_DEFLATE y
          set_config_value CONFIG_CRYPTO_ZSTD y
        }

        enable_modern_full_algos() {
          set_config_value CONFIG_ZRAM_BACKEND_LZO y
          set_config_value CONFIG_ZRAM_BACKEND_LZ4 y
          set_config_value CONFIG_ZRAM_BACKEND_LZ4HC y
          set_config_value CONFIG_ZRAM_BACKEND_ZSTD y
          set_config_value CONFIG_ZRAM_BACKEND_DEFLATE y
          set_config_value CONFIG_ZRAM_BACKEND_842 y
        }

        enable_legacy_algo() {
          local algo="$1"
          case "$algo" in
            "lzo")        set_config_value CONFIG_CRYPTO_LZO y ;;
            "lz4")        set_config_value CONFIG_CRYPTO_LZ4 y ;;
            "lz4hc")      set_config_value CONFIG_CRYPTO_LZ4HC y ;;
            "lz4k")       set_config_value CONFIG_CRYPTO_LZ4K y ;;
            "lz4k_oplus") set_config_value CONFIG_CRYPTO_LZ4K_OPLUS y ;;
            "lz4kd")      set_config_value CONFIG_CRYPTO_LZ4KD y ;;
            "deflate")    set_config_value CONFIG_CRYPTO_DEFLATE y ;;
            "842")        set_config_value CONFIG_CRYPTO_842 y ;;
            "zstd")       set_config_value CONFIG_CRYPTO_ZSTD y ;;
            "zstdp")      enable_zstdp_base ;;
            *) echo "::warning::未知的 ZRAM 算法: $algo，跳过" ;;
          esac
        }

        enable_modern_algo() {
          local algo="$1"
          case "$algo" in
            "lzo")        set_config_value CONFIG_ZRAM_BACKEND_LZO y ;;
            "lz4")        set_config_value CONFIG_ZRAM_BACKEND_LZ4 y ;;
            "lz4hc")      set_config_value CONFIG_ZRAM_BACKEND_LZ4HC y ;;
            "deflate")    set_config_value CONFIG_ZRAM_BACKEND_DEFLATE y ;;
            "842")        set_config_value CONFIG_ZRAM_BACKEND_842 y ;;
            "zstd")       set_config_value CONFIG_ZRAM_BACKEND_ZSTD y ;;
            "zstdp")      set_config_value CONFIG_ZRAM_BACKEND_ZSTDP y; enable_zstdp_base ;;
            "lz4k"|"lz4k_oplus"|"lz4kd")
              echo "::warning::${algo} 暂不支持 6.12 新式 zram backend，跳过"
              ;;
            *)
              echo "::warning::未知的 ZRAM 算法: $algo，跳过"
              ;;
          esac
        }

        if [ "${{ matrix.kernel_version }}" = "5.10" ]; then
          set_config_value CONFIG_MODULE_SIG n
        fi

        set_config_value CONFIG_ZSMALLOC y
        set_config_value CONFIG_ZRAM y

        if [ -f "$KERNEL_ROOT/common/modules.bzl" ]; then
          sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
        fi

        if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
          if [ "${{ matrix.kernel_version }}" != "6.12" ]; then
            while IFS= read -r line; do
              case "$line" in
                ''|'#'*) continue ;;
                CONFIG_*=*)
                  set_config_value "${line%%=*}" "${line#*=}"
                  ;;
              esac
            done < "$ZZH_PATCHES/config/zram.config"
          fi
        fi

        # ---- ZRAM 完整算法支持 ----
        if [ "${EFFECTIVE_ZRAM_FULL_ALGO:-false}" = "true" ]; then
          echo "启用 ZRAM 完整算法支持..."
          if [ "${{ matrix.kernel_version }}" = "6.12" ]; then
            enable_modern_full_algos
          else
            enable_legacy_full_algos
          fi
        elif [ -n "${EFFECTIVE_ZRAM_EXTRA_ALGOS:-}" ]; then
          # ---- 自定义单独算法 ----
          echo "添加自定义 ZRAM 算法: $EFFECTIVE_ZRAM_EXTRA_ALGOS"
          IFS=',' read -ra ALGOS <<< "$EFFECTIVE_ZRAM_EXTRA_ALGOS"
          for raw_algo in "${ALGOS[@]}"; do
            algo=$(echo "$raw_algo" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            if [ "${{ matrix.kernel_version }}" = "6.12" ]; then
              enable_modern_algo "$algo"
            else
              enable_legacy_algo "$algo"
            fi
          done
        fi
    - name: 添加 BBG 防格机补丁
      if: inputs.use_bbg
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: bbg
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: BBG integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        BBG_MAKEFILE="Baseband-guard/Makefile"
        if { { [ "${{ matrix.android_version }}" = "android12" ] && \
               [ "${{ matrix.kernel_version }}" = "5.10" ]; } || \
             { [ "${{ matrix.android_version }}" = "android13" ] && \
               [ "${{ matrix.kernel_version }}" = "5.15" ]; }; } && \
           [ -f "$BBG_MAKEFILE" ]; then
          echo "应用 BBG legacy host header 生成兼容修复: ${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}"
          python3 - "$BBG_MAKEFILE" "common/security/selinux" <<'PY'
        import sys
        import re
        from pathlib import Path

        makefile = Path(sys.argv[1])
        selinux_dir = Path(sys.argv[2])
        include_dir = selinux_dir / "include"
        classmap_h = include_dir / "classmap.h"
        initial_sid_h = include_dir / "initial_sid_to_string.h"

        def join_continuations(text):
            lines = []
            buf = ""
            for raw in text.splitlines():
                line = raw.rstrip()
                if line.endswith("\\"):
                    buf += line[:-1] + " "
                else:
                    lines.append(buf + line)
                    buf = ""
            if buf:
                lines.append(buf)
            return "\n".join(lines)

        def strip_comments(text):
            text = re.sub(r"/\*.*?\*/", "", text, flags=re.S)
            text = re.sub(r"//.*", "", text)
            return text

        classmap_text = strip_comments(join_continuations(classmap_h.read_text(encoding="utf-8")))
        initial_sid_text = strip_comments(join_continuations(initial_sid_h.read_text(encoding="utf-8")))

        macros = {
            name: body.strip()
            for name, body in re.findall(r"^\s*#define\s+([A-Za-z_][A-Za-z0-9_]*)\s+(.+)$", classmap_text, re.M)
        }

        def expand_list(expr, seen=()):
            values = []
            for string_value, ident in re.findall(r'"([^"]+)"|([A-Za-z_][A-Za-z0-9_]*)', expr):
                if string_value:
                    values.append(string_value.upper())
                elif ident == "NULL":
                    continue
                elif ident in macros and ident not in seen:
                    values.extend(expand_list(macros[ident], seen + (ident,)))
            return values

        secclasses = []
        body_match = re.search(r"secclass_map\s*\[\]\s*=\s*\{(.*)\};", classmap_text, re.S)
        if not body_match:
            raise SystemExit("secclass_map not found")

        for class_name, perms_expr in re.findall(r'\{\s*"([^"]+)"\s*,\s*\{(.*?)\}\s*\}', body_match.group(1), re.S):
            secclasses.append((class_name.upper(), expand_list(perms_expr)))

        sid_match = re.search(r"initial_sid_to_string\s*\[\]\s*=\s*\{(.*)\};", initial_sid_text, re.S)
        if not sid_match:
            raise SystemExit("initial_sid_to_string not found")

        initial_sids = []
        for string_value, null_value in re.findall(r'"([^"]+)"|(NULL)', sid_match.group(1)):
            initial_sids.append(string_value.upper() if string_value else None)

        flask_lines = [
            "/* This file is automatically generated. Do not edit. */",
            "#ifndef _SELINUX_FLASK_H_",
            "#define _SELINUX_FLASK_H_",
            "",
        ]
        for idx, (class_name, _) in enumerate(secclasses, 1):
            flask_lines.append(f"#define SECCLASS_{class_name:<39} {idx:2d}")

        flask_lines.append("")
        for idx, sid_name in enumerate(initial_sids):
            if idx and sid_name:
                flask_lines.append(f"#define SECINITSID_{sid_name:<39} {idx:2d}")

        flask_lines.extend([
            f"\n#define SECINITSID_NUM {len(initial_sids) - 1}",
            "",
            "static inline bool security_is_socket_class(u16 kern_tclass)",
            "{",
            "\tbool sock = false;",
            "",
            "\tswitch (kern_tclass) {",
        ])
        for class_name, _ in secclasses:
            if class_name.endswith("SOCKET"):
                flask_lines.append(f"\tcase SECCLASS_{class_name}:")
        flask_lines.extend([
            "\t\tsock = true;",
            "\t\tbreak;",
            "\tdefault:",
            "\t\tbreak;",
            "\t}",
            "",
            "\treturn sock;",
            "}",
            "",
            "#endif",
            "",
        ])

        av_lines = [
            "/* This file is automatically generated. Do not edit. */",
            "#ifndef _SELINUX_AV_PERMISSIONS_H_",
            "#define _SELINUX_AV_PERMISSIONS_H_",
            "",
        ]
        for class_name, perms in secclasses:
            for bit, perm in enumerate(perms):
                if bit >= 32:
                    raise SystemExit(f"too many permissions for {class_name}")
                pad = " " * max(1, 40 - len(class_name) - len(perm))
                av_lines.append(f"#define {class_name}__{perm}{pad}0x{1 << bit:08x}U")
        av_lines.extend(["", "#endif", ""])

        (selinux_dir / "flask.h").write_text("\n".join(flask_lines), encoding="utf-8")
        (selinux_dir / "av_permissions.h").write_text("\n".join(av_lines), encoding="utf-8")

        text = makefile.read_text(encoding="utf-8")
        text = text.replace(
            "ifneq ($(wildcard $(objtree)/security/selinux/flask.h),)",
            "ifneq ($(wildcard $(objtree)/security/selinux/flask.h $(srctree)/security/selinux/flask.h),)",
            1,
        )

        makefile.write_text(text, encoding="utf-8")
        PY
        fi
        echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
    - name: 添加 DDK 防格机 LSM
      if: inputs.use_ddk
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: ddk
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: DDK integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        echo "应用 Xingguang DDK patch 栈并启用内建 LSM"
        bash "$ZZH_PATCHES/ddk/setup.sh"
        test -f common/include/linux/xingguang_ddk.h
        grep -q '^CONFIG_XINGGUANG_DDK=y$' "$DEFCONFIG" || echo "CONFIG_XINGGUANG_DDK=y" >> "$DEFCONFIG"
    - name: 应用 Re-Kernel
      if: inputs.use_rekernel
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: rekernel
        ABK_FEATURE_END: 'true'
        ABK_FEATURE_FAILURE_MESSAGE: Re-Kernel integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        echo "Integrating Re-Kernel..."
        TMP_REKERNEL="$RUNNER_TEMP/rekernel-source"
        python3 "$GITHUB_WORKSPACE/tools/rekernel_source.py" --output "$TMP_REKERNEL"

        REKERNEL_SRC="$TMP_REKERNEL/LKM-Source"
        if [ ! -d "$REKERNEL_SRC" ]; then
          echo "::error::Re-Kernel upstream 缺少 LKM-Source 目录"
          exit 1
        fi

        test -f "$REKERNEL_SRC/Makefile"
        test -f "$REKERNEL_SRC/Kconfig"
        test -f "$REKERNEL_SRC/rekernel_main.c"
        test -f "$REKERNEL_SRC/rekernel.h"

        # 准备驱动源码（上游已改为多文件结构）
        rm -rf common/drivers/rekernel
        mkdir -p common/drivers/rekernel
        cp "$REKERNEL_SRC"/*.c common/drivers/rekernel/
        cp "$REKERNEL_SRC"/*.h common/drivers/rekernel/
        cp "$REKERNEL_SRC/Makefile" common/drivers/rekernel/
        cp "$REKERNEL_SRC/Kconfig" common/drivers/rekernel/

        # 适配上游 LKM Makefile 到 in-tree 构建
        sed -i 's/^obj-m[[:space:]]*:=/obj-$(CONFIG_REKERNEL) +=/' common/drivers/rekernel/Makefile

        # 适配上游 Kconfig 到 ABK 当前的 in-tree 默认启用方式
        sed -i '/depends on MODULES/d' common/drivers/rekernel/Kconfig
        sed -i '0,/bool "Re:Kernel module"/s//bool "Re:Kernel support (GKI Vendor Hooks)"/' common/drivers/rekernel/Kconfig
        sed -i '0,/default n/s//\tdefault y/' common/drivers/rekernel/Kconfig

        # 挂载到驱动树
        if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
          sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
        fi
        if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
          echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
        fi

        # 修正头文件包含路径（适配 in-tree 编译）
        if [ -f common/drivers/rekernel/rekernel_binder.c ]; then
          sed -i 's|#include <../android/binder_internal.h>|#include "../../drivers/android/binder_internal.h"|g' common/drivers/rekernel/rekernel_binder.c
          grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c || \
            sed -i '/#include <trace\/hooks\/binder.h>/i #include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c
        fi

        python3 "$GITHUB_WORKSPACE/tools/historical_rekernel.py" --kernel-root "$KERNEL_ROOT"

        # 配置 defconfig（幂等）
        grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
        grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"
    - name: 执行自定义外部模块 (after_patch)
      if: inputs.custom_external_modules != ''
      env:
        CUSTOM_EXTERNAL_MODULE_STAGE: after_patch
        ABK_BUILD_ANDROID_VERSION: ${{ matrix.android_version }}
        ABK_BUILD_KERNEL_VERSION: ${{ matrix.kernel_version }}
        ABK_BUILD_SUB_LEVEL: ${{ matrix.sub_level }}
        ABK_BUILD_OS_PATCH_LEVEL: ${{ matrix.os_patch_level }}
        ABK_BUILD_REVISION: ${{ matrix.revision }}
        ABK_BUILD_KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        ABK_BUILD_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ABK_BUILD_VERSION: ${{ inputs.version }}
        ABK_BUILD_TIME: ${{ inputs.build_time }}
        ABK_BUILD_VIRTUALIZATION_SUPPORT: ${{ (inputs.virtualization_support == 'off' && 'off' || (matrix.kernel_version ==
          '6.12' && 'on' || (inputs.virtualization_support == 'on' && '678' || inputs.virtualization_support))) }}
        ABK_BUILD_ZRAM_EXTRA_ALGOS: ${{ inputs.zram_extra_algos }}
        ABK_FEATURE_USE_ZRAM: ${{ inputs.use_zram }}
        ABK_FEATURE_USE_BBG: ${{ inputs.use_bbg }}
        ABK_FEATURE_USE_DDK: ${{ inputs.use_ddk }}
        ABK_FEATURE_USE_NTSYNC: ${{ inputs.use_ntsync }}
        ABK_FEATURE_USE_NETWORKING: ${{ inputs.use_networking }}
        ABK_FEATURE_USE_KPM: ${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU'))
          }}
        ABK_FEATURE_USE_REKERNEL: ${{ inputs.use_rekernel }}
        ABK_FEATURE_ENABLE_SUSFS: ${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}
        ABK_FEATURE_SUPP_OP: ${{ inputs.supp_op }}
        ABK_FEATURE_ZRAM_FULL_ALGO: ${{ inputs.zram_full_algo }}
      run: |
        set -euo pipefail
        export ABK_BUILD_KSU_BRANCH="${EFFECTIVE_KSU_BRANCH:-$ABK_BUILD_KSU_BRANCH}"

        manifest="$CUSTOM_EXTERNAL_MODULES_MANIFEST"
        if [ ! -s "$manifest" ]; then
          echo "未找到自定义外部模块清单，跳过 $CUSTOM_EXTERNAL_MODULE_STAGE。"
          exit 0
        fi

        executed=0
        while IFS=$'\t' read -r stage module_dir repo_url entry_kind group_repo_url child_id; do
          [ "$stage" = "$CUSTOM_EXTERNAL_MODULE_STAGE" ] || continue

          setup="$module_dir/setup.sh"
          if [ ! -f "$setup" ]; then
            echo "::error::自定义外部模块缺少入口文件 setup.sh: $repo_url ($module_dir)"
            exit 1
          fi

          chmod +x "$setup"
          echo "::group::执行自定义外部模块 [$stage] $repo_url"
          (
            cd "$module_dir"
            echo "external module execution context:"
            echo "  repo_url: $repo_url"
            echo "  module_dir: $module_dir"
            echo "  entry_kind: ${entry_kind:-module}"
            echo "  child_id: ${child_id:-}"
            echo "  head_sha: $(git rev-parse HEAD)"
            echo "  branch: $(git branch --show-current || true)"
            echo "  origin: $(git remote get-url origin)"
            echo "  head_log: $(git log -1 --oneline)"
            export ABK_MODULE_ENTRY_KIND="${entry_kind:-module}"
            export ABK_MODULE_GROUP_REPO_URL="${group_repo_url:-}"
            export ABK_MODULE_CHILD_ID="${child_id:-}"
            bash "$setup"
          )
          echo "::endgroup::"
          executed=$((executed + 1))
        done < "$manifest"

        if [ "$executed" -eq 0 ]; then
          echo "没有配置 $CUSTOM_EXTERNAL_MODULE_STAGE 阶段的自定义外部模块。"
        fi
    - name: 配置内核选项
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        feature_disabled() {
          [ "${{ 'aosp' }}" = "custom_git" ] &&
            [ -f "$ABK_CUSTOM_SOURCE_TRANSACTION_DIR/$1.disabled" ]
        }
        kpm_kconfig_status="${ABK_KPM_KCONFIG_STATUS:-unknown}"
        kpm_kconfig_ready="${ABK_KPM_KCONFIG_READY:-false}"
        kpm_kconfig_path="${ABK_KPM_KCONFIG_PATH:-}"

        cat >> "$DEFCONFIG" << 'EOF'
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        EOF
        if [ "${{ inputs.kernelsu_variant }}" != "None" ] && ! feature_disabled kernelsu; then
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
        fi

        kpm_config_supported="false"
        if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
          if [ "$kpm_kconfig_ready" = "true" ] && [ -f "$kpm_kconfig_path" ]; then
            kpm_config_supported="true"
          else
            for dir in KernelSU/kernel common/drivers/kernelsu drivers/kernelsu kernel; do
            if [ -f "$dir/Kconfig" ] && rg -n '^[[:space:]]*config[[:space:]]+KPM\b' "$dir/Kconfig" >/dev/null 2>&1; then
              kpm_config_supported="true"
              break
            fi
            done
          fi
        fi

        if [ "${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')) }}" == "true" ] && ! feature_disabled kpm && { [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; }; then
          if [ "$kpm_config_supported" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG"
            case "$kpm_kconfig_status" in
              native)
                echo "检测到原生 KPM Kconfig，已启用 CONFIG_KPM。"
                ;;
              injected)
                echo "源码未暴露 KPM Kconfig，已自动注入并启用 CONFIG_KPM。"
                ;;
              *)
                echo "检测到 KPM Kconfig，已启用 CONFIG_KPM。"
                ;;
            esac
          else
            echo "::error::请求启用 KPM，但当前 ${{ inputs.kernelsu_variant }} 源码树仍未提供 config KPM。"
            exit 1
          fi
        elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
          if [ "$kpm_config_supported" = "true" ]; then
            echo "# CONFIG_KPM is not set" >> "$DEFCONFIG"
            echo "检测到 KPM Kconfig，已显式关闭 CONFIG_KPM。"
          fi
        fi

        if [ "${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}" != "true" ] && { [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; }; then
          cat >> "$DEFCONFIG" << 'EOF'
        # CONFIG_KSU_SUSFS is not set
        # CONFIG_KSU_SUSFS_SUS_PATH is not set
        # CONFIG_KSU_SUSFS_SUS_MOUNT is not set
        # CONFIG_KSU_SUSFS_SUS_KSTAT is not set
        # CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
        # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
        # CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS is not set
        # CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set
        # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
        # CONFIG_KSU_SUSFS_SUS_MAP is not set
        EOF
        fi

        CURRENT_SUB="${{ matrix.sub_level }}"
        if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
          CURRENT_SUB=99999
        fi
        if [[ ( "${{ inputs.kernelsu_variant }}" == "Official" || "${{ inputs.kernelsu_variant }}" == "BakaSU" ) && "${{ matrix.android_version }}" == "android13" && "${{ matrix.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 41 && "$CURRENT_SUB" -le 137 ]]; then
          {
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DEFCONFIG"
        fi

        sed -i 's/check_defconfig//' ./common/build.config.gki
    - name: 配置 KPM 超级密码
      if: (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')) && (inputs.use_kpm
        && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') && inputs.kpm_password || '') != ''
        && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
      run: |
        echo "KPM 超级密码将在 Image KPM patch 阶段写入。"
        echo "CONFIG_KPM_SUPER_KEY 不是当前 KSU Kconfig 符号，不能写入 defconfig fragment。"
    - name: 添加 SUSFS 配置
      if: (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') && inputs.kernelsu_variant != 'None'
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: susfs
        ABK_FEATURE_FAILURE_MESSAGE: SUSFS defconfig integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        if [ "${SUSFS_COMPAT_VERSION:-}" != v2.3.0 ] && [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
          KSU_SOURCE_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel kernel; do
            if [ -f "$dir/infra/symbol_resolver.c" ]; then
              KSU_SOURCE_DIR="$dir"
              break
            fi
          done

          if [ -z "$KSU_SOURCE_DIR" ] \
            || ! grep -qF 'ksu_resolve_symbol_for_functable_hook' "$KSU_SOURCE_DIR/infra/symbol_resolver.c" \
            || ! grep -qF 'find_kernel_symbol_exact' "$KSU_SOURCE_DIR/infra/symbol_resolver.c" \
            || ! grep -qF 'ksu_init_symbol_resolver' "$KSU_SOURCE_DIR/infra/symbol_resolver.c"; then
            echo "::warning::SukiSU 源码仍缺少完整 SUSFS 导出符号，跳过 CONFIG_KSU_SUSFS* 写入以避免链接失败"
            exit 0
          fi
        fi

        cat >> "$DEFCONFIG" << 'EOF'
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        EOF

        if [ "${SUSFS_COMPAT_VERSION:-}" = v2.3.0 ]; then
          # The real preinit runner requires installed target UAPI headers.
          echo 'CONFIG_HEADERS_INSTALL=y' >> "$DEFCONFIG"
        fi
    - name: 配置内核名称
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        if [ -f "build/build.sh" ]; then
          sed -i 's/-dirty//' ./common/scripts/setlocalversion
        else
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
        fi

        VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
        if [ -n "$VERSION_INPUT" ]; then
          CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
          sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
          sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
        elif [ ! -f "build/build.sh" ]; then
          cd ./common
          BID="ab$((RANDOM % 90000000 + 10000000))"
          GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
          case "${{ matrix.android_version }}-${{ matrix.kernel_version }}" in
            "android14-6.1")  KMI_TAG="android14-11" ;;
            "android15-6.6")  KMI_TAG="android15-8" ;;
            "android16-6.12") KMI_TAG="android16-5" ;;
            *) KMI_TAG="${{ matrix.android_version }}" ;;
          esac

          if [ "${{ matrix.kernel_version }}" = "6.1" ]; then
            KMI_LOCAL="-${KMI_TAG}-g${GHASH}-${BID}-4k"
            sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
            sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
          else
            SUFFIX="-${KMI_TAG}-g${GHASH}-${BID}"
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'\$\{config_localversion\}"/s' ./scripts/setlocalversion 2>/dev/null || true
          fi
        fi
    - name: 设置自定义构建时间
      shell: bash
      run: |
        INPUT_TIME="${{ inputs.build_time }}"
        if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
          DATESTR="$INPUT_TIME"
        else
          DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
        fi

        echo "使用构建时间: $DATESTR"
        echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
        echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

        # 统一处理 mkcompile_h 补丁
        f="$KERNEL_ROOT/common/scripts/mkcompile_h"
        if [ -f "$f" ]; then
          if [[ "${{ matrix.kernel_version }}" == "5.10" || "${{ matrix.kernel_version }}" == "5.15" ]]; then
            echo "应用 5.x 经典时间戳补丁: $f"
            perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
          else
            echo "应用 6.x mkcompile_h 补丁: $f"
            if grep -q 'UTS_VERSION=' "$f"; then
              perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
            fi
          fi
        fi
    - name: 执行自定义外部模块 (before_build)
      if: inputs.custom_external_modules != ''
      env:
        CUSTOM_EXTERNAL_MODULE_STAGE: before_build
        ABK_BUILD_ANDROID_VERSION: ${{ matrix.android_version }}
        ABK_BUILD_KERNEL_VERSION: ${{ matrix.kernel_version }}
        ABK_BUILD_SUB_LEVEL: ${{ matrix.sub_level }}
        ABK_BUILD_OS_PATCH_LEVEL: ${{ matrix.os_patch_level }}
        ABK_BUILD_REVISION: ${{ matrix.revision }}
        ABK_BUILD_KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        ABK_BUILD_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ABK_BUILD_VERSION: ${{ inputs.version }}
        ABK_BUILD_TIME: ${{ inputs.build_time }}
        ABK_BUILD_VIRTUALIZATION_SUPPORT: ${{ (inputs.virtualization_support == 'off' && 'off' || (matrix.kernel_version ==
          '6.12' && 'on' || (inputs.virtualization_support == 'on' && '678' || inputs.virtualization_support))) }}
        ABK_BUILD_ZRAM_EXTRA_ALGOS: ${{ inputs.zram_extra_algos }}
        ABK_FEATURE_USE_ZRAM: ${{ inputs.use_zram }}
        ABK_FEATURE_USE_BBG: ${{ inputs.use_bbg }}
        ABK_FEATURE_USE_DDK: ${{ inputs.use_ddk }}
        ABK_FEATURE_USE_NTSYNC: ${{ inputs.use_ntsync }}
        ABK_FEATURE_USE_NETWORKING: ${{ inputs.use_networking }}
        ABK_FEATURE_USE_KPM: ${{ (inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU'))
          }}
        ABK_FEATURE_USE_REKERNEL: ${{ inputs.use_rekernel }}
        ABK_FEATURE_ENABLE_SUSFS: ${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}
        ABK_FEATURE_SUPP_OP: ${{ inputs.supp_op }}
        ABK_FEATURE_ZRAM_FULL_ALGO: ${{ inputs.zram_full_algo }}
      run: |
        set -euo pipefail
        export ABK_BUILD_KSU_BRANCH="${EFFECTIVE_KSU_BRANCH:-$ABK_BUILD_KSU_BRANCH}"

        manifest="$CUSTOM_EXTERNAL_MODULES_MANIFEST"
        if [ ! -s "$manifest" ]; then
          echo "未找到自定义外部模块清单，跳过 $CUSTOM_EXTERNAL_MODULE_STAGE。"
          exit 0
        fi

        executed=0
        while IFS=$'\t' read -r stage module_dir repo_url entry_kind group_repo_url child_id; do
          [ "$stage" = "$CUSTOM_EXTERNAL_MODULE_STAGE" ] || continue

          setup="$module_dir/setup.sh"
          if [ ! -f "$setup" ]; then
            echo "::error::自定义外部模块缺少入口文件 setup.sh: $repo_url ($module_dir)"
            exit 1
          fi

          chmod +x "$setup"
          echo "::group::执行自定义外部模块 [$stage] $repo_url"
          (
            cd "$module_dir"
            export ABK_MODULE_ENTRY_KIND="${entry_kind:-module}"
            export ABK_MODULE_GROUP_REPO_URL="${group_repo_url:-}"
            export ABK_MODULE_CHILD_ID="${child_id:-}"
            bash "$setup"
          )
          echo "::endgroup::"
          executed=$((executed + 1))
        done < "$manifest"

        if [ "$executed" -eq 0 ]; then
          echo "没有配置 $CUSTOM_EXTERNAL_MODULE_STAGE 阶段的自定义外部模块。"
        fi
    - name: 应用自定义内核选项
      if: inputs.custom_kernel_options != ''
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        CUSTOM_KERNEL_OPTIONS: ${{ inputs.custom_kernel_options }}
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import os
        import re
        import subprocess
        from pathlib import Path

        defconfig = Path(os.environ["DEFCONFIG"])
        config_files = [defconfig]
        stock_defconfig = defconfig.parent / "stock_defconfig"
        if stock_defconfig.is_file():
            # config_data 指向 stock_defconfig 时，用户配置也必须写入这份
            # 配置，否则 /proc/config.gz 仍会显示 stock 中的旧值。
            config_files.append(stock_defconfig)
            print(f"将用户配置覆盖到 stock_defconfig: {stock_defconfig}")

        text_by_path = {
            path: path.read_text().splitlines()
            for path in config_files
        }
        lines = os.environ["CUSTOM_KERNEL_OPTIONS"].replace("\r", "").splitlines()

        parsed = []
        disabled_re = re.compile(r"^#\s*(CONFIG_[A-Za-z0-9_]+)\s+is\s+not\s+set$", re.I)
        assigned_re = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.+)$")

        def normalize_symbol(raw: str) -> str:
            candidate = raw.strip().replace(" ", "")
            if not candidate:
                return ""
            if not candidate.upper().startswith("CONFIG_"):
                candidate = f"CONFIG_{candidate}"
            candidate = candidate.upper()
            if not re.fullmatch(r"CONFIG_[A-Z0-9_]+", candidate):
                return ""
            return candidate

        def config_defined(symbol: str) -> bool:
            name = symbol.removeprefix("CONFIG_")
            result = subprocess.run(
                [
                    "bash",
                    "-lc",
                    "find . -type f -name 'Kconfig*' -print0 | xargs -0 grep -El \"^[[:space:]]*(menuconfig|config)[[:space:]]+" + name + "([[:space:]]|$)\" >/dev/null"
                ],
                cwd=os.getcwd(),
            )
            return result.returncode == 0

        def set_config_value(text_lines, symbol: str, mode: str, value: str = ""):
            clean = symbol.removeprefix("CONFIG_")
            filtered = []
            for line in text_lines:
                if re.match(rf"^(CONFIG_{re.escape(clean)}=|# CONFIG_{re.escape(clean)} is not set$)", line):
                    continue
                filtered.append(line)
            if mode == "disabled":
                filtered.append(f"# CONFIG_{clean} is not set")
            elif mode == "raw":
                filtered.append(f"CONFIG_{clean}={value}")
            else:
                filtered.append(f"CONFIG_{clean}={mode}")
            return filtered

        for raw in lines:
            clean = raw.strip()
            if not clean:
                continue
            if clean.startswith("#") and not clean.startswith("# CONFIG_"):
                continue
            disabled = disabled_re.match(clean)
            assigned = assigned_re.match(clean)
            if disabled:
                symbol = normalize_symbol(disabled.group(1))
                if symbol:
                    parsed.append((symbol, "disabled", ""))
                continue
            if assigned:
                symbol = normalize_symbol(assigned.group(1))
                value = assigned.group(2).strip()
                if not symbol:
                    print(f"::warning::无效自定义内核选项，已跳过: {clean}")
                    continue
                if value.lower() == "y":
                    parsed.append((symbol, "y", ""))
                elif value.lower() == "m":
                    parsed.append((symbol, "m", ""))
                elif value.lower() == "n":
                    parsed.append((symbol, "disabled", ""))
                else:
                    parsed.append((symbol, "raw", value))
                continue
            print(f"::warning::无法识别的自定义内核选项行，已跳过: {clean}")

        deduped = []
        seen = set()
        for symbol, mode, value in reversed(parsed):
            if symbol in seen:
                continue
            seen.add(symbol)
            deduped.append((symbol, mode, value))
        deduped.reverse()

        applied = 0
        skipped = 0
        for symbol, mode, value in deduped:
            if not config_defined(symbol):
                print(f"::warning::{symbol} 未在 Kconfig 中定义，已跳过")
                skipped += 1
                continue
            for path in config_files:
                text_by_path[path] = set_config_value(
                    text_by_path[path], symbol, mode, value
                )
            applied += 1
            if mode == "raw":
                print(f"Applied custom kernel option: {symbol}={value}")
            elif mode == "disabled":
                print(f"Applied custom kernel option: # {symbol} is not set")
            else:
                print(f"Applied custom kernel option: {symbol}={mode}")

        for path, text_lines in text_by_path.items():
            path.write_text("\n".join(text_lines) + "\n")
        print(
            f"自定义内核选项: 应用 {applied} 条，跳过 {skipped} 条，"
            f"目标配置: {', '.join(path.name for path in config_files)}"
        )
        PY
    - name: 修复 Official SUSFS 源码兼容
      if: inputs.kernelsu_variant == 'Official' && (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU')
      env:
        BASH_ENV: ${{ 'aosp' == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace)
          || '' }}
        ABK_FEATURE_ID: susfs
        ABK_FEATURE_FAILURE_MESSAGE: Official SUSFS compatibility integration failed
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from pathlib import Path
        from textwrap import dedent
        import re

        INIT_BODY = """int __init kernelsu_init(void)
        {
        #ifdef CONFIG_KSU_DEBUG
            pr_alert("*************************************************************");
            pr_alert("**     NOTICE NOTICE NOTICE NOTICE NOTICE NOTICE NOTICE    **");
            pr_alert("**                                                         **");
            pr_alert("**         You are running KernelSU in DEBUG mode          **");
            pr_alert("**                                                         **");
            pr_alert("**     NOTICE NOTICE NOTICE NOTICE NOTICE NOTICE NOTICE    **");
            pr_alert("*************************************************************");
        #endif

            if (allow_shell) {
                pr_alert("shell is allowed at init!");
            }

            ksu_cred = prepare_creds();
            if (!ksu_cred) {
                pr_err("prepare cred failed!\\n");
            }

        #ifdef CONFIG_KSU_SUSFS
            susfs_init();
        #endif // #ifdef CONFIG_KSU_SUSFS

            ksu_feature_init();

            ksu_supercalls_init();

            ksu_sucompat_init();

            ksu_setuid_hook_init();

            ksu_sulog_init();

            ksu_adb_root_init();
            ksu_selinux_hide_init();

            ksu_allowlist_init();

            ksu_throne_tracker_init();

            ksu_ksud_init();

            ksu_file_wrapper_init();

            return 0;
        }
        """

        EXIT_BODY = """void __exit kernelsu_exit(void)
        {
            ksu_supercalls_exit();

            // Wait for any in-flight RCU readers (e.g. handler traversing allow_list)
            synchronize_rcu();

            // Now safe to release data structures
            ksu_observer_exit();

            ksu_throne_tracker_exit();

            ksu_allowlist_exit();

            ksu_selinux_hide_exit();
            ksu_adb_root_exit();

            ksu_sulog_exit();

            ksu_feature_exit();

            if (ksu_cred) {
                put_cred(ksu_cred);
            }
        }
        """

        def replace_function(text, signature, replacement):
            start = text.find(signature)
            if start == -1:
                raise SystemExit(f"function not found: {signature}")

            brace = text.find("{", start)
            if brace == -1:
                raise SystemExit(f"function body not found: {signature}")

            depth = 0
            end = None
            for index in range(brace, len(text)):
                char = text[index]
                if char == "{":
                    depth += 1
                elif char == "}":
                    depth -= 1
                    if depth == 0:
                        end = index + 1
                        break

            if end is None:
                raise SystemExit(f"function body is not balanced: {signature}")

            return text[:start] + replacement + text[end:]

        def ensure_line_after(text, anchor, line):
            if line in text:
                return text
            if anchor not in text:
                raise SystemExit(f"include anchor not found: {anchor.strip()}")
            return text.replace(anchor, anchor + line, 1)

        def ensure_include(text, include, anchor):
            if include in text:
                return text
            if anchor in text:
                return text.replace(anchor, anchor + include + "\n", 1)
            return include + "\n" + text

        def replace_first_function(text, signatures, replacement):
            for signature in signatures:
                pattern = re.compile(re.escape(signature) + r"\s*\{")
                match = pattern.search(text)
                if not match:
                    continue
                start = match.start()
                brace = match.end() - 1
                depth = 0
                for index in range(brace, len(text)):
                    if text[index] == "{":
                        depth += 1
                    elif text[index] == "}":
                        depth -= 1
                        if depth == 0:
                            return text[:start] + replacement + text[index + 1:]
                raise SystemExit(f"function body is not balanced: {signature}")
            raise SystemExit(f"function not found: {' / '.join(signatures)}")

        def ensure_official_runtime_compat(ksu_dir):
            path = ksu_dir / "runtime/ksud_integration.c"
            if not path.exists():
                return False

            text = path.read_text()
            original = text

            text = re.sub(
                r"(?m)^(?:static\s+)?void\s+ksu_handle_sys_read\s*\(\s*unsigned int fd\s*,\s*char __user \*\*buf_ptr\s*,\s*size_t \*count_ptr\s*\)",
                "void ksu_handle_sys_read(unsigned int fd)",
                text,
                count=1,
            )
            text = re.sub(
                r"(?m)^static void\s+ksu_handle_sys_read\s*\(\s*unsigned int fd\s*\)",
                "void ksu_handle_sys_read(unsigned int fd)",
                text,
                count=1,
            )
            text = text.replace("ksu_handle_sys_read(fd, buf_ptr, count_ptr);", "ksu_handle_sys_read(fd);")
            text = ensure_include(text, "#include <linux/static_key.h>", "#include <linux/printk.h>\n")
            if "register_kprobe(" in text or "unregister_kprobe(" in text or "struct kprobe" in text:
                text = ensure_include(text, "#include <linux/kprobes.h>", "#include <linux/input-event-codes.h>\n")

            if "DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);" not in text:
                block = dedent("""\

                #ifdef CONFIG_KSU_SUSFS
                DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);
                DEFINE_STATIC_KEY_TRUE(ksu_is_input_hook_enabled);
                #endif
                """)
                anchor = '#include "hook/syscall_event_bridge.h"\n'
                if anchor not in text:
                    raise SystemExit(f"{path} 缺少 syscall_event_bridge include，无法注入 Official runtime static key")
                text = text.replace(anchor, anchor + block, 1)

            decls = []
            if not re.search(r"(?m)^static void stop_init_rc_hook\s*\(\s*(?:void)?\s*\)\s*;", text):
                decls.append("static void stop_init_rc_hook(void);")
            if not re.search(r"(?m)^void ksu_stop_input_hook_runtime\s*\(\s*(?:void)?\s*\)\s*;", text):
                decls.append("void ksu_stop_input_hook_runtime(void);")
            if "stop_input_hook_work" in text and not re.search(r"(?m)^static struct work_struct stop_input_hook_work\s*;", text):
                decls.append("static struct work_struct stop_input_hook_work;")
            if decls:
                block = "\n/* ABK: Official SUSFS runtime compatibility declarations. */\n" + "\n".join(decls) + "\n"
                for anchor in ("// clang-format on\n", '#include "hook/syscall_event_bridge.h"\n'):
                    if anchor in text:
                        text = text.replace(anchor, anchor + block, 1)
                        break
                else:
                    raise SystemExit(f"{path} 缺少 runtime 声明插入锚点")

            if (
                not re.search(r"(?m)^void\s+ksu_handle_vfs_fstat\s*\(", text)
                or "orig_sys_fstat(" in text
                or "statbuf" in text
            ):
                load_module = "        load_module_rc_once();\n" if "load_module_rc_once(" in text else ""
                extra_expr = "ksu_rc_len + module_rc_len" if "module_rc_len" in text else "ksu_rc_len"
                log_args = (
                    ', orig_size, *kstat_size_ptr, ksu_rc_len, module_rc_len'
                    if "module_rc_len" in text
                    else ', orig_size, *kstat_size_ptr, ksu_rc_len'
                )
                log_fmt = (
                    'adding rc len: %lld -> %lld (static=%zu module=%zu)'
                    if "module_rc_len" in text
                    else 'adding rc len: %lld -> %lld (static=%zu)'
                )
                block = (
                    "void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)\n"
                    "{\n"
                    "    loff_t orig_size;\n"
                    "    size_t extra;\n"
                    "    struct file *file;\n\n"
                    "    if (!kstat_size_ptr)\n"
                    "        return;\n\n"
                    "    file = fget(fd);\n"
                    "    if (!file)\n"
                    "        return;\n\n"
                    "    if (is_init_rc(file)) {\n"
                    "        orig_size = *kstat_size_ptr;\n"
                    f"{load_module}"
                    f"        extra = {extra_expr};\n"
                    "        *kstat_size_ptr = orig_size + extra;\n"
                    f"        pr_info(\"{log_fmt}\"{log_args});\n"
                    "    }\n"
                    "    fput(file);\n"
                    "}\n\n"
                )
                replaced = False
                for signature in (
                    "void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)",
                    "static long ksu_sys_fstat(const struct pt_regs *regs)",
                ):
                    if re.search(re.escape(signature) + r"\s*\{", text):
                        text = replace_first_function(text, (signature,), block)
                        replaced = True
                        break
                if not replaced:
                    for anchor in (
                        "\nstatic long (*orig_sys_read)(const struct pt_regs *regs);",
                        "\nstatic unsigned int volumedown_pressed_count",
                    ):
                        if anchor in text:
                            text = text.replace(anchor, "\n" + block + anchor.lstrip("\n"), 1)
                            replaced = True
                            break
                if not replaced:
                    raise SystemExit(f"{path} 缺少 ksu_handle_vfs_fstat 插入锚点")

            if "ksu init rc inline hook disabled" not in text and "ksu_syscall_table_unhook(" in text:
                text = replace_first_function(
                    text,
                    ("static void stop_init_rc_hook()", "static void stop_init_rc_hook(void)"),
                    dedent("""\
                    static void stop_init_rc_hook(void)
                    {
                    #ifdef CONFIG_KSU_SUSFS
                        if (static_key_enabled(&ksu_is_init_rc_hook_enabled)) {
                            static_branch_disable(&ksu_is_init_rc_hook_enabled);
                            pr_info("ksu init rc inline hook disabled\\n");
                        }
                    #else
                        ksu_syscall_table_unhook(__NR_read);
                        ksu_syscall_table_unhook(__NR_fstat);
                        pr_info("unregister init_rc syscall hook\\n");
                    #endif
                    }
                    """),
                )

            if (
                "ksu input inline hook disabled" not in text
                and re.search(r"(?m)^void\s+ksu_stop_input_hook_runtime\s*\([^;{]*\)\s*\{", text)
            ):
                text = replace_first_function(
                    text,
                    ("void ksu_stop_input_hook_runtime(void)", "void ksu_stop_input_hook_runtime()"),
                    dedent("""\
                    void ksu_stop_input_hook_runtime(void)
                    {
                        static bool input_hook_stopped = false;
                        bool ret;

                        if (input_hook_stopped) {
                            return;
                        }
                        input_hook_stopped = true;
                    #ifdef CONFIG_KSU_SUSFS
                        if (static_key_enabled(&ksu_is_input_hook_enabled)) {
                            static_branch_disable(&ksu_is_input_hook_enabled);
                            pr_info("ksu input inline hook disabled\\n");
                        }
                    #endif
                        ret = schedule_work(&stop_input_hook_work);
                        pr_info("unregister input kprobe: %d!\\n", ret);
                    }
                    """),
                )

            if "ksud: using SUSFS inline init.rc hooks" not in text and "ksu_syscall_table_hook(" in text:
                text = replace_first_function(
                    text,
                    ("void __init ksu_ksud_init()", "void __init ksu_ksud_init(void)"),
                    dedent("""\
                    void __init ksu_ksud_init(void)
                    {
                        int ret;

                    #ifndef CONFIG_KSU_SUSFS
                        ksu_syscall_table_hook(__NR_read, ksu_sys_read, &orig_sys_read);
                        ksu_syscall_table_hook(__NR_fstat, ksu_sys_fstat, &orig_sys_fstat);
                    #else
                        pr_info("ksud: using SUSFS inline init.rc hooks\\n");
                    #endif

                        ret = register_kprobe(&input_event_kp);
                        pr_info("ksud: input_event_kp: %d\\n", ret);

                        INIT_WORK(&stop_input_hook_work, do_stop_input_hook);
                    }
                    """),
                )

            if "ksu_handle_execveat_ksud(path, &argv);" in text:
                text = replace_first_function(
                    text,
                    ("void ksu_execve_hook_ksud(const struct pt_regs *regs)",),
                    dedent("""\
                    void ksu_execve_hook_ksud(const struct pt_regs *regs)
                    {
                    #ifdef CONFIG_KSU_SUSFS
                        /* ABK: Official SUSFS uses inline execve hooks instead. */
                        (void)regs;
                    #else
                        const char __user **filename_user = (const char **)&PT_REGS_PARM1(regs);
                        const char __user *const __user *__argv = (const char __user *const __user *)PT_REGS_PARM2(regs);
                        struct user_arg_ptr argv = { .ptr.native = __argv };
                        char path[32];
                        long ret;
                        unsigned long addr;
                        const char __user *fn;

                        if (!filename_user)
                            return;

                        addr = untagged_addr((unsigned long)*filename_user);
                        fn = (const char __user *)addr;

                        memset(path, 0, sizeof(path));
                        ret = strncpy_from_user(path, fn, 32);
                        if (ret < 0) {
                            pr_err("Access filename failed for execve_handler_pre\\n");
                            return;
                        }

                        ksu_handle_execveat_ksud(path, &argv);
                    #endif
                    }
                    """),
                )

            if text == original:
                return False

            path.write_text(text)
            print(f"已修复 {path} 的 Official SUSFS runtime 兼容")
            return True

        def ensure_official_boot_event_compat(ksu_dir):
            path = ksu_dir / "runtime/boot_event.c"
