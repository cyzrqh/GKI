          }}-${{ needs.prepare-matrix.outputs.manager_cert_size }}-${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}-${{
          'android17-6.18' }}-${{ fromJSON(needs.prepare-matrix.outputs.ddk_matrix).include[7].ddk_short }}${{ inputs.kernelsu_variant
          == 'BakaSU' && format('-kpm-{0}', hashFiles('tools/patches/bakasu-kpm.patch', 'config/bakasu-kpm-port.json')) ||
          '' }}
        lookup-only: false
        fail-on-cache-miss: false
      if: steps.manager-lkm-7.outputs.cache-hit != 'true'
    - name: 读取镜像修补模块 android17-6.18（等待后重试 2）
      if: steps.manager-lkm-7.outputs.cache-hit != 'true' && steps.manager-lkm-7-retry-1.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 20
    - name: 读取镜像修补模块 android17-6.18（第 3 次）
      id: manager-lkm-7-retry-2
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: manager-lkm/android17-6.18
        key: gki-sukisu-lkm-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare-matrix.outputs.ksu_ref }}-${{ needs.prepare-matrix.outputs.manager_package
          }}-${{ needs.prepare-matrix.outputs.manager_cert_size }}-${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}-${{
          'android17-6.18' }}-${{ fromJSON(needs.prepare-matrix.outputs.ddk_matrix).include[7].ddk_short }}${{ inputs.kernelsu_variant
          == 'BakaSU' && format('-kpm-{0}', hashFiles('tools/patches/bakasu-kpm.patch', 'config/bakasu-kpm-port.json')) ||
          '' }}
        lookup-only: false
        fail-on-cache-miss: false
      if: steps.manager-lkm-7.outputs.cache-hit != 'true' && steps.manager-lkm-7-retry-1.outputs.cache-hit != 'true'
    - name: 读取镜像修补模块 android17-6.18
      id: manager-lkm-7-ready
      shell: bash
      env:
        EXPECTED_CACHE_KEY: gki-sukisu-lkm-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare-matrix.outputs.ksu_ref
          }}-${{ needs.prepare-matrix.outputs.manager_package }}-${{ needs.prepare-matrix.outputs.manager_cert_size }}-${{
          needs.prepare-matrix.outputs.manager_cert_sha256 }}-${{ 'android17-6.18' }}-${{ fromJSON(needs.prepare-matrix.outputs.ddk_matrix).include[7].ddk_short
          }}${{ inputs.kernelsu_variant == 'BakaSU' && format('-kpm-{0}', hashFiles('tools/patches/bakasu-kpm.patch', 'config/bakasu-kpm-port.json'))
          || '' }}
        CACHE_HIT_0: ${{ steps.manager-lkm-7.outputs.cache-hit }}
        CACHE_KEY_0: ${{ steps.manager-lkm-7.outputs.cache-matched-key }}
        CACHE_HIT_1: ${{ steps.manager-lkm-7-retry-1.outputs.cache-hit }}
        CACHE_KEY_1: ${{ steps.manager-lkm-7-retry-1.outputs.cache-matched-key }}
        CACHE_HIT_2: ${{ steps.manager-lkm-7-retry-2.outputs.cache-hit }}
        CACHE_KEY_2: ${{ steps.manager-lkm-7-retry-2.outputs.cache-matched-key }}
      run: |
        python3 - <<'PY'
        import os
        expected = os.environ['EXPECTED_CACHE_KEY']
        matched = any(os.environ[f'CACHE_HIT_{index}'] == 'true'
                      and os.environ[f'CACHE_KEY_{index}'] == expected for index in range(3))
        if not expected or not matched:
            raise SystemExit('The exact verified manager LKM cache is still unavailable after three bounded attempts; no other source or signature cache was accepted.')
        print('The exact verified manager LKM cache is available.')
        PY
    - name: 按官方流程打包完整 LKM 模块
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        python3 tools/prepare_manager_lkm.py stage --source manager-source --artifacts manager-lkm \
          --identity "$RUNNER_TEMP/manager-public-certificate.json" --expected-ref "$KSU_REF" \
          --expected-kmis "android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12,android17-6.18" --report "$RUNNER_TEMP/manager-lkm-stage.json"
    - name: 配置 BakaSU 配套管理器签名提示
      if: inputs.kernelsu_variant == 'BakaSU'
      run: |
        set -euo pipefail
        python3 -m unittest discover -s tests -p 'test_bakasu_manager_notice.py'
        python3 tools/configure_bakasu_manager_notice.py --source "$GITHUB_WORKSPACE/manager-source" \
          --identity "$RUNNER_TEMP/manager-public-certificate.json"
    - name: 准备 Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: 恢复管理器 Gradle 依赖
      id: manager-gradle-cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      timeout-minutes: 3
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: gki-manager-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ hashFiles('manager-source/manager/**/*.gradle.kts',
          'manager-source/manager/**/gradle.properties', 'manager-source/manager/**/libs.versions.toml', 'manager-source/manager/gradle/wrapper/gradle-wrapper.properties')
          }}
        restore-keys: gki-manager-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-
    - name: 恢复管理器 Gradle 编译缓存
      id: manager-gradle-build-cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      timeout-minutes: 3
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gki-manager-gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-sdk37-ndk29-${{ hashFiles('manager-source/manager/gradle/wrapper/gradle-wrapper.properties',
          'manager-source/manager/gradle/libs.versions.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: gki-manager-gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-sdk37-ndk29-${{ hashFiles('manager-source/manager/gradle/wrapper/gradle-wrapper.properties',
          'manager-source/manager/gradle/libs.versions.toml') }}-
    - name: 准备 Android SDK 与 NDK
      run: |
        set -euo pipefail
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        python3 -c "print('y\n' * 100)" | "$sdkmanager" --licenses > /dev/null
        "$sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
        if [ "$KSU_VARIANT" = BakaSU ]; then
          "$sdkmanager" 'build-tools;36.1.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
        else
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
        fi
    - name: 准备 ARM64 Rust 工具链
      run: |
        set -euo pipefail
        toolchain=stable
        if [ "$KSU_VARIANT" = BakaSU ]; then toolchain=nightly; fi
        rustup toolchain install "$toolchain" --profile minimal
        rustup default "$toolchain"
        rustup target add aarch64-linux-android --toolchain "$toolchain"
    - name: 记录 Rust 编译器缓存版本
      id: manager-rust-version
      run: echo "version=$(rustc -vV | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
    - name: 恢复管理器 Cargo 依赖
      id: manager-cargo-cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      timeout-minutes: 3
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          manager-source/target/*/release/deps
          manager-source/target/*/release/build
          manager-source/target/*/release/.fingerprint
          manager-source/target/release/deps
          manager-source/target/release/build
          manager-source/target/release/.fingerprint
          !manager-source/target/**/release/deps/ksud-*
          !manager-source/target/**/release/deps/ksuinit-*
        key: gki-manager-cargo-${{ inputs.kernelsu_variant == 'BakaSU' && 'v2-bakasu' || 'v1' }}-${{ runner.os }}-${{ runner.arch
          }}-ndk29-${{ steps.manager-rust-version.outputs.version }}-${{ hashFiles('manager-source/**/Cargo.lock', 'manager-source/**/Cargo.toml',
          'manager-source/.github/scripts/setup-rust-build.sh', 'tools/build_sukisu_manager.sh', 'tools/build_bakasu_manager.sh')
          }}
        restore-keys: gki-manager-cargo-${{ inputs.kernelsu_variant == 'BakaSU' && 'v2-bakasu' || 'v1' }}-${{ runner.os }}-${{
          runner.arch }}-ndk29-${{ steps.manager-rust-version.outputs.version }}-
    - name: 编译管理器与同版本 ksud
      id: manager-build
      env:
        KSU_PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.manager_package }}
        ORG_GRADLE_PROJECT_KSU_PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.manager_package }}
        ORG_GRADLE_PROJECT_KSU_NAME: ${{ inputs.kernelsu_variant }}
      run: |
        set -euo pipefail
        case "$KSU_VARIANT" in
          SukiSU) script=tools/build_sukisu_manager.sh ;;
          BakaSU) script=tools/build_bakasu_manager.sh ;;
          *) echo 'Unknown manager variant' >&2; exit 1 ;;
        esac
        bash -n "$script"
        bash "$script" --source "$GITHUB_WORKSPACE/manager-source" --output "$RUNNER_TEMP/manager-build"
    - name: 实际验证八种 KMI 的镜像修补与恢复
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        python3 tools/verify_manager_boot_patch.py --source "$GITHUB_WORKSPACE/manager-source" \
          --module-report "$RUNNER_TEMP/manager-lkm-stage.json" --expected-ref "$KSU_REF" \
          --output "$RUNNER_TEMP/manager-boot-patch-check"
    - name: 签名并校验可安装 APK
      id: sign
      env:
        SUKISU_APK_KEYSTORE: ${{ secrets.SUKISU_APK_KEYSTORE }}
        SUKISU_APK_PASSWORD: ${{ secrets.SUKISU_APK_PASSWORD }}
        KSU_SHORT: ${{ needs.prepare-matrix.outputs.ksu_short }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
      run: |
        python3 tools/sign_sukisu_manager.py --unsigned "$RUNNER_TEMP/manager-build/manager-unsigned.apk" \
          --output-dir "$GITHUB_WORKSPACE/manager-artifact" \
          --build-metadata "$RUNNER_TEMP/manager-build/manager-build-metadata.json"
    - name: 记录管理器真实版本
      env:
        META_FILE: ${{ steps.sign.outputs.apk_filename }}
        META_PACKAGE: ${{ steps.sign.outputs.manager_package }}
        META_KSU_VERSION_CODE: ${{ steps.sign.outputs.manager_version_code }}
        META_KSU_VERSION_NAME: ${{ steps.sign.outputs.manager_version_name }}
        META_KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        META_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        META_MANAGER_CERT_SIZE: ${{ steps.sign.outputs.manager_cert_size }}
        META_MANAGER_CERT_SHA256: ${{ steps.sign.outputs.manager_cert_sha256 }}
        META_APK_SHA256: ${{ steps.sign.outputs.apk_sha256 }}
        META_ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      run: python3 tools/capture_manager_metadata.py --output manager-artifact/manager.json
    - name: 上传管理器安装包
      uses: actions/upload-artifact@v7
      with:
        path: manager-artifact/${{ steps.sign.outputs.apk_filename }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 保存管理器 Gradle 编译缓存
      uses: actions/cache/save@v5
      if: always() && !cancelled() && steps.manager-build.outcome == 'success' && steps.manager-gradle-build-cache.outputs.cache-primary-key
        != '' && steps.manager-gradle-build-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: ~/.gradle/caches/build-cache-1
        key: ${{ steps.manager-gradle-build-cache.outputs.cache-primary-key }}
    - name: 保存管理器 Gradle 依赖
      uses: actions/cache/save@v5
      if: always() && !cancelled() && steps.manager-build.outcome != 'skipped' && steps.manager-gradle-cache.outputs.cache-primary-key
        != '' && steps.manager-gradle-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: ${{ steps.manager-gradle-cache.outputs.cache-primary-key }}
    - name: 保存管理器 Cargo 依赖
      uses: actions/cache/save@v5
      if: always() && !cancelled() && steps.manager-build.outcome != 'skipped' && steps.manager-cargo-cache.outputs.cache-primary-key
        != '' && steps.manager-cargo-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      timeout-minutes: 3
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          manager-source/target/*/release/deps
          manager-source/target/*/release/build
          manager-source/target/*/release/.fingerprint
          manager-source/target/release/deps
          manager-source/target/release/build
          manager-source/target/release/.fingerprint
          !manager-source/target/**/release/deps/ksud-*
          !manager-source/target/**/release/deps/ksuinit-*
        key: ${{ steps.manager-cargo-cache.outputs.cache-primary-key }}
  build-oplus-kernel:
    name: ${{ startsWith(matrix.platform, 'mt') && '天玑' || '骁龙' }} · ${{ matrix.kernel }} · ${{ inputs.kernelsu_variant }}
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && needs.prepare-matrix.result == 'success' &&
      needs.build-sukisu-manager.result == 'success'
    needs:
    - prepare-matrix
    - build-sukisu-manager
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
      KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      SUSFS_SOURCES: ${{ needs.prepare-matrix.outputs.susfs_sources }}
      AK3_REF: ${{ needs.prepare-matrix.outputs.ak3_ref }}
      PATCHES_REF: ${{ needs.prepare-matrix.outputs.patches_ref }}
      CCACHE_DIR: ${{ github.workspace }}/.oplus-ccache
      CCACHE_MAXSIZE: 3G
    steps:
    - name: 检出独立构建工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 准备构建配置与 APK 签名验证依赖
      run: python3 -c 'import yaml, cryptography' || python3 -m pip install --break-system-packages --disable-pip-version-check
        PyYAML cryptography
    - name: 验证并保存当前官方源码与所选菜单输入
      env:
        OPLUS_PROFILE: ${{ toJSON(matrix) }}
        OPLUS_INPUTS: ${{ toJSON(inputs) }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from oplus_assets import profile_identity
        from oplus_catalog import strict_json
        from oplus_recipe import native_inputs
        profile = profile_identity(strict_json(os.environ['OPLUS_PROFILE'].encode()))
        inputs = strict_json(os.environ['OPLUS_INPUTS'].encode())
        native_inputs(inputs, profile)
        directory = pathlib.Path(os.environ['RUNNER_TEMP'])
        for name, value in [('oplus-profile.json',profile), ('oplus-inputs.json',inputs)]:
            (directory/name).write_text(json.dumps(value,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
        PY
    - name: 核实本次已签名 APK 与成功的管理器任务
      env:
        GH_TOKEN: ${{ github.token }}
        MANAGER_ARTIFACT: ${{ needs.build-sukisu-manager.outputs.apk_filename }}
        MANAGER_JOB_ID: ${{ needs.build-sukisu-manager.outputs.manager_job_id }}
      run: |
        python3 tools/wait_manager_identity.py --expected-ref "$KSU_REF" \
          --artifact-name "$MANAGER_ARTIFACT" --manager-job-id "$MANAGER_JOB_ID" --github-env "$GITHUB_ENV"
    - name: 还原本次固定源码缓存
      id: source-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
        fail-on-cache-miss: false
    - name: 从官方固定提交恢复并核实源码
      id: source-backup
      if: steps.source-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
        KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ true && inputs.enable_susfs || false }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER"
    - name: 重新缓存本次已验证的固定源码
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: steps.source-cache.outputs.cache-hit != 'true' && steps.source-backup.outcome == 'success'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
    - name: 核对固定源码与准备任务的完整身份
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
      run: |
        python3 tools/transfer_ksu_snapshot.py verify-cache \
          --source "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY"
    - name: 检出固定的 CCTV 构建方法参考
      uses: actions/checkout@v6
      with:
        repository: ${{ matrix.recipe_repository }}
        ref: ${{ matrix.recipe_ref }}
        path: oplus-reference
        fetch-depth: 1
        persist-credentials: false
    - name: 检出固定的官方 AnyKernel3 运行文件
      uses: actions/checkout@v6
      with:
        repository: osm0sis/AnyKernel3
        ref: ${{ needs.prepare-matrix.outputs.ak3_ref }}
        path: oplus-ak3
        fetch-depth: 1
        persist-credentials: false
    - name: 检出固定的 Unicode 修复补丁
      if: inputs.use_unicode_bypass
      uses: actions/checkout@v6
      with:
        repository: Xiaomichael/kernel_patches
        ref: ${{ needs.prepare-matrix.outputs.patches_ref }}
        path: oplus-patches
        fetch-depth: 1
        persist-credentials: false
    - name: 安装原生编译工具与系统开发依赖
      timeout-minutes: 15
      run: |
        set -euo pipefail
        apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 -o DPkg::Lock::Timeout=60)
        sudo apt-get "${apt_options[@]}" update -qq
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends aria2 bc bison flex make gcc g++ binutils \
          python-is-python3 libssl-dev libelf-dev libdw-dev zlib1g-dev ccache lz4 zstd xz-utils \
          zip unzip patch curl wget rsync
        mkdir -p "$CCACHE_DIR"
        ccache --max-size "$CCACHE_MAXSIZE"
        ccache --set-config=compression=true
        ccache --set-config=compiler_check=content
    - name: 安装固定 ECS 编译缓存工具
      run: |
        set -euo pipefail
        python3 tools/kernel_compile_cache.py install \
          --output "$RUNNER_TEMP/gki-ccache-ecs" \
          --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
    - name: 恢复本平台与内核的编译对象缓存
      id: oplus-ccache
      uses: actions/cache/restore@v5
      timeout-minutes: 2
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      with:
        path: ${{ env.CCACHE_DIR }}
        key: oplus-ccache-ecs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/kernel-cache-tools.json', 'tools/kernel_compile_cache.py')
          }}-${{ matrix.id }}-${{ inputs.kernelsu_variant }}-${{ matrix.recipe_ref }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: oplus-ccache-ecs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/kernel-cache-tools.json',
          'tools/kernel_compile_cache.py') }}-${{ matrix.id }}-${{ inputs.kernelsu_variant }}-${{ matrix.recipe_ref }}-
    - name: 获取官方固定源码及参考配方工具链
      run: |
        python3 tools/oplus_recipe.py --phase bootstrap --recipe-root "$GITHUB_WORKSPACE/oplus-reference" \
          --profile "$RUNNER_TEMP/oplus-profile.json" --inputs "$RUNNER_TEMP/oplus-inputs.json" \
          --workspace "$GITHUB_WORKSPACE"
    - name: 接入同次管理器源码及官方 SUSFS
      run: |
        python3 tools/oplus_kernel.py --phase integrate \
          --workspace "$GITHUB_WORKSPACE" --profile "$RUNNER_TEMP/oplus-profile.json" \
          --inputs "$RUNNER_TEMP/oplus-inputs.json" --snapshot "$GITHUB_WORKSPACE/ksu-source-bundle"
    - name: 按原生配方应用已选择的功能配置
      run: |
        python3 tools/oplus_recipe.py --phase configure --recipe-root "$GITHUB_WORKSPACE/oplus-reference" \
          --profile "$RUNNER_TEMP/oplus-profile.json" --inputs "$RUNNER_TEMP/oplus-inputs.json" \
          --workspace "$GITHUB_WORKSPACE"
    - name: 核实管理器证书、原生 Hook 与最终配置
      run: |
        python3 tools/oplus_kernel.py --phase finalize \
          --workspace "$GITHUB_WORKSPACE" --profile "$RUNNER_TEMP/oplus-profile.json" \
          --inputs "$RUNNER_TEMP/oplus-inputs.json" --patches "$GITHUB_WORKSPACE/oplus-patches"
    - name: 核实官方 KPM 工具和原始载荷
      if: inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
      run: |
        python3 tools/apply_kpm_patch.py prepare --cache-dir "$RUNNER_TEMP/oplus-kpm-official" \
          --github-env "$GITHUB_ENV" --ksu-source "$GITHUB_WORKSPACE/kernel_workspace/KernelSU"
    - name: 开始记录本次 ECS 缓存命中
      id: oplus-cache-measurement
      run: |
        set -euo pipefail
        ccache --zero-stats
        ccache --version
        echo 'started=true' >> "$GITHUB_OUTPUT"
    - name: 使用原生 Make 与对应 Clang/Rust 编译内核
      run: |
        python3 tools/oplus_recipe.py --phase build --recipe-root "$GITHUB_WORKSPACE/oplus-reference" \
          --profile "$RUNNER_TEMP/oplus-profile.json" --inputs "$RUNNER_TEMP/oplus-inputs.json" \
          --workspace "$GITHUB_WORKSPACE"
      id: oplus-build
    - name: 应用并验证独立 KPM 启动载荷
      if: inputs.use_kpm && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
      run: |
        python3 tools/apply_kpm_patch.py patch \
          --image "$GITHUB_WORKSPACE/kernel_workspace/common/out/arch/arm64/boot/Image" \
          --cache-dir "$KPM_CACHE_DIR" --report "$GITHUB_WORKSPACE/kernel_workspace/common/out/gki-kpm-patch.json"
    - name: 校验实际配置与证书并生成原生 AK3
      id: oplus-assets
      run: |
        python3 tools/oplus_assets.py package --profile "$RUNNER_TEMP/oplus-profile.json" \
          --kernel-root "$GITHUB_WORKSPACE/kernel_workspace" \
          --image "$GITHUB_WORKSPACE/kernel_workspace/common/out/arch/arm64/boot/Image" \
          --ak3-template "$GITHUB_WORKSPACE/oplus-ak3" --output "$GITHUB_WORKSPACE/oplus-ready"
    - name: 上传原文件同名 AK3
      uses: actions/upload-artifact@v7
      with:
        path: oplus-ready/${{ steps.oplus-assets.outputs.file }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 限制缓存容量并显示命中情况
      if: always() && !cancelled() && steps.oplus-cache-measurement.outputs.started == 'true'
      run: |
        set -euo pipefail
        ccache --max-size "$CCACHE_MAXSIZE"
        ccache --cleanup
        report="$RUNNER_TEMP/oplus-ccache-statistics.txt"
        ccache --show-stats --verbose | tee "$report"
        {
          echo '### 本次欧加真编译缓存'
          echo ''
          echo '以下数据只统计本次编译；更换工具链或配置后，受影响的缓存会重新生成。'
          echo ''
          echo '```text'
          cat "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: 保存已成功编译的平台缓存
      if: always() && !cancelled() && steps.oplus-build.outcome == 'success' && steps.oplus-ccache.outputs.cache-primary-key
        != ''
      uses: actions/cache/save@v5
      timeout-minutes: 2
      continue-on-error: true
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.oplus-ccache.outputs.cache-primary-key }}
  verify-oplus-assets:
    name: 整理原生文件与详细配置（全量成功才发行）
    if: always() && !cancelled() && needs.prepare-matrix.result == 'success' && needs.build-sukisu-manager.result == 'success'
      && needs.build-oplus-kernel.result == 'success'
    needs:
    - prepare-matrix
    - build-sukisu-manager
    - build-oplus-kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
    steps:
    - name: 检出本次原生校验工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 准备构建配置与 APK 签名验证依赖
      run: python3 -c 'import yaml, cryptography' || python3 -m pip install --break-system-packages --disable-pip-version-check
        PyYAML cryptography
    - name: 下载本次原文件 APK 与全部平台 AK3
      uses: actions/download-artifact@v8
      with:
        pattern: '{${{ needs.build-sukisu-manager.outputs.apk_filename }},Oplus-*-AnyKernel3.zip}'
        path: oplus-input
        merge-multiple: false
        skip-decompress: true
    - name: 逐件核对官方源、真实签名、完整矩阵与实际配置
      id: assets
      env:
        OPLUS_MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
      run: |
        set -euo pipefail
        python3 tools/oplus_assets.py collect --input oplus-input --output oplus-report \
          --matrix "$OPLUS_MATRIX" --variants "$KSU_VARIANT"
        python3 - <<'PY'
        import pathlib,shutil,sys
        sys.path.insert(0,'tools')
        from transfer_ksu_snapshot import native_assets
        source = pathlib.Path('oplus-input')
        output = pathlib.Path('oplus-publish/assets')
        output.mkdir(parents=True)
        for path in source.rglob('*'):
            if path.is_symlink():
                raise SystemExit('Refusing linked original assets')
            if path.is_file():
                shutil.copyfile(path, output/path.name)
        shutil.copyfile('oplus-report/SHA256SUMS.txt', output/'SHA256SUMS.txt')
        native_assets(output.resolve())
        PY
    - name: 上传原文件同名校验清单
      uses: actions/upload-artifact@v7
      with:
        path: oplus-report/SHA256SUMS.txt
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 分配递增发行标签并绑定本次构建
      id: release-tag
      if: success()
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      run: python3 tools/release_tags.py allocate --notes oplus-report/summary.md
    - name: 发布独立安装包和刷机包
      id: release
      if: success()
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        RELEASE_TAG: ${{ steps.release-tag.outputs.release_tag }}
        RELEASE_EXISTS: ${{ steps.release-tag.outputs.release_exists }}
      run: |
        set -euo pipefail
        title="$(cat oplus-report/title.txt)"
        if [ "$RELEASE_EXISTS" != true ]; then
        gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --draft --title "$title" --notes-file oplus-report/summary.md
        fi
        assets=(oplus-publish/assets/*)
        gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
        gh release edit "$RELEASE_TAG" --draft=false --latest --title "$title" \
          --notes-file oplus-report/summary.md --repo "$GITHUB_REPOSITORY"
        url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
        printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        printf 'release_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
        printf '直接下载 APK、AK3 及详细构建配置：[打开 Release](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
    - name: 核对原文件并清理发布中转包
      if: steps.release.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
      run: python3 tools/cleanup_build_artifacts.py --run-id "$GITHUB_RUN_ID" --release-tag "$RELEASE_TAG"
    - name: 显示统一的详细构建配置
      if: always() && !cancelled() && steps.assets.outcome == 'success'
      run: cat oplus-report/summary.md >> "$GITHUB_STEP_SUMMARY"
