# Generated by tools/generate_workflow.py; edit the generator to keep changes across updates.
# Locally maintained templates and official-source version catalog.
name: GKI 单管理器构建执行器
'on':
  workflow_call:
    inputs:
      operation:
        description: 操作
        required: true
        type: string
      kernel_versions:
        description: 内核系列（all 或逗号分隔：5.10,5.15,6.1,6.6,6.12）
        required: true
        type: string
      targets:
        description: 指定版本（同版本仅最新月份；留空全量；例 6.1.145，逗号分隔）
        required: false
        default: ''
        type: string
      include_lts:
        description: 包含 LTS（默认关闭）
        required: false
        default: false
        type: boolean
      artifact_mode:
        description: 产物模式
        required: true
        type: string
      max_parallel:
        description: 同时构建数量（1–20）
        required: true
        type: number
      kernelsu_variant:
        description: KernelSU 变体
        required: true
        type: string
      kernelsu_branch:
        description: 版本
        required: true
        type: string
      version:
        description: 自定义版本名 (可选)
        required: false
        default: ''
        type: string
      build_time:
        description: 构建时间（留空使用当前 UTC）
        required: false
        default: ''
        type: string
      kpm_password:
        description: 自定义 KPM 超级密码（留空=使用默认密码）
        required: false
        default: ''
        type: string
      enable_susfs:
        description: 启用 SUSFS
        required: false
        default: true
        type: boolean
      use_zram:
        description: 启用 ZRAM 增强算法（6.12 跳过 legacy LZ4K 栈）
        required: false
        default: true
        type: boolean
      zram_full_algo:
        description: 启用 ZRAM 完整算法支持（6.12 自动跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS）
        required: false
        default: true
        type: boolean
      zram_extra_algos:
        description: 自定义 ZRAM 算法（逗号分隔，如 lzo,lz4,deflate,zstd；6.12 会忽略 lz4k/lz4kd/lz4k_oplus）
        required: false
        default: ''
        type: string
      use_bbg:
        description: 启用 BBG 防格机
        required: false
        default: false
        type: boolean
      use_ddk:
        description: 启用 DDK 防格机 LSM
        required: false
        default: false
        type: boolean
      use_ntsync:
        description: 启用 NTsync
        required: false
        default: false
        type: boolean
      use_networking:
        description: 启用网络增强（IPSet + BBR）
        required: false
        default: false
        type: boolean
      use_kpm:
        description: 启用 KPM 功能
        required: false
        default: true
        type: boolean
      use_rekernel:
        description: 启用 Re-Kernel 驱动
        required: false
        default: true
        type: boolean
      supp_op:
        description: 启用一加 8E 支持
        required: false
        default: true
        type: boolean
      virtualization_support:
        description: '虚拟化支持 (5.10~6.6: 槽位补丁, 6.12: 开/关；on 在 5.10~6.6 自动使用 678)'
        required: false
        default: 'off'
        type: string
      custom_external_modules:
        description: 自定义外部模块（兼容旧 repo;stage，也支持 module:repo;stage 与 set:repo#child;stage，用 | 分隔）
        required: false
        default: ''
        type: string
      custom_kernel_options:
        description: 自定义内核选项（每行一条 Kconfig/defconfig 片段）
        required: false
        default: ''
        type: string
    outputs:
      matrix:
        value: ${{ jobs.prepare-matrix.outputs.matrix }}
      count:
        value: ${{ jobs.prepare-matrix.outputs.count }}
      full_catalog:
        value: ${{ jobs.prepare-matrix.outputs.full_catalog }}
      max_parallel:
        value: ${{ jobs.prepare-matrix.outputs.max_parallel }}
      source_cache_key:
        value: ${{ jobs.prepare-matrix.outputs.source_cache_key }}
      source_identity:
        value: ${{ jobs.prepare-matrix.outputs.source_identity }}
      susfs_sources:
        value: ${{ jobs.prepare-matrix.outputs.susfs_sources }}
      ddk_matrix:
        value: ${{ jobs.prepare-matrix.outputs.ddk_matrix }}
      manager_package:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_package }}
      manager_cert_size:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_cert_size }}
      manager_cert_sha256:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_cert_sha256 }}
      ksu_ref:
        value: ${{ jobs.prepare-matrix.outputs.ksu_ref }}
      ksu_repo:
        value: ${{ jobs.prepare-matrix.outputs.ksu_repo }}
      ksu_short:
        value: ${{ jobs.prepare-matrix.outputs.ksu_short }}
      ksu_source_branch:
        value: ${{ jobs.prepare-matrix.outputs.ksu_source_branch }}
      effective_ksu_branch:
        value: ${{ jobs.prepare-matrix.outputs.effective_ksu_branch }}
      manager_job_id:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_job_id }}
      apk_sha256:
        value: ${{ jobs.build-sukisu-manager.outputs.apk_sha256 }}
      manager_version_name:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_version_name }}
      manager_version_code:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_version_code }}
      apk_filename:
        value: ${{ jobs.build-sukisu-manager.outputs.apk_filename }}
      manager_metadata:
        value: ${{ jobs.build-sukisu-manager.outputs.manager_metadata }}
permissions:
  contents: read
jobs:
  prepare-matrix:
    name: 选择内核版本与补丁月份
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包')
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      full_catalog: ${{ steps.matrix.outputs.full_catalog }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      source_cache_key: ${{ steps.source-snapshot.outputs.source_cache_key }}
      source_identity: ${{ steps.source-identity.outputs.source_identity }}
      susfs_sources: ${{ steps.shared-susfs.outputs.susfs_sources }}
      ddk_matrix: ${{ steps.lkm-matrix.outputs.matrix }}
      manager_package: ${{ steps.certificate.outputs.package }}
      manager_cert_size: ${{ steps.certificate.outputs.cert_size }}
      manager_cert_sha256: ${{ steps.certificate.outputs.cert_sha256 }}
      ksu_ref: ${{ steps.sources.outputs.ksu_ref }}
      ksu_repo: ${{ steps.sources.outputs.ksu_repo }}
      ksu_short: ${{ steps.sources.outputs.ksu_short }}
      ksu_source_branch: ${{ steps.sources.outputs.ksu_source_branch }}
      effective_ksu_branch: ${{ steps.sources.outputs.effective_ksu_branch }}
    steps:
    - name: 检出 gki
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 检查管理器构建脚本
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      run: for script in tools/build_sukisu_manager.sh tools/build_bakasu_manager.sh; do bash -n "$script" || exit 1; done
    - name: 检查并生成矩阵
      id: matrix
      shell: bash
      if: github.event_name == 'workflow_dispatch' && inputs.operation == '编译内核'
      env:
        KERNEL_VERSIONS: ${{ inputs.kernel_versions }}
        TARGETS: ${{ inputs.targets }}
        INCLUDE_LTS: ${{ inputs.include_lts }}
        MAX_PARALLEL: ${{ inputs.max_parallel }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        value = float(os.environ['MAX_PARALLEL'])
        if not value.is_integer() or not 1 <= value <= 20:
            raise SystemExit('同时构建数量必须是 1–20 的整数')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f'max_parallel={int(value)}\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write(f'- 同时构建上限：{int(value)}（实际调度取决于 GitHub 账号额度与可用机器）\n')
        PY
        python3 tools/matrix.py --kernel-versions "$KERNEL_VERSIONS" --targets "$TARGETS" \
          --include-lts "$INCLUDE_LTS" --github-output --summary
    - name: 校验旧版内核 SUSFS 映射兼容性
      if: github.event_name == 'workflow_dispatch' && inputs.operation == '编译内核' && (inputs.enable_susfs && inputs.kernelsu_variant
        != 'KowSU')
      run: |
        set -euo pipefail
        command -v cc >/dev/null
        python3 -m unittest discover -s tests -p 'test_susfs_map_compat.py'
    - name: 验证共享源码还原及原生符号接口
      if: github.event_name == 'workflow_dispatch' && inputs.operation == '编译内核'
      run: |
        set -euo pipefail
        command -v cc >/dev/null
        python3 -m unittest discover -s tests -p 'test_shared_susfs_source.py'
        python3 -m unittest discover -s tests -p 'test_official_susfs_archive.py'
        python3 -m unittest discover -s tests -p 'test_shared_susfs_archive_integration.py'
        python3 -m unittest discover -s tests -p 'test_git_diagnostics.py'
        python3 -m unittest discover -s tests -p 'test_bakasu_symbol_lookup.py'
    - name: 验证 BakaSU KPM 原生接口与补丁
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && inputs.kernelsu_variant
        == 'BakaSU'
      run: |
        set -euo pipefail
        command -v cc >/dev/null
        python3 -m unittest discover -s tests -p 'test_bakasu_kpm_backend.py'
        python3 -m unittest discover -s tests -p 'test_bakasu_kpm_port.py'
    - name: 固定本次 KernelSU 与管理器源码
      id: sources
      env:
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        KSU_TIER: ${{ inputs.kernelsu_branch }}
        CUSTOM_REF: ${{ vars.KSU_CUSTOM_REF }}
        ENABLE_SUSFS: ${{ (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') }}
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/resolve_build_sources.py --variant "$KSU_VARIANT" --tier "$KSU_TIER" \
          --custom-ref "$CUSTOM_REF" --susfs "$ENABLE_SUSFS"
    - name: 读取固定签名的公开证书
      id: certificate
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && (inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
      env:
        SUKISU_APK_KEYSTORE: ${{ secrets.SUKISU_APK_KEYSTORE }}
        SUKISU_APK_PASSWORD: ${{ secrets.SUKISU_APK_PASSWORD }}
      run: python3 tools/export_manager_certificate.py --output "$RUNNER_TEMP/manager-public-certificate.json"
    - name: 选择官方镜像修补构建环境
      id: lkm-matrix
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      run: |
        python3 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from manager_lkm_jobs import load_ddk_matrix
        matrix = {'include':load_ddk_matrix(pathlib.Path.cwd())}
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
        PY
    - name: 仅下载一次官方管理器源码
      uses: actions/checkout@v6
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      with:
        repository: ${{ steps.sources.outputs.ksu_repo }}
        ref: ${{ steps.sources.outputs.ksu_ref }}
        path: ksu-snapshot-source
        fetch-depth: 0
        persist-credentials: false
    - name: 矩阵展开前统一下载并固定 SUSFS
      id: shared-susfs
      if: github.event_name == 'workflow_dispatch' && inputs.operation == '编译内核' && (inputs.enable_susfs && inputs.kernelsu_variant
        != 'KowSU')
      env:
        SUSFS_MATRIX: ${{ steps.matrix.outputs.matrix }}
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        KSU_TIER: ${{ steps.sources.outputs.effective_ksu_branch }}
      run: |
        python3 tools/shared_susfs_source.py prepare --source "$GITHUB_WORKSPACE/ksu-snapshot-source" \
          --matrix-json "$SUSFS_MATRIX" --expected-ref "$KSU_REF" --variant "$KSU_VARIANT" \
          --tier "$KSU_TIER" --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/susfs-sources.json"
    - name: 展开矩阵前验证并固定源码快照
      id: source-snapshot
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      env:
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        KSU_TIER: ${{ steps.sources.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ inputs.operation == '编译内核' && (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') || false
          }}
      run: |
        set -euo pipefail
        snapshot_args=()
        if [ "$ENABLE_SUSFS" = true ]; then
          snapshot_args+=(--susfs-sources "$RUNNER_TEMP/susfs-sources.json")
        fi
        python3 tools/snapshot_ksu_source.py --source "$GITHUB_WORKSPACE/ksu-snapshot-source" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER" "${snapshot_args[@]}"
        if [ "$KSU_VARIANT" = BakaSU ]; then
          python3 tools/checkout_ksu_snapshot.py --input "$GITHUB_WORKSPACE/ksu-source-bundle" \
            --output "$RUNNER_TEMP/bakasu-symbol-preflight" --expected-ref "$KSU_REF" --variant BakaSU
          python3 tools/ensure_bakasu_symbol_lookup.py --kernel-root "$RUNNER_TEMP/bakasu-symbol-preflight" \
            --ksu-dir kernel --expected-ref "$KSU_REF"
        fi
        python3 - <<'PY'
        import os,sys
        sys.path.insert(0,'tools')
        from snapshot_ksu_source import expected_commit
        reference = expected_commit(os.environ['KSU_REF'])
        key = '-'.join(('gki-source-v1', os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH'],
                        os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], reference))
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('source_cache_key='+key+'\n')
        PY
    - name: 固定源码树和管理器版本身份
      id: source-identity
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      env:
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from checkout_ksu_snapshot import read_manifest
        from transfer_ksu_snapshot import prepared_identity
        manifest = read_manifest(pathlib.Path('ksu-source-bundle'),os.environ['KSU_REF'],variant=os.environ['KSU_VARIANT'])
        document = {key:manifest[key] for key in ('ref','git_tree','git_count','git_describe')}
        if 'susfs_sources' in manifest:
            document['susfs_sources'] = manifest['susfs_sources']
        identity = prepared_identity(document,os.environ['KSU_REF'])
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('source_identity='+json.dumps(identity,separators=(',',':'))+'\n')
        PY
    - name: 保存本次不可变源码缓存
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      with:
        path: ksu-source-bundle
        key: ${{ steps.source-snapshot.outputs.source_cache_key }}
    - name: 确认所有构建可读取本次源码缓存
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && ((inputs.kernelsu_variant
        == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU') || (inputs.kernelsu_variant == 'KernelSU-Next' || inputs.kernelsu_variant
        == 'KernelSU' || inputs.kernelsu_variant == 'KowSU' || inputs.kernelsu_variant == 'FinaSU'))
      with:
        path: ksu-source-bundle
        key: ${{ steps.source-snapshot.outputs.source_cache_key }}
        lookup-only: true
        fail-on-cache-miss: false
    - name: 自动删除已成功的清理记录
      if: always() && !cancelled()
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/remove_successful_cleanup_runs.py --repo "$GITHUB_REPOSITORY" --execute
  build-sukisu-lkm:
    name: ${{ inputs.kernelsu_variant }} 原生模块 / ${{ matrix.kmi }}
    needs: prepare-matrix
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == '编译内核' || inputs.operation == '仅编译管理器安装包') && (inputs.kernelsu_variant
      == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.ddk_matrix) }}
    steps:
    - name: 检出构建工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 还原本次固定源码缓存
      id: source-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
        fail-on-cache-miss: false
    - name: 从官方固定提交恢复并核实源码
      id: source-backup
      if: steps.source-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
        KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ inputs.operation == '编译内核' && (inputs.enable_susfs && inputs.kernelsu_variant != 'KowSU') || false
          }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER"
    - name: 重新缓存本次已验证的固定源码
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: steps.source-cache.outputs.cache-hit != 'true' && steps.source-backup.outcome == 'success'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
    - name: 核对固定源码与准备任务的完整身份
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
      run: |
        python3 tools/transfer_ksu_snapshot.py verify-cache \
          --source "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY"
    - name: 还原并核实管理器源码
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE/manager-source"
        python3 tools/checkout_ksu_snapshot.py --input ksu-source-bundle   --output manager-source --expected-ref "$KSU_REF"
    - name: 核实管理器公开签名身份
      env:
        KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        MANAGER_PACKAGE: ${{ needs.prepare-matrix.outputs.manager_package }}
        MANAGER_CERT_SIZE: ${{ needs.prepare-matrix.outputs.manager_cert_size }}
        MANAGER_CERT_SHA256: ${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import sys
        sys.path.insert(0, 'tools')
