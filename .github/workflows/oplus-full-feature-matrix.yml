name: 欧加真全属性内核构建矩阵
run-name: 欧加真进程退出测试修复验证
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Linux 预检与进程退出竞争复验
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KSU_VARIANT: KernelSU-Next
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 恢复待合入的正式工作流用于可复现检查
      run: git show 6e2deaa64db4ae75ae6b3a337553986e76d6d2f5:.github/workflows/oplus-full-feature-matrix.yml
        > .github/workflows/oplus-full-feature-matrix.yml
    - name: 运行原始欧加真预检
      run: 'set -euo pipefail

        command -v cc >/dev/null

        python3 -m unittest discover -s tests -p ''test_oplus_*.py''

        python3 -m unittest discover -s tests -p ''test_susfs_map_compat.py''

        python3 -m unittest discover -s tests -p ''test_susfs_headers.py''

        python3 -m unittest discover -s tests -p ''test_official_init_compat.py''

        python3 -m unittest discover -s tests -p ''test_kow_selinux_view.py'''
    - name: 反复验证实际终止及读取竞态
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport sys\nimport unittest\n\
        from unittest import mock\nsys.path.insert(0, 'tests')\nfrom test_oplus_recipe\
        \ import OPlusGitTransportTests\n\nname = 'test_real_linux_timeout_stops_a_descendant_that_ignores_sigterm'\n\
        for _ in range(4):\n    result = unittest.TextTestRunner().run(unittest.TestSuite([OPlusGitTransportTests(name)]))\n\
        \    if not result.wasSuccessful() or result.skipped:\n        raise SystemExit('Real\
        \ Linux process termination regression failed or skipped')\nread = Path.read_text\n\
        for error in (FileNotFoundError, ProcessLookupError):\n    def disappeared(path,\
        \ *args, **kwargs):\n        if path.parent.parent == Path('/proc') and path.name\
        \ == 'stat':\n            raise error('Reproduce process exit between lookup\
        \ and read')\n        return read(path, *args, **kwargs)\n    with mock.patch.object(Path,\
        \ 'read_text', autospec=True, side_effect=disappeared):\n        result =\
        \ unittest.TextTestRunner().run(unittest.TestSuite([OPlusGitTransportTests(name)]))\n\
        \    if not result.wasSuccessful() or result.skipped:\n        raise SystemExit('Deterministic\
        \ disappeared-process regression failed or skipped')\nprint('Four real and\
        \ two forced disappeared-process checks passed')\nPY\n"
