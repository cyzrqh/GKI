        set -euo pipefail
        python3 tools/oplus_assets.py collect --input oplus-input --output oplus-report \
          --matrix "$OPLUS_MATRIX" --variants "$KSU_VARIANT"
        python3 - <<'PY'
        import pathlib,shutil,sys
        sys.path.insert(0,'tools')
        from transfer_ksu_snapshot import native_assets
        source = pathlib.Path('oplus-input')
        output = pathlib.Path('oplus-publish/assets')
        output.mkdir(parents=True)
        for path in source.rglob('*'):
            if path.is_symlink():
                raise SystemExit('Refusing linked original assets')
            if path.is_file():
                shutil.copyfile(path, output/path.name)
        shutil.copyfile('oplus-report/SHA256SUMS.txt', output/'SHA256SUMS.txt')
        native_assets(output.resolve())
        PY
    - name: 分配递增发行标签并绑定本次构建
      id: release-tag
      if: success() && needs.combo-next.outputs.full_catalog == 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      run: python3 tools/release_tags.py allocate --notes oplus-report/summary.md
    - name: 发布独立安装包和刷机包
      id: release
      if: success() && needs.combo-next.outputs.full_catalog == 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        RELEASE_TAG: ${{ steps.release-tag.outputs.release_tag }}
        RELEASE_EXISTS: ${{ steps.release-tag.outputs.release_exists }}
      run: |
        set -euo pipefail
        title="$(cat oplus-report/title.txt)"
        if [ "$RELEASE_EXISTS" != true ]; then
        gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --draft --title "$title" --notes-file oplus-report/summary.md
        fi
        assets=(oplus-publish/assets/*)
        gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
        gh release edit "$RELEASE_TAG" --draft=false --latest --title "$title" \
          --notes-file oplus-report/summary.md --repo "$GITHUB_REPOSITORY"
        url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
        printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        printf 'release_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
        printf '直接下载 APK、AK3 及详细构建配置：[打开 Release](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
    - name: 核对原文件并清理发布中转包
      if: steps.release.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
      run: python3 tools/cleanup_build_artifacts.py --run-id "$GITHUB_RUN_ID" --release-tag "$RELEASE_TAG"
    - name: 显示统一的详细构建配置
      if: always() && !cancelled() && steps.assets.outcome == 'success'
      run: cat oplus-report/summary.md >> "$GITHUB_STEP_SUMMARY"
    - name: 汇总该管理器已验证文件的校验值
      id: combined-checksums
      env:
        CHECKSUM_FILE: oplus-report/SHA256SUMS.txt
      run: |
        python3 - <<'PY'
        import json,os,pathlib
        lines=pathlib.Path(os.environ['CHECKSUM_FILE']).read_text(encoding='utf-8').splitlines()
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('checksums='+json.dumps(lines,separators=(',',':'))+'\n')
        PY
    outputs:
      checksums: ${{ steps.combined-checksums.outputs.checksums }}
  combined-checksums:
    name: 生成三管理器统一校验清单
    needs:
    - publish-combo-sukisu
    - publish-combo-bakasu
    - publish-combo-next
    if: always() && !cancelled() && needs.publish-combo-sukisu.result == 'success' && needs.publish-combo-bakasu.result ==
      'success' && needs.publish-combo-next.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: 生成同名校验文件
      env:
        CHECKSUMS_0: ${{ needs.publish-combo-sukisu.outputs.checksums }}
        CHECKSUMS_1: ${{ needs.publish-combo-bakasu.outputs.checksums }}
        CHECKSUMS_2: ${{ needs.publish-combo-next.outputs.checksums }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib,re
        rows={}
        for i in range(3):
            lines=json.loads(os.environ['CHECKSUMS_'+str(i)])
            if not isinstance(lines,list) or not lines: raise SystemExit('Missing verified checksums')
            for line in lines:
                match=re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9_.+-]+)',line)
                if not match or match[2] in rows: raise SystemExit('Invalid or duplicate combined filename')
                rows[match[2]]=match[1]
        key=lambda n:[int(p) if p.isdigit() else p for p in re.split(r'(\d+)',n)]
        pathlib.Path('SHA256SUMS.txt').write_text(''.join(rows[n]+'  '+n+'\n' for n in sorted(rows,key=key)),encoding='utf-8')
        PY
    - name: 上传原文件校验清单
      uses: actions/upload-artifact@v7
      with:
        path: SHA256SUMS.txt
        archive: false
        if-no-files-found: error
        overwrite: true
