      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: manager-apk-cache
        key: ${{ format('{0}-{1}-{2}', needs.prebuild-manager-sources.outputs[format('{0}_apk_cache_key', matrix.slot)], github.run_id,
          github.run_attempt) }}
        lookup-only: true
        fail-on-cache-miss: false
      if: (needs.prebuild-manager-sources.outputs[format('{0}_manager_adoption', matrix.slot)] == '')
    - name: 确认原始 APK 可供后续构建复用（等待后重试 1）
      if: (needs.prebuild-manager-sources.outputs[format('{0}_manager_adoption', matrix.slot)] == '') && steps.prebuilt-apk-published.outputs.cache-hit
        != 'true'
      shell: bash
      run: sleep 10
    - name: 确认原始 APK 可供后续构建复用（第 2 次）
      id: prebuilt-apk-published-retry-1
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: manager-apk-cache
        key: ${{ format('{0}-{1}-{2}', needs.prebuild-manager-sources.outputs[format('{0}_apk_cache_key', matrix.slot)], github.run_id,
          github.run_attempt) }}
        lookup-only: true
        fail-on-cache-miss: false
      if: (needs.prebuild-manager-sources.outputs[format('{0}_manager_adoption', matrix.slot)] == '') && steps.prebuilt-apk-published.outputs.cache-hit
        != 'true'
    - name: 确认原始 APK 可供后续构建复用（等待后重试 2）
      if: (needs.prebuild-manager-sources.outputs[format('{0}_manager_adoption', matrix.slot)] == '') && steps.prebuilt-apk-published.outputs.cache-hit
        != 'true' && steps.prebuilt-apk-published-retry-1.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 20
    - name: 确认原始 APK 可供后续构建复用（第 3 次）
      id: prebuilt-apk-published-retry-2
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: manager-apk-cache
        key: ${{ format('{0}-{1}-{2}', needs.prebuild-manager-sources.outputs[format('{0}_apk_cache_key', matrix.slot)], github.run_id,
          github.run_attempt) }}
        lookup-only: true
        fail-on-cache-miss: false
      if: (needs.prebuild-manager-sources.outputs[format('{0}_manager_adoption', matrix.slot)] == '') && steps.prebuilt-apk-published.outputs.cache-hit
        != 'true' && steps.prebuilt-apk-published-retry-1.outputs.cache-hit != 'true'
    - name: 确认原始 APK 可供后续构建复用
      id: prebuilt-apk-published-ready
      shell: bash
      env:
        EXPECTED_CACHE_KEY: ${{ format('{0}-{1}-{2}', needs.prebuild-manager-sources.outputs[format('{0}_apk_cache_key', matrix.slot)],
          github.run_id, github.run_attempt) }}
        CACHE_HIT_0: ${{ steps.prebuilt-apk-published.outputs.cache-hit }}
        CACHE_KEY_0: ${{ steps.prebuilt-apk-published.outputs.cache-matched-key }}
        CACHE_HIT_1: ${{ steps.prebuilt-apk-published-retry-1.outputs.cache-hit }}
        CACHE_KEY_1: ${{ steps.prebuilt-apk-published-retry-1.outputs.cache-matched-key }}
        CACHE_HIT_2: ${{ steps.prebuilt-apk-published-retry-2.outputs.cache-hit }}
        CACHE_KEY_2: ${{ steps.prebuilt-apk-published-retry-2.outputs.cache-matched-key }}
      run: |
        python3 - <<'PY'
        import os
        expected = os.environ['EXPECTED_CACHE_KEY']
        matched = any(os.environ[f'CACHE_HIT_{index}'] == 'true'
                      and os.environ[f'CACHE_KEY_{index}'] == expected for index in range(3))
        if not expected or not matched:
            raise SystemExit('The exact verified manager LKM cache is still unavailable after three bounded attempts; no other source or signature cache was accepted.')
        print('The exact verified manager LKM cache is available.')
        PY
      if: needs.prebuild-manager-sources.outputs[format('{0}_manager_adoption', matrix.slot)] == ''
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.check-upstream.outputs.manager_prebuild_matrix) }}
  record-manager-prebuild:
    name: 记录已验证的官方版本状态
    needs:
    - check-upstream
    - prebuild-manager-apks
    if: always() && !cancelled() && (needs.prebuild-manager-apks.result == 'success' || (needs.prebuild-manager-apks.result
      == 'skipped' && needs.check-upstream.outputs.manager_prebuild_pending == 'false' && needs.check-upstream.outputs.manager_prebuild_state_changed
      == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
    - name: 检出验证工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 验证已完成的官方版本
      env:
        STATE_JSON: ${{ needs.check-upstream.outputs.manager_prebuild_state }}
      run: python3 tools/manager_prebuild.py record --state-json "$STATE_JSON" --output "$RUNNER_TEMP/gki-manager-apk-observations.json"
    - name: 保存成功版本记录
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/gki-manager-apk-observations.json
        key: gki-manager-apk-observations-v3-${{ github.run_id }}-${{ github.run_attempt }}
