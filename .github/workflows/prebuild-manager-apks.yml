# Generated by tools/generate_workflow.py; edit the generator to keep changes across updates.
# Locally maintained templates and official-source version catalog.
name: 预编译官方管理器 APK
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  discover:
    name: 确定六种管理器的正式版与最新版
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      pending: ${{ steps.sources.outputs.pending }}
      state: ${{ steps.sources.outputs.state }}
      state_changed: ${{ steps.sources.outputs.state_changed }}
    steps:
    - name: 检出验证工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 选出可构建的官方提交
      id: sources
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/manager_prebuild.py discover
  prebuild-managers:
    name: ${{ matrix.variant }} · ${{ matrix.channels }} APK
    if: always() && !cancelled() && needs.discover.outputs.pending == 'true'
    needs:
    - discover
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_manager-apk-worker.yml
    with:
      variant: ${{ matrix.variant }}
      tier: ${{ matrix.tier }}
      reference: ${{ matrix.reference }}
      source_branch: ${{ matrix.source_branch }}
    secrets: inherit
  record-manager-prebuild:
    name: 记录已验证的官方版本状态
    needs:
    - discover
    - prebuild-managers
    if: always() && !cancelled() && (needs.prebuild-managers.result == 'success' || (needs.prebuild-managers.result == 'skipped'
      && needs.discover.outputs.pending == 'false' && needs.discover.outputs.state_changed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
    - name: 检出验证工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 验证已完成的官方版本
      env:
        STATE_JSON: ${{ needs.discover.outputs.state }}
      run: python3 tools/manager_prebuild.py record --state-json "$STATE_JSON" --output "$RUNNER_TEMP/gki-manager-apk-observations.json"
    - name: 保存成功版本记录
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/gki-manager-apk-observations.json
        key: gki-manager-apk-observations-v2-${{ github.run_id }}-${{ github.run_attempt }}
