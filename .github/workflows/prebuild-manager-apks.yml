        KSU_TIER: ${{ needs.prebuild-manager-sources.outputs[format('{0}_effective_ksu_branch', matrix.slot)] }}
        ENABLE_SUSFS: ${{ '仅编译管理器安装包' == '编译内核' && false || false }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
