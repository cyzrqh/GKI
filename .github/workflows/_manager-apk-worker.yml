# Generated by tools/generate_workflow.py; edit the generator to keep changes across updates.
# Locally maintained templates and official-source version catalog.
name: 配套管理器 APK 构建
'on':
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      tier:
        type: string
        required: true
      reference:
        type: string
        required: true
      source_branch:
        type: string
        required: true
permissions:
  contents: read
  actions: write
jobs:
  prepare-matrix:
    name: 固定官方管理器源码与签名
    runs-on: ubuntu-24.04
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.tier == 'Stable(标准)' ||
      inputs.tier == 'Latest(最新)')
    env:
      KSU_VARIANT: ${{ inputs.variant }}
    permissions:
      contents: read
      actions: write
    outputs:
      source_cache_key: ${{ steps.source-snapshot.outputs.source_cache_key }}
      source_identity: ${{ steps.source-identity.outputs.source_identity }}
      native_source_version: ${{ steps.source-identity.outputs.native_source_version }}
      ddk_matrix: ${{ steps.lkm-matrix.outputs.matrix }}
      manager_package: ${{ steps.certificate.outputs.package }}
      manager_cert_size: ${{ steps.certificate.outputs.cert_size }}
      manager_cert_sha256: ${{ steps.certificate.outputs.cert_sha256 }}
      ksu_ref: ${{ steps.sources.outputs.ksu_ref }}
      ksu_repo: ${{ steps.sources.outputs.ksu_repo }}
      ksu_short: ${{ steps.sources.outputs.ksu_short }}
      ksu_source_branch: ${{ steps.sources.outputs.ksu_source_branch }}
      effective_ksu_branch: ${{ steps.sources.outputs.effective_ksu_branch }}
      apk_cache_key: ${{ steps.apk-cache-key.outputs.apk_cache_key }}
      manager_recipe_sha256: ${{ steps.apk-cache-key.outputs.manager_recipe_sha256 }}
      manager_adoption: ${{ steps.adopt-apk.outputs.manager_adoption }}
      reused_manager_package: ${{ steps.adopt-apk.outputs.manager_package }}
      reused_manager_cert_size: ${{ steps.adopt-apk.outputs.manager_cert_size }}
      reused_manager_cert_sha256: ${{ steps.adopt-apk.outputs.manager_cert_sha256 }}
      reused_apk_sha256: ${{ steps.adopt-apk.outputs.apk_sha256 }}
      reused_manager_version_name: ${{ steps.adopt-apk.outputs.manager_version_name }}
      reused_manager_version_code: ${{ steps.adopt-apk.outputs.manager_version_code }}
      reused_apk_filename: ${{ steps.adopt-apk.outputs.apk_filename }}
    steps:
    - name: 检出 gki
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 验证管理器原生生命周期及真实 C 状态行为
      run: python3 -m unittest discover -s tests -p 'test_manager_port_native.py'
    - name: 检查管理器构建脚本
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      run: for script in tools/build_sukisu_manager.sh tools/build_bakasu_manager.sh; do bash -n "$script" || exit 1; done
    - name: 验证 BakaSU KPM 原生接口与补丁
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && inputs.variant == 'BakaSU'
      run: |
        set -euo pipefail
        command -v cc >/dev/null
        python3 -m unittest discover -s tests -p 'test_bakasu_kpm_backend.py'
        python3 -m unittest discover -s tests -p 'test_bakasu_kpm_port.py'
    - name: 固定本次 KernelSU 与管理器源码
      id: sources
      env:
        KSU_VARIANT: ${{ inputs.variant }}
        KSU_TIER: ${{ inputs.tier }}
        CUSTOM_REF: ${{ vars.KSU_CUSTOM_REF }}
        ENABLE_SUSFS: ${{ false }}
        GH_TOKEN: ${{ github.token }}
        EXPECTED_REF: ${{ inputs.reference }}
        EXPECTED_SOURCE_BRANCH: ${{ inputs.source_branch }}
      run: |
        set -euo pipefail
        python3 tools/resolve_build_sources.py --variant "$KSU_VARIANT" --tier "$KSU_TIER" --susfs false
        python3 - <<'PY'
        import os
        from pathlib import Path

        values = dict(line.split('=', 1) for line in Path(os.environ['GITHUB_OUTPUT']).read_text().splitlines() if '=' in line)
        if (values.get('ksu_ref') != os.environ['EXPECTED_REF']
                or values.get('ksu_source_branch') != os.environ['EXPECTED_SOURCE_BRANCH']):
            raise SystemExit('官方管理器版本在排队期间已变化，请重新检查后构建。')
        PY
    - name: 读取固定签名的公开证书
      id: certificate
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      env:
        SUKISU_APK_KEYSTORE: ${{ secrets.SUKISU_APK_KEYSTORE }}
        SUKISU_APK_PASSWORD: ${{ secrets.SUKISU_APK_PASSWORD }}
      run: python3 tools/export_manager_certificate.py --output "$RUNNER_TEMP/manager-public-certificate.json"
    - name: 选择官方镜像修补构建环境
      id: lkm-matrix
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      run: |
        python3 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from manager_lkm_jobs import load_ddk_matrix
        matrix = {'include':load_ddk_matrix(pathlib.Path.cwd())}
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
        PY
    - name: 仅下载一次官方管理器源码
      uses: actions/checkout@v6
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      with:
        repository: ${{ steps.sources.outputs.ksu_repo }}
        ref: ${{ steps.sources.outputs.ksu_ref }}
        path: ksu-snapshot-source
        fetch-depth: 0
        persist-credentials: false
    - name: 展开矩阵前验证并固定源码快照
      id: source-snapshot
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      env:
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        KSU_TIER: ${{ steps.sources.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ '仅编译管理器安装包' == '编译内核' && false || false }}
      run: |
        set -euo pipefail
        snapshot_args=()
        if [ "$ENABLE_SUSFS" = true ]; then
          snapshot_args+=(--susfs-sources "$RUNNER_TEMP/susfs-sources.json")
        fi
        python3 tools/snapshot_ksu_source.py --source "$GITHUB_WORKSPACE/ksu-snapshot-source" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER" "${snapshot_args[@]}"
        if [ "$KSU_VARIANT" = BakaSU ]; then
          python3 tools/checkout_ksu_snapshot.py --input "$GITHUB_WORKSPACE/ksu-source-bundle" \
            --output "$RUNNER_TEMP/bakasu-symbol-preflight" --expected-ref "$KSU_REF" --variant BakaSU
          python3 tools/ensure_bakasu_symbol_lookup.py --kernel-root "$RUNNER_TEMP/bakasu-symbol-preflight" \
            --ksu-dir kernel --expected-ref "$KSU_REF"
        fi
        python3 - <<'PY'
        import os,sys
        sys.path.insert(0,'tools')
        from snapshot_ksu_source import expected_commit
        reference = expected_commit(os.environ['KSU_REF'])
        key = '-'.join(('gki-source-v1', os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH'],
                        os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], reference))
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('source_cache_key='+key+'\n')
        PY
    - name: 固定源码树和管理器版本身份
      id: source-identity
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      env:
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from checkout_ksu_snapshot import read_manifest
        from transfer_ksu_snapshot import prepared_identity
        manifest = read_manifest(pathlib.Path('ksu-source-bundle'),os.environ['KSU_REF'],variant=os.environ['KSU_VARIANT'])
        document = {key:manifest[key] for key in ('ref','git_tree','git_count','git_describe')}
        native_version = hashlib.sha256(json.dumps(document,sort_keys=True,separators=(',',':')).encode()).hexdigest()[:24]
        if 'susfs_sources' in manifest:
            document['susfs_sources'] = manifest['susfs_sources']
        identity = prepared_identity(document,os.environ['KSU_REF'])
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('source_identity='+json.dumps(identity,separators=(',',':'))+'\n')
            output.write('native_source_version='+native_version+'\n')
        PY
    - name: 确定配套 APK 的复用条件
      id: apk-cache-key
      if: ((inputs.variant == 'SukiSU' || inputs.variant == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant
        == 'KernelSU' || inputs.variant == 'KowSU' || inputs.variant == 'FinaSU')) && (steps.sources.outputs.effective_ksu_branch
        == 'Stable(标准)' || steps.sources.outputs.effective_ksu_branch == 'Latest(最新)')
      env:
        KSU_BRANCH: ${{ steps.sources.outputs.effective_ksu_branch }}
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        MANAGER_CERT_SIZE: ${{ steps.certificate.outputs.cert_size }}
        MANAGER_CERT_SHA256: ${{ steps.certificate.outputs.cert_sha256 }}
        MANAGER_SOURCE_IDENTITY: ${{ steps.source-identity.outputs.source_identity }}
      run: |-
        python3 tools/reusable_manager_apk.py key --variant "$KSU_VARIANT" --channel "$KSU_BRANCH" --ksu-ref "$KSU_REF" \
          --cert-size "$MANAGER_CERT_SIZE" --cert-sha256 "$MANAGER_CERT_SHA256" \
          --source-identity "$MANAGER_SOURCE_IDENTITY"
    - name: 读取相同源码和签名的已编译 APK
      id: apk-cache
      uses: actions/cache/restore@v5
      if: steps.apk-cache-key.outputs.apk_cache_key != ''
      timeout-minutes: 2
      continue-on-error: true
      with:
        path: manager-apk-cache
        key: ${{ format('{0}-{1}-{2}', steps.apk-cache-key.outputs.apk_cache_key, github.run_id, github.run_attempt) }}
        restore-keys: ${{ format('{0}-', steps.apk-cache-key.outputs.apk_cache_key) }}
    - name: 核验已编译 APK 并保留原始编译记录
      id: adopt-apk
      if: steps.apk-cache.outputs.cache-matched-key != ''
      env:
        KSU_BRANCH: ${{ steps.sources.outputs.effective_ksu_branch }}
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        MANAGER_CERT_SIZE: ${{ steps.certificate.outputs.cert_size }}
        MANAGER_CERT_SHA256: ${{ steps.certificate.outputs.cert_sha256 }}
        MANAGER_SOURCE_IDENTITY: ${{ steps.source-identity.outputs.source_identity }}
      run: |-
        python3 -c 'import cryptography' || python3 -m pip install --break-system-packages --disable-pip-version-check cryptography
        python3 tools/reusable_manager_apk.py stage --variant "$KSU_VARIANT" --channel "$KSU_BRANCH" --ksu-ref "$KSU_REF" \
          --cert-size "$MANAGER_CERT_SIZE" --cert-sha256 "$MANAGER_CERT_SHA256" \
          --source-identity "$MANAGER_SOURCE_IDENTITY" --cache-dir manager-apk-cache --output-dir manager-artifact
    - name: 上传原始配套 APK
      uses: actions/upload-artifact@v7
      if: steps.adopt-apk.outputs.manager_apk_reused == 'true'
      with:
        path: manager-artifact/${{ steps.adopt-apk.outputs.apk_filename }}
        archive: false
        if-no-files-found: error
        overwrite: true
    - name: 保存本次不可变源码缓存
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      with:
        path: ksu-source-bundle
        key: ${{ steps.source-snapshot.outputs.source_cache_key }}
    - name: 确认所有构建可读取本次源码缓存
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      if: true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant
        == 'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' ||
        inputs.variant == 'FinaSU'))
      with:
        path: ksu-source-bundle
        key: ${{ steps.source-snapshot.outputs.source_cache_key }}
        lookup-only: true
        fail-on-cache-miss: false
  build-sukisu-lkm:
    name: ${{ inputs.variant }} 原生模块 / ${{ matrix.kmi }}
    needs: prepare-matrix
    if: (true && ('仅编译管理器安装包' == '编译内核' || '仅编译管理器安装包' == '仅编译管理器安装包') && ((inputs.variant == 'SukiSU' || inputs.variant ==
      'BakaSU') || (inputs.variant == 'KernelSU-Next' || inputs.variant == 'KernelSU' || inputs.variant == 'KowSU' || inputs.variant
      == 'FinaSU'))) && needs.prepare-matrix.outputs.manager_adoption == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KSU_VARIANT: ${{ inputs.variant }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    concurrency:
      group: native-manager-lkm-${{ github.ref }}-${{ inputs.variant }}-${{ needs.prepare-matrix.outputs.native_source_version
        }}-${{ matrix.kmi }}-${{ matrix.ddk_short }}-${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}-${{ needs.prepare-matrix.outputs.manager_recipe_sha256
        }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.ddk_matrix) }}
    steps:
    - name: 检出构建工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
      if: needs.prepare-matrix.outputs.manager_adoption == ''
    - name: 还原本次固定源码缓存
      id: source-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
        fail-on-cache-miss: false
      if: needs.prepare-matrix.outputs.manager_adoption == ''
    - name: 从官方固定提交恢复并核实源码
      id: source-backup
      if: (steps.source-cache.outputs.cache-hit != 'true') && needs.prepare-matrix.outputs.manager_adoption == ''
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_VARIANT: ${{ inputs.variant }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
        KSU_TIER: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ '仅编译管理器安装包' == '编译内核' && false || false }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER"
    - name: 重新缓存本次已验证的固定源码
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: (steps.source-cache.outputs.cache-hit != 'true' && steps.source-backup.outcome == 'success') && needs.prepare-matrix.outputs.manager_adoption
        == ''
      with:
        path: ksu-source-bundle
        key: ${{ needs.prepare-matrix.outputs.source_cache_key }}
    - name: 核对固定源码与准备任务的完整身份
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        PREPARED_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
      run: |
        python3 tools/transfer_ksu_snapshot.py verify-cache \
          --source "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY"
      if: needs.prepare-matrix.outputs.manager_adoption == ''
    - name: 还原并核实管理器源码
      env:
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
        KSU_VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE/manager-source"
        python3 tools/checkout_ksu_snapshot.py --input ksu-source-bundle   --output manager-source --expected-ref "$KSU_REF"
      if: needs.prepare-matrix.outputs.manager_adoption == ''
    - name: 核实管理器公开签名身份
      env:
        KSU_VARIANT: ${{ inputs.variant }}
        MANAGER_PACKAGE: ${{ needs.prepare-matrix.outputs.manager_package }}
        MANAGER_CERT_SIZE: ${{ needs.prepare-matrix.outputs.manager_cert_size }}
        MANAGER_CERT_SHA256: ${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import sys
        sys.path.insert(0, 'tools')
        from prepare_manager_lkm import public_identity
        path = Path('manager-public-certificate.json')
        path.write_text(json.dumps({
            'manager_package': os.environ['MANAGER_PACKAGE'],
            'manager_cert_size': os.environ['MANAGER_CERT_SIZE'],
            'manager_cert_sha256': os.environ['MANAGER_CERT_SHA256'],
        }, sort_keys=True) + '\n', encoding='utf-8')
        public_identity(path)
        PY
      if: needs.prepare-matrix.outputs.manager_adoption == ''
    - name: 还原匹配源码和签名的原生模块
      id: lkm-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: manager-lkm/${{ matrix.kmi }}
        key: gki-sukisu-lkm-v3-full-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare-matrix.outputs.ksu_ref }}-${{ needs.prepare-matrix.outputs.native_source_version
          }}-${{ needs.prepare-matrix.outputs.manager_package }}-${{ needs.prepare-matrix.outputs.manager_cert_size }}-${{
          needs.prepare-matrix.outputs.manager_cert_sha256 }}-${{ matrix.kmi }}-${{ matrix.ddk_short }}${{ format('-native-{0}',
          hashFiles('tools/build_manager_extras*.sh', 'tools/manager_full_native.py')) }}${{ inputs.variant == 'BakaSU' &&
          format('-kpm-{0}', hashFiles('tools/patches/bakasu-kpm.patch', 'config/bakasu-kpm-port.json')) || '' }}${{ inputs.variant
          != 'SukiSU' && inputs.variant != 'BakaSU' && format('-kpm-{0}', hashFiles('tools/additional_manager_kpm.py', 'tools/patches/bakasu-kpm.patch',
          'config/bakasu-kpm-port.json')) || '' }}
      if: needs.prepare-matrix.outputs.manager_adoption == ''
    - name: 核实已缓存的原生模块
      if: (steps.lkm-cache.outputs.cache-hit == 'true') && needs.prepare-matrix.outputs.manager_adoption == ''
      env:
        KSU_VARIANT: ${{ inputs.variant }}
        MANAGER_PACKAGE: ${{ needs.prepare-matrix.outputs.manager_package }}
        MANAGER_CERT_SIZE: ${{ needs.prepare-matrix.outputs.manager_cert_size }}
        MANAGER_CERT_SHA256: ${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}
        KMI: ${{ matrix.kmi }}
        DDK_IMAGE: ${{ matrix.image }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        set -euo pipefail
        python3 tools/prepare_manager_lkm.py stage --source manager-source   --artifacts "manager-lkm/$KMI" --identity manager-public-certificate.json   --expected-ref "$KSU_REF" --expected-kmis "$KMI"   --report "$RUNNER_TEMP/manager-lkm-verified.json"
        python3 tools/manager_full_native.py stage --source manager-source   --directory manager-lkm --identity manager-public-certificate.json   --expected-ref "$KSU_REF" --kmi "$KMI"
    - name: 编译并核实同版本原生模块
      if: (steps.lkm-cache.outputs.cache-hit != 'true') && needs.prepare-matrix.outputs.manager_adoption == ''
      env:
        KSU_VARIANT: ${{ inputs.variant }}
        MANAGER_PACKAGE: ${{ needs.prepare-matrix.outputs.manager_package }}
        MANAGER_CERT_SIZE: ${{ needs.prepare-matrix.outputs.manager_cert_size }}
        MANAGER_CERT_SHA256: ${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}
        KMI: ${{ matrix.kmi }}
        DDK_IMAGE: ${{ matrix.image }}
        KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      run: |
        set -euo pipefail
        mkdir -p lkm-output
        KSU_VERSION=$(python3 tools/prepare_manager_lkm.py version-code   --source manager-source --expected-ref "$KSU_REF")
        docker pull "$DDK_IMAGE"
