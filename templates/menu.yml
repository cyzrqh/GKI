inputs:
  kernelsu_variant:
    description: KernelSU 变体
    required: true
    type: choice
    options:
    - Official
    - BakaSU
    - SukiSU
    - None
    default: BakaSU
  kernelsu_branch:
    description: KSU 分支
    required: true
    type: choice
    options:
    - Stable(标准)
    - Dev(开发)
    - Latest(最新)
    - Custom(自定义)
    default: Dev(开发)
  version:
    description: 自定义版本名 (可选)
    required: false
    type: string
    default: ''
  revision:
    description: 修订版本 (如 r11，仅 5.10 需要)
    required: false
    type: string
    default: r11
  build_time:
    description: 自定义构建时间 (可选，N或留空=当前UTC)
    required: false
    type: string
    default: Sun Dec 01 08:10:00 UTC 2024
  kpm_password:
    description: 自定义 KPM 超级密码（留空=使用默认密码）
    required: false
    type: string
    default: ''
  enable_susfs:
    description: 启用 SUSFS
    required: false
    type: boolean
    default: true
  use_zram:
    description: 启用 ZRAM 增强算法（6.12 跳过 legacy LZ4K 栈）
    required: false
    type: boolean
    default: true
  zram_full_algo:
    description: 启用 ZRAM 完整算法支持（6.12 自动跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS）
    required: false
    type: boolean
    default: true
  zram_extra_algos:
    description: 自定义 ZRAM 算法（逗号分隔，如 lzo,lz4,deflate,zstd；6.12 会忽略 lz4k/lz4kd/lz4k_oplus）
    required: false
    type: string
    default: ''
  use_bbg:
    description: 启用 BBG 防格机
    required: false
    type: boolean
    default: true
  use_ddk:
    description: 启用 DDK 防格机 LSM
    required: false
    type: boolean
    default: true
  use_ntsync:
    description: 启用 NTsync
    required: false
    type: boolean
    default: true
  use_networking:
    description: 启用网络增强（IPSet + BBR）
    required: false
    type: boolean
    default: true
  use_kpm:
    description: 启用 KPM 功能
    required: false
    type: boolean
    default: true
  use_rekernel:
    description: 启用 Re-Kernel 驱动
    required: false
    type: boolean
    default: true
  supp_op:
    description: 启用一加 8E 支持
    required: false
    type: boolean
    default: true
  virtualization_support:
    description: '虚拟化支持 (5.10~6.6: 槽位补丁, 6.12: 开/关；on 在 5.10~6.6 自动使用 678)'
    required: false
    type: choice
    options:
    - 'off'
    - 'on'
    - '678'
    - '123'
    - '345'
    default: 'off'
  custom_external_modules:
    description: 自定义外部模块（兼容旧 repo;stage，也支持 module:repo;stage 与 set:repo#child;stage，用 | 分隔）
    required: false
    type: string
    default: ''
  custom_kernel_options:
    description: 自定义内核选项（每行一条 Kconfig/defconfig 片段）
    required: false
    type: string
    default: ''
  upload_aux_artifacts:
    description: 上传辅助产物
    required: false
    type: boolean
    default: false
  trigger_release:
    description: 触发补发 Release
    required: false
    type: boolean
    default: true
