# Generated by tools/generate_workflow.py; edit the generator to keep changes across updates.
# Locally maintained templates and official-source version catalog.
name: 欧加真全属性内核构建矩阵
run-name: 欧加真 · ${{ inputs.kernelsu_variant }} · ${{ inputs.kernelsu_branch }} · ${{ inputs.build_target || '全部内核' }}
'on':
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: KernelSU 变体
        required: true
        type: choice
        options:
        - SukiSU
        - BakaSU
        - KernelSU-Next
        - KernelSU
        - KowSU
        - FinaSU
        - SukiSU + BakaSU + KernelSU-Next
        default: SukiSU
      kernelsu_branch:
        description: 版本
        required: true
        type: choice
        options:
        - 正式版
        - 最新版
        default: 最新版
      build_target:
        description: 编译目标（可单独编译一个平台和内核）
        required: true
        type: choice
        options:
        - 全部内核
        - 骁龙 · 6.1.57
        - 骁龙 · 6.1.75
        - 天玑 · 6.1.115
        - 骁龙 · 6.1.118
        - 天玑 · 6.1.128
        - 天玑 · 6.1.134
        - 骁龙 · 6.1.141
        - 骁龙 · 6.6.30
        - 天玑 · 6.6.50
        - 骁龙 · 6.6.56
        - 骁龙 · 6.6.57
        - 骁龙 · 6.6.66
        - 骁龙 · 6.6.89
        - 天玑 · 6.6.89
        - 骁龙 · 6.6.118
        - 骁龙 · 6.12.23
        - 天玑 · 6.12.23
        - 通用 GKI · 6.12.23
        - 骁龙 · 6.12.38
        - 骁龙 · 6.12.58
        - 天玑 · 6.12.58
        - 通用 GKI · 6.12.69
        default: 全部内核
      enable_susfs:
        description: 启用 SUSFS（android14/6.1、android15/6.6、android16/6.12）
        required: false
        type: boolean
        default: true
      use_kpm:
        description: 启用 KPM（仅 SukiSU/BakaSU 生效）
        required: false
        type: boolean
        default: true
      use_lz4kd:
        description: 启用 lz4kd
        required: false
        type: boolean
        default: true
      use_bbg:
        description: 启用 BBG 基带防护
        required: false
        type: boolean
        default: false
      use_bbr:
        description: 启用 BBR
        required: false
        type: boolean
        default: false
      use_proxy_optimization:
        description: 启用代理相关网络优化（MTK 会自动关闭）
        required: false
        type: boolean
        default: false
      use_unicode_bypass:
        description: 启用 Unicode 零宽绕过修复
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare-matrix:
    name: 固定全部原生构建方案、官方管理器与构建依赖
    runs-on: ubuntu-24.04
    if: (github.event_name == 'workflow_dispatch') && !(inputs.kernelsu_variant == 'SukiSU + BakaSU + KernelSU-Next')
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
      GKI_COMBINED_WORKER: 'false'
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      source_cache_key: ${{ steps.source-snapshot.outputs.source_cache_key }}
      source_identity: ${{ steps.source-identity.outputs.source_identity }}
      susfs_sources: ${{ steps.shared-susfs.outputs.susfs_sources }}
      ddk_matrix: ${{ steps.lkm-matrix.outputs.matrix }}
      manager_package: ${{ steps.certificate.outputs.package }}
      manager_cert_size: ${{ steps.certificate.outputs.cert_size }}
      manager_cert_sha256: ${{ steps.certificate.outputs.cert_sha256 }}
      ksu_ref: ${{ steps.sources.outputs.ksu_ref }}
      ksu_repo: ${{ steps.sources.outputs.ksu_repo }}
      ksu_short: ${{ steps.sources.outputs.ksu_short }}
      ksu_source_branch: ${{ steps.sources.outputs.ksu_source_branch }}
      effective_ksu_branch: ${{ steps.sources.outputs.effective_ksu_branch }}
      full_catalog: ${{ steps.matrix.outputs.full_catalog }}
      ak3_ref: ${{ steps.oplus-deps.outputs.ak3_ref }}
      patches_ref: ${{ steps.oplus-deps.outputs.patches_ref }}
    steps: &id001
    - name: 检出 gki
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 准备构建配置与 APK 签名验证依赖
      run: python3 -c 'import yaml, cryptography' || python3 -m pip install --break-system-packages --disable-pip-version-check
        PyYAML cryptography
    - name: 验证欧加真源码、构建方法与原生配套校验
      run: |-
        set -euo pipefail
        command -v cc >/dev/null
        python3 -m unittest discover -s tests -p 'test_oplus_*.py'
        python3 -m unittest discover -s tests -p 'test_susfs_map_compat.py'
    - name: 验证管理器原生生命周期及真实 C 状态行为
      run: python3 -m unittest discover -s tests -p 'test_manager_port_native.py'
    - name: 检查管理器构建脚本
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      run: for script in tools/build_sukisu_manager.sh tools/build_bakasu_manager.sh; do bash -n "$script" || exit 1; done
    - name: 选择固定源码、平台与完整内核版本
      id: matrix
      env:
        GH_TOKEN: ${{ github.token }}
        OPLUS_TARGET: ${{ inputs.build_target }}
      run: python3 tools/oplus_cctv.py --target "$OPLUS_TARGET" --github-output --summary
    - name: 固定原生 AnyKernel3 与可选 Unicode 补丁
      id: oplus-deps
      env:
        GH_TOKEN: ${{ github.token }}
        UNICODE_BYPASS: ${{ inputs.use_unicode_bypass }}
      run: python3 tools/oplus_cctv.py --prepare-deps --unicode-bypass "$UNICODE_BYPASS"
    - name: 验证 BakaSU KPM 原生接口与补丁
      if: github.event_name == 'workflow_dispatch' && (true || false) && env.KSU_VARIANT == 'BakaSU'
      run: |
        set -euo pipefail
        command -v cc >/dev/null
        python3 -m unittest discover -s tests -p 'test_bakasu_kpm_backend.py'
        python3 -m unittest discover -s tests -p 'test_bakasu_kpm_port.py'
    - name: 固定本次 KernelSU 与管理器源码
      id: sources
      env:
        KSU_VARIANT: ${{ env.KSU_VARIANT }}
        KSU_TIER: ${{ inputs.kernelsu_branch }}
        CUSTOM_REF: ''
        ENABLE_SUSFS: ${{ (inputs.enable_susfs && env.KSU_VARIANT != 'KowSU') }}
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/resolve_build_sources.py --variant "$KSU_VARIANT" --tier "$KSU_TIER" \
          --custom-ref "$CUSTOM_REF" --susfs "$ENABLE_SUSFS"
    - name: 读取固定签名的公开证书
      id: certificate
      if: github.event_name == 'workflow_dispatch' && (true || false) && (env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT ==
        'BakaSU')
      env:
        SUKISU_APK_KEYSTORE: ${{ secrets.SUKISU_APK_KEYSTORE }}
        SUKISU_APK_PASSWORD: ${{ secrets.SUKISU_APK_PASSWORD }}
      run: python3 tools/export_manager_certificate.py --output "$RUNNER_TEMP/manager-public-certificate.json"
    - name: 选择官方镜像修补构建环境
      id: lkm-matrix
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      run: |
        python3 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from manager_lkm_jobs import load_ddk_matrix
        matrix = {'include':load_ddk_matrix(pathlib.Path.cwd())}
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
        PY
    - name: 仅下载一次官方管理器源码
      uses: actions/checkout@v6
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      with:
        repository: ${{ steps.sources.outputs.ksu_repo }}
        ref: ${{ steps.sources.outputs.ksu_ref }}
        path: ksu-snapshot-source
        fetch-depth: 0
        persist-credentials: false
    - name: 矩阵展开前统一下载并固定 SUSFS
      id: shared-susfs
      if: github.event_name == 'workflow_dispatch' && true && (inputs.enable_susfs && env.KSU_VARIANT != 'KowSU')
      env:
        SUSFS_MATRIX: ${{ steps.matrix.outputs.matrix }}
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        KSU_TIER: ${{ steps.sources.outputs.effective_ksu_branch }}
      run: |
        python3 tools/shared_susfs_source.py prepare --source "$GITHUB_WORKSPACE/ksu-snapshot-source" \
          --matrix-json "$SUSFS_MATRIX" --expected-ref "$KSU_REF" --variant "$KSU_VARIANT" \
          --tier "$KSU_TIER" --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/susfs-sources.json"
    - name: 展开矩阵前验证并固定源码快照
      id: source-snapshot
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      env:
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
        KSU_TIER: ${{ steps.sources.outputs.effective_ksu_branch }}
        ENABLE_SUSFS: ${{ true && (inputs.enable_susfs && env.KSU_VARIANT != 'KowSU') || false }}
      run: |
        set -euo pipefail
        snapshot_args=()
        if [ "$ENABLE_SUSFS" = true ]; then
          snapshot_args+=(--susfs-sources "$RUNNER_TEMP/susfs-sources.json")
        fi
        python3 tools/snapshot_ksu_source.py --source "$GITHUB_WORKSPACE/ksu-snapshot-source" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER" "${snapshot_args[@]}"
        if [ "$KSU_VARIANT" = BakaSU ]; then
          python3 tools/checkout_ksu_snapshot.py --input "$GITHUB_WORKSPACE/ksu-source-bundle" \
            --output "$RUNNER_TEMP/bakasu-symbol-preflight" --expected-ref "$KSU_REF" --variant BakaSU
          python3 tools/ensure_bakasu_symbol_lookup.py --kernel-root "$RUNNER_TEMP/bakasu-symbol-preflight" \
            --ksu-dir kernel --expected-ref "$KSU_REF"
        fi
        python3 - <<'PY'
        import os,sys
        sys.path.insert(0,'tools')
        from snapshot_ksu_source import expected_commit
        reference = expected_commit(os.environ['KSU_REF'])
        key = '-'.join(('gki-source-v1', os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH'],
                        os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], reference))
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('source_cache_key='+key+'\n')
        PY
    - name: 固定源码树和管理器版本身份
      id: source-identity
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      env:
        KSU_REF: ${{ steps.sources.outputs.ksu_ref }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,'tools')
        from checkout_ksu_snapshot import read_manifest
        from transfer_ksu_snapshot import prepared_identity
        manifest = read_manifest(pathlib.Path('ksu-source-bundle'),os.environ['KSU_REF'],variant=os.environ['KSU_VARIANT'])
        document = {key:manifest[key] for key in ('ref','git_tree','git_count','git_describe')}
        if 'susfs_sources' in manifest:
            document['susfs_sources'] = manifest['susfs_sources']
        identity = prepared_identity(document,os.environ['KSU_REF'])
        with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('source_identity='+json.dumps(identity,separators=(',',':'))+'\n')
        PY
    - name: 保存本次不可变源码缓存
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      with:
        path: ksu-source-bundle
        key: ${{ steps.source-snapshot.outputs.source_cache_key }}
    - name: 确认所有构建可读取本次源码缓存
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      if: github.event_name == 'workflow_dispatch' && (true || false) && ((env.KSU_VARIANT == 'SukiSU' || env.KSU_VARIANT
        == 'BakaSU') || (env.KSU_VARIANT == 'KernelSU-Next' || env.KSU_VARIANT == 'KernelSU' || env.KSU_VARIANT == 'KowSU'
        || env.KSU_VARIANT == 'FinaSU'))
      with:
        path: ksu-source-bundle
        key: ${{ steps.source-snapshot.outputs.source_cache_key }}
        lookup-only: true
        fail-on-cache-miss: false
    - name: 自动删除已成功的清理记录
      if: always() && !cancelled()
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/remove_successful_cleanup_runs.py --repo "$GITHUB_REPOSITORY" --execute
  build-sukisu-lkm:
    name: ${{ inputs.kernelsu_variant }} 原生模块 / ${{ matrix.kmi }}
    needs: prepare-matrix
    if: github.event_name == 'workflow_dispatch' && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KSU_VARIANT: ${{ inputs.kernelsu_variant }}
      GKI_PREPARE_SOURCE_CACHE_KEY: ${{ needs.prepare-matrix.outputs.source_cache_key }}
      GKI_PREPARE_KSU_REF: ${{ needs.prepare-matrix.outputs.ksu_ref }}
      GKI_PREPARE_SOURCE_IDENTITY: ${{ needs.prepare-matrix.outputs.source_identity }}
      GKI_PREPARE_EFFECTIVE_KSU_BRANCH: ${{ needs.prepare-matrix.outputs.effective_ksu_branch }}
      GKI_PREPARE_MANAGER_PACKAGE: ${{ needs.prepare-matrix.outputs.manager_package }}
      GKI_PREPARE_MANAGER_CERT_SIZE: ${{ needs.prepare-matrix.outputs.manager_cert_size }}
      GKI_PREPARE_MANAGER_CERT_SHA256: ${{ needs.prepare-matrix.outputs.manager_cert_sha256 }}
      GKI_COMBINED_WORKER: 'false'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.ddk_matrix) }}
    steps: &id002
    - name: 检出构建工具
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: 还原本次固定源码缓存
      id: source-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ksu-source-bundle
        key: ${{ env.GKI_PREPARE_SOURCE_CACHE_KEY }}
        fail-on-cache-miss: false
    - name: 从官方固定提交恢复并核实源码
      id: source-backup
      if: steps.source-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        KSU_VARIANT: ${{ env.KSU_VARIANT }}
        KSU_REF: ${{ env.GKI_PREPARE_KSU_REF }}
        PREPARED_SOURCE_IDENTITY: ${{ env.GKI_PREPARE_SOURCE_IDENTITY }}
        KSU_TIER: ${{ env.GKI_PREPARE_EFFECTIVE_KSU_BRANCH }}
        ENABLE_SUSFS: ${{ true && (inputs.enable_susfs && env.KSU_VARIANT != 'KowSU') || false }}
      run: |
        python3 tools/transfer_ksu_snapshot.py restore-official \
          --expected-ref "$KSU_REF" \
          --output "$GITHUB_WORKSPACE/ksu-source-bundle" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY" --root "$GITHUB_WORKSPACE" \
          --susfs "$ENABLE_SUSFS" --tier "$KSU_TIER"
    - name: 重新缓存本次已验证的固定源码
      uses: actions/cache/save@v5
      timeout-minutes: 3
      continue-on-error: true
      if: steps.source-cache.outputs.cache-hit != 'true' && steps.source-backup.outcome == 'success'
      with:
        path: ksu-source-bundle
        key: ${{ env.GKI_PREPARE_SOURCE_CACHE_KEY }}
    - name: 核对固定源码与准备任务的完整身份
      env:
        KSU_REF: ${{ env.GKI_PREPARE_KSU_REF }}
        PREPARED_SOURCE_IDENTITY: ${{ env.GKI_PREPARE_SOURCE_IDENTITY }}
      run: |
        python3 tools/transfer_ksu_snapshot.py verify-cache \
          --source "$GITHUB_WORKSPACE/ksu-source-bundle" --expected-ref "$KSU_REF" \
          --prepared-identity "$PREPARED_SOURCE_IDENTITY"
    - name: 还原并核实管理器源码
      env:
        KSU_REF: ${{ env.GKI_PREPARE_KSU_REF }}
        KSU_VARIANT: ${{ env.KSU_VARIANT }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE/manager-source"
        python3 tools/checkout_ksu_snapshot.py --input ksu-source-bundle   --output manager-source --expected-ref "$KSU_REF"
    - name: 核实管理器公开签名身份
      env:
        KSU_VARIANT: ${{ env.KSU_VARIANT }}
        MANAGER_PACKAGE: ${{ env.GKI_PREPARE_MANAGER_PACKAGE }}
        MANAGER_CERT_SIZE: ${{ env.GKI_PREPARE_MANAGER_CERT_SIZE }}
        MANAGER_CERT_SHA256: ${{ env.GKI_PREPARE_MANAGER_CERT_SHA256 }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import sys
        sys.path.insert(0, 'tools')
        from prepare_manager_lkm import public_identity
        path = Path('manager-public-certificate.json')
        path.write_text(json.dumps({
            'manager_package': os.environ['MANAGER_PACKAGE'],
            'manager_cert_size': os.environ['MANAGER_CERT_SIZE'],
            'manager_cert_sha256': os.environ['MANAGER_CERT_SHA256'],
        }, sort_keys=True) + '\n', encoding='utf-8')
        public_identity(path)
        PY
    - name: 还原匹配源码和签名的原生模块
      id: lkm-cache
      uses: actions/cache/restore@v5
      timeout-minutes: 3
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: manager-lkm/${{ matrix.kmi }}
        key: gki-sukisu-lkm-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.GKI_PREPARE_KSU_REF }}-${{ env.GKI_PREPARE_MANAGER_PACKAGE
          }}-${{ env.GKI_PREPARE_MANAGER_CERT_SIZE }}-${{ env.GKI_PREPARE_MANAGER_CERT_SHA256 }}-${{ matrix.kmi }}-${{ matrix.ddk_short
          }}${{ env.KSU_VARIANT == 'BakaSU' && format('-kpm-{0}', hashFiles('tools/patches/bakasu-kpm.patch', 'config/bakasu-kpm-port.json'))
          || '' }}
    - name: 核实已缓存的原生模块
      if: steps.lkm-cache.outputs.cache-hit == 'true'
      env:
        KSU_VARIANT: ${{ env.KSU_VARIANT }}
        MANAGER_PACKAGE: ${{ env.GKI_PREPARE_MANAGER_PACKAGE }}
        MANAGER_CERT_SIZE: ${{ env.GKI_PREPARE_MANAGER_CERT_SIZE }}
        MANAGER_CERT_SHA256: ${{ env.GKI_PREPARE_MANAGER_CERT_SHA256 }}
        KMI: ${{ matrix.kmi }}
        DDK_IMAGE: ${{ matrix.image }}
        KSU_REF: ${{ env.GKI_PREPARE_KSU_REF }}
      run: |
        set -euo pipefail
        python3 tools/prepare_manager_lkm.py stage --source manager-source   --artifacts "manager-lkm/$KMI" --identity manager-public-certificate.json   --expected-ref "$KSU_REF" --expected-kmis "$KMI"   --report "$RUNNER_TEMP/manager-lkm-verified.json"
    - name: 编译并核实同版本原生模块
      if: steps.lkm-cache.outputs.cache-hit != 'true'
      env:
        KSU_VARIANT: ${{ env.KSU_VARIANT }}
        MANAGER_PACKAGE: ${{ env.GKI_PREPARE_MANAGER_PACKAGE }}
        MANAGER_CERT_SIZE: ${{ env.GKI_PREPARE_MANAGER_CERT_SIZE }}
        MANAGER_CERT_SHA256: ${{ env.GKI_PREPARE_MANAGER_CERT_SHA256 }}
        KMI: ${{ matrix.kmi }}
        DDK_IMAGE: ${{ matrix.image }}
        KSU_REF: ${{ env.GKI_PREPARE_KSU_REF }}
      run: |
        set -euo pipefail
        mkdir -p lkm-output
        KSU_VERSION=$(python3 tools/prepare_manager_lkm.py version-code   --source manager-source --expected-ref "$KSU_REF")
        docker pull "$DDK_IMAGE"
        docker run --rm --network none   --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"   --workdir "$GITHUB_WORKSPACE/manager-source/kernel"   --env HOME=/tmp --env KSU_PACKAGE_NAME="$MANAGER_PACKAGE"   --env KSU_EXPECTED_SIZE="$MANAGER_CERT_SIZE"   --env KSU_EXPECTED_HASH="$MANAGER_CERT_SHA256" --env KSU_VERSION="$KSU_VERSION"   --env MODULE_OUTPUT="$GITHUB_WORKSPACE/lkm-output/${KMI}_kernelsu.ko"   --env KSU_MANAGER_PACKAGE="$MANAGER_PACKAGE" --env KSU_VARIANT="$KSU_VARIANT" --entrypoint /bin/bash "$DDK_IMAGE" -euo pipefail -c '
